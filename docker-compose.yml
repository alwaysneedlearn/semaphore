version: "3.8"

services:
  mysql:
    container_name: semaphore-mysql
    image: mysql:8.0
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./semaphore-mysql:/var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: semaphore
      MYSQL_USER: semaphore
      MYSQL_PASSWORD: Semaphore@2024 # ⚠️ 请修改为强密码
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  semaphore:
    container_name: semaphore-ui
    image: semaphoreui/semaphore:local # ⚠️ 使用稳定版本，不要用 latest
    ports:
      - "3000:3000"
    user: "0:0"
    environment:
      SEMAPHORE_DB_DIALECT: mysql
      SEMAPHORE_DB_HOST: mysql
      SEMAPHORE_DB_PORT: 3306
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: Semaphore@2024
      SEMAPHORE_DB: semaphore
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: Admin@123
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      # SEMAPHORE_ACCESS_KEY_ENCRYPTION: "your_base64_key_here"  # 用 head -c32 /dev/urandom | base64 生成
      SEMAPHORE_PLAYBOOK_PATH: /workspace/cursor-playbooks/
      TZ: Asia/Shanghai
    volumes:
      # 配置文件持久化
      - ./semaphore-config:/etc/semaphore
      # 数据文件持久化 (BoltDB 数据存储在这里)
      - ./semaphore-data:/var/lib/semaphore
      # playbook (Cursor 云环境绝对路径)
      - /workspace/cursor-playbooks:/workspace/cursor-playbooks
      # neware安装包
      - ./neware:/root/neware
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
