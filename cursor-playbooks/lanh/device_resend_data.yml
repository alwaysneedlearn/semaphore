---
# LANH 重发数据：HTTP Redeliver（同 LAND SyncLims），不启停程序。
- name: LANH 重发数据（HTTP Redeliver）
  hosts: windows_hosts
  strategy: free
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
    sem_operation_type: resend_data
    sem_operation_force_log: true
    sem_debug_tag: LANH
    lanh_api_scheme: "{{ (lookup('env', 'LANH_API_SCHEME') | default(lookup('env', 'LAND_API_SCHEME') | default('', true), true) | trim) | default('http', true) }}"
    lanh_api_port: "{{ ((lookup('env', 'LANH_API_PORT') | default(lookup('env', 'LAND_API_PORT') | default('', true), true) | trim) | default('8080', true)) | int }}"
    lanh_api_redeliver_path: "{{ (lookup('env', 'LANH_API_REDELIVER_PATH') | default(lookup('env', 'LAND_API_REDELIVER_PATH') | default('', true), true) | trim) | default('/SyncLims/Redeliver', true) }}"
    lanh_api_timeout: "{{ ((lookup('env', 'LANH_API_TIMEOUT') | default(lookup('env', 'LAND_API_TIMEOUT') | default('', true), true) | trim) | default('8', true)) | int }}"
    lanh_api_token: "{{ (lookup('env', 'LANH_API_TOKEN') | default(lookup('env', 'LAND_API_TOKEN') | default('', true), true) | trim) | default('landapi', true) }}"
    lanh_api_verify_tls: "{{ ((lookup('env', 'LANH_API_VERIFY_TLS') | default(lookup('env', 'LAND_API_VERIFY_TLS') | default('', true), true) | trim) | default('true', true)) | bool }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_resolve_device_row.yml"
    - block:
        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"
      ignore_unreachable: true

    - ansible.builtin.set_fact:
        _lanh_target_host: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_resend_apply_from_params.yml"
    - ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/lanh_api_redeliver.yml"

    - ansible.builtin.set_fact:
        lanh_redeliver_ok: "{{ (_lanh_api_redeliver is defined) and not (_lanh_api_redeliver.skipped | default(false)) and ((_lanh_api_redeliver.status | default(0) | int) == 200) }}"

  post_tasks:
    - ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _sem_display_hostname }}"
          ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
          device_status: "{{ 'healthy' if (lanh_redeliver_ok | default(false) | bool) else 'unhealthy' }}"
          winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
          api_status: "{{ 'online' if (lanh_redeliver_ok | default(false) | bool) else 'offline' }}"
          abnormal_reason: "{{ '' if (lanh_redeliver_ok | default(false) | bool) else 'LANH Redeliver API failed or invalid time range' }}"

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record.yml"

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_operation_logs.yml"
