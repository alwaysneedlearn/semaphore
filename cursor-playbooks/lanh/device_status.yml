---
# LANH 状态巡检：QueryStatus API 优先（同 LAND SyncLims）；API 未健康时 WinRM/进程参考。
- name: LANH 状态巡检（API 优先 + 进程参考）
  hosts: windows_hosts
  strategy: free
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_profile_tasks_dir: "{{ playbook_dir }}/../land/tasks"
    sem_land_tasks_dir: "{{ playbook_dir }}/../land/tasks"
    sem_files_dir: "{{ playbook_dir }}/../shared/files"
    sem_debug_tag: LANH
    sem_operation_type: status
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('C:\\Program Files\\LANH', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    exe_dir_fallback_drives: "{{ (lookup('env', 'EXE_DIR_FALLBACK_DRIVES') | default('', true) | trim) | default('D,E,C', true) }}"
    exe_scan_latest: "{{ ((lookup('env', 'EXE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool }}"
    exe_scan_max_depth: "{{ ((lookup('env', 'EXE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('3', true)) | int }}"
    _exe_name_default: ccsmon.exe
    _exe_name_env: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) }}"
    _exe_name_base: "{{ (_exe_name_env if (_exe_name_env | length > 0) else _exe_name_default) | regex_replace('(?i)\\.exe$', '') }}"
    exe_name: "{{ _exe_name_base ~ '.exe' }}"
    _app_dir_env: "{{ (lookup('env', 'APP_DIR') | default('', true) | trim) }}"
    app_dir: "{{ _app_dir_env if (_app_dir_env | length > 0) else '.' }}"
    exe_path: "{% if app_dir in ['.', ''] %}{{ exe_dir }}\\{{ exe_name }}{% else %}{{ exe_dir }}\\{{ app_dir }}\\{{ exe_name }}{% endif %}"
    process_name: "{{ ((lookup('env', 'PROCESS_NAME') | default('', true) | trim) | regex_replace('(?i)\\.exe$', '')) | default(_exe_name_base, true) }}"
    land_api_scheme: "{{ (lookup('env', 'LANH_API_SCHEME') | default(lookup('env', 'LAND_API_SCHEME') | default('', true), true) | trim) | default('http', true) }}"
    land_api_port: "{{ ((lookup('env', 'LANH_API_PORT') | default(lookup('env', 'LAND_API_PORT') | default('', true), true) | trim) | default('8080', true)) | int }}"
    land_api_status_path: "{{ (lookup('env', 'LANH_API_STATUS_PATH') | default(lookup('env', 'LAND_API_STATUS_PATH') | default('', true), true) | trim) | default('/SyncLims/QueryStatus', true) }}"
    land_api_timeout: "{{ ((lookup('env', 'LANH_API_TIMEOUT') | default(lookup('env', 'LAND_API_TIMEOUT') | default('', true), true) | trim) | default('8', true)) | int }}"
    land_api_token: "{{ (lookup('env', 'LANH_API_TOKEN') | default(lookup('env', 'LAND_API_TOKEN') | default('', true), true) | trim) | default('landapi', true) }}"
    land_api_verify_tls: "{{ ((lookup('env', 'LANH_API_VERIFY_TLS') | default(lookup('env', 'LAND_API_VERIFY_TLS') | default('', true), true) | trim) | default('true', true)) | bool }}"
    land_query_status_require_real_status: "{{ ((lookup('env', 'LANH_QUERY_STATUS_REQUIRE_REAL_STATUS') | default(lookup('env', 'LAND_QUERY_STATUS_REQUIRE_REAL_STATUS') | default('', true), true) | trim) | default('true', true)) | bool }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_resolve_device_row.yml"

    - name: LANH QueryStatus API（Patrol 首要判定）
      ansible.builtin.include_tasks: "{{ sem_land_tasks_dir }}/land_api_query_status.yml"

    - name: LANH API 已健康（跳过 WinRM/进程参考）
      when: land_api_status_ok | default(false) | bool
      block:
        - name: WinRM 参考探测（仅填写 winrm_status）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_probe_reference_only.yml"
          vars:
            winrm_probe_reference_label: "LANH Patrol API 快路径"

        - name: 登记 Semaphore 状态回调行（API 健康快路径）
          ansible.builtin.set_fact:
            need_reconfigure: false
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: healthy
              winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
              api_status: online
              abnormal_reason: >-
                {{
                  'WinRM unreachable (API healthy; reference only)'
                  if not (_winrm_session_ok | default(false) | bool)
                  else ''
                }}

        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/debug_sync_api_patrol_snapshot.yml"

        - name: API 健康 — 结束本主机
          ansible.builtin.meta: end_host

    - name: LANH API 不可达或非 2xx — 快速失败
      when: not (land_api_http_ok | default(false) | bool)
      block:
        - name: 登记 Semaphore 状态回调行（API 快速失败）
          ansible.builtin.set_fact:
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: unhealthy
              winrm_status: offline
              api_status: offline
              abnormal_reason: >-
                {{
                  'API unreachable: ' ~ (_land_api_status_raw.msg | default('connection failed') | string)
                  if (_land_api_status_raw.status | default(0) | int) in [0, -1]
                  else 'API HTTP ' ~ (_land_api_status_raw.status | default(0) | string) ~ ' (expected 2xx)'
                }}

        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/debug_sync_api_patrol_snapshot.yml"

        - name: API 快速失败 — 结束本主机
          ansible.builtin.meta: end_host

    - name: LANH API 2xx 但未达健康 — WinRM/进程参考检查
      when:
        - land_api_http_ok | default(false) | bool
        - not (land_api_status_ok | default(false) | bool)
      block:
        - name: WinRM 建连（含重试）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"

        - name: WinRM 未连通则不再执行本主机后续步骤
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"

        - name: 部署 Windows 启动辅助脚本
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"

        - name: 解析 EXE_DIR（盘符回退）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/resolve_exe_dir_windows.yml"

        - name: 检查 LANH 进程状态
          ansible.windows.win_shell: |
            $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $p) {
              $wsMb = [math]::Round($p.WorkingSet64 / 1MB, 1)
              "RUNNING|pid=$($p.Id)|ws=${wsMb}MB|path=$($p.Path)"
            } else {
              "NOT_RUNNING"
            }
          register: _lanh_process_check
          changed_when: false
          ignore_unreachable: true

        - name: 状态判断并组装回调行（参考路径）
          ansible.builtin.set_fact:
            need_reconfigure: "{{ _lanh_need_reconfig | bool }}"
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: "{{ 'healthy' if not (_lanh_need_reconfig | bool) else 'unhealthy' }}"
              winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
              api_status: "{{ 'online' if not (_lanh_need_reconfig | bool) else 'offline' }}"
              abnormal_reason: "{{ _lanh_abnormal_reason | trim }}"
          vars:
            _lanh_proc_out: "{{ ((_lanh_process_check | default({})).stdout | default('')) | trim }}"
            _lanh_proc_running: "{{ (_lanh_proc_out.split('|') | first) == 'RUNNING' }}"
            _lanh_need_reconfig: >-
              {{
                (not (_lanh_proc_running | bool))
                or (not (land_api_status_ok | default(false) | bool))
              }}
            _lanh_abnormal_reason: >-
              {% if not (_lanh_proc_running | bool) %}Process not running: {{ process_name }} ({{ _lanh_proc_out }})
              {% elif not (land_api_status_ok | default(false) | bool) %}API QueryStatus: real_status={{ land_api_real_status | default('n/a') }} history_status={{ land_api_history_status | default('n/a') }} body={{ (_land_api_status_raw.content | default('') | string) | truncate(200, True) }}
              {% else %}{% endif %}

        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/debug_sync_api_patrol_snapshot.yml"

  post_tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record.yml"
      when: semaphore_callback_row is defined

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_operation_logs.yml"
