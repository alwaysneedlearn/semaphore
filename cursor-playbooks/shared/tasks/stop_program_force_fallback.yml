---
# WinRM force stop when graceful interactive stop did not end the process.
# Uses alive thresholds (Handles/WS) — zombie PIDs count as stopped.

- name: 停止程序（强制结束回退）
  environment:
    VERIFY_PROCESS_NAME: "{{ stop_verify_process_name | default(stop_graceful_process_name, true) }}"
    PROCESS_ALIVE_MIN_HANDLES: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_HANDLES') | default('', true) | trim) | default('1', true) }}"
    PROCESS_ALIVE_MIN_WS_KB: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_WS_KB') | default('', true) | trim) | default('512', true) }}"
  ansible.windows.win_shell: >-
    & 'C:\Windows\Temp\sem_force_stop_process_by_name_windows.ps1'
  register: stop_force_fallback_result
  changed_when: >-
    stop_force_fallback_result is defined and
    'FORCE_STOPPED' in (stop_force_fallback_result.stdout | default(''))
  when: >
    stop_graceful_result is defined and
    not (stop_graceful_result.unreachable | default(false)) and
    'NOT_RUNNING' not in (stop_graceful_result.stdout | default('')) and
    'ALREADY_STOPPED' not in (stop_graceful_result.stdout | default('')) and
    'FORCE_STOPPED' not in (stop_graceful_result.stdout | default(''))
