---
# Resolve EXE_DIR drive like NEWARE: preferred drive first, then fallbacks.
# LAND: set app_dir + EXE_DIR_FALLBACK_DRIVES (e.g. D,F); probes APP_DIR\EXE on each drive.
# Requires deploy_sem_windows_helper_scripts.yml (auto-included when sem_tasks_dir set).

- name: 确保 Windows 辅助脚本已部署
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"
  when:
    - sem_tasks_dir is defined
    - (sem_tasks_dir | trim | length) > 0

- name: 解析 EXE_DIR（盘符回退）
  environment:
    SEMAPHORE_EXE_DIR_PREFERRED: "{{ exe_dir_preferred | default('', true) }}"
    SEMAPHORE_EXE_DIR_FALLBACK_DRIVES: >-
      {{
        (exe_dir_fallback_drives | default('', true) | trim)
        if ((exe_dir_fallback_drives | default('', true) | trim) | length > 0)
        else (lookup('env', 'EXE_DIR_FALLBACK_DRIVES') | default('', true) | trim)
      }}
    SEMAPHORE_EXE_PROBE_RELATIVE: >-
      {{
        (
          exe_name
          if (app_dir | default('')) in ['.', '']
          else (app_dir ~ '\\' ~ exe_name)
        )
        if (app_dir is defined) else ''
      }}
    SEMAPHORE_EXE_SCAN_LATEST: "{{ (exe_scan_latest | default(false) | bool) | string | lower }}"
    SEMAPHORE_EXE_SCAN_MAX_DEPTH: "{{ exe_scan_max_depth | default(2) | string }}"
    SEMAPHORE_EXE_SCAN_NAME: "{{ exe_name | default('', true) }}"
  ansible.builtin.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Temp\sem_resolve_exe_dir_windows.ps1
  register: _resolve_exe_dir
  changed_when: false

- name: 登记 EXE_DIR 解析行
  ansible.builtin.set_fact:
    _exe_dir_resolved_line: "{{ (_resolve_exe_dir.stdout_lines | default([]) | select('search', 'EXE_DIR_RESOLVED=') | list | first) | default('EXE_DIR_RESOLVED=' + exe_dir_preferred, true) }}"
    _exe_path_resolved_line: "{{ (_resolve_exe_dir.stdout_lines | default([]) | select('search', 'EXE_PATH_RESOLVED=') | list | first) | default('', true) }}"
    _exe_dir_choose_source_line: "{{ (_resolve_exe_dir.stdout_lines | default([]) | select('search', 'EXE_DIR_CHOOSE_SOURCE=') | list | first) | default('', true) }}"

- name: 登记解析后的 EXE_DIR
  ansible.builtin.set_fact:
    exe_dir: "{{ (_exe_dir_resolved_line | regex_replace('^EXE_DIR_RESOLVED=', '') | trim) }}"

- name: 登记扫描到的 EXE 完整路径（按盘符浅层遍历最新 mtime）
  ansible.builtin.set_fact:
    exe_path: "{{ (_exe_path_resolved_line | regex_replace('^EXE_PATH_RESOLVED=', '') | trim) }}"
    exe_dir: "{{ (_exe_dir_resolved_line | regex_replace('^EXE_DIR_RESOLVED=', '') | trim) }}"
  when:
    - (_exe_path_resolved_line | default('', true) | trim) | length > 0
    - (exe_path_override | default('', true) | trim) | length == 0

- name: 登记解析后的 EXE 路径
  ansible.builtin.set_fact:
    exe_path: >-
      {{
        (exe_dir + '\\' + exe_name)
        if ((app_dir if (app_dir is defined) else (zip_name | default(''))) in ['.', ''])
        else (
          exe_dir + '\\'
          + (app_dir if (app_dir is defined) else (zip_name | default('')))
          + '\\' + exe_name
        )
      }}
  when:
    - exe_name is defined
    - (exe_path_override | default('', true) | trim) | length == 0
    - (_exe_path_resolved_line | default('', true) | trim) | length == 0

- name: 应用每设备完整 EXE 路径覆盖
  ansible.builtin.set_fact:
    exe_path: "{{ exe_path_override }}"
    exe_dir: "{{ exe_path_override | regex_replace('\\\\[^\\\\]+$', '') }}"
  when: (exe_path_override | default('', true) | trim) | length > 0

- name: DEBUG 解析 EXE_DIR 盘符
  ansible.builtin.debug:
    msg:
      - "[DEBUG-EXE_DIR] preferred={{ exe_dir_preferred }}"
      - "[DEBUG-EXE_DIR] resolved={{ exe_dir }} exe_path={{ exe_path | default('n/a') }}"
      - "[DEBUG-EXE_DIR] {{ _exe_dir_choose_source_line | default('') }}"
      - "[DEBUG-EXE_DIR] win_shell={{ _resolve_exe_dir.stdout_lines | default([]) }}"
  when: _resolve_exe_dir is defined
