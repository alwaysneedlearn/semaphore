---
# WinRM 建连重试用尽（win_ping 未成功）。须在 play 中定义 _semaphore_device_rows。
# 由 tasks/winrm_ensure_reachable.yml include；登记 unhealthy 后 end_host，避免 deploy/collect 未写回调导致 UI 停在 checking。

- name: 登记 Semaphore 回调行（WinRM ping 建连失败）
  ansible.builtin.set_fact:
    semaphore_callback_row:
      hostname: "{{ _sem_display_hostname | default((_sem_dev | default({})).hostname | default(hostvars[inventory_hostname].device_hostname | default('', true), true), true) }}"
      ip: "{{ (_sem_dev | default({})).ip | default(inventory_hostname, true) }}"
      device_status: unhealthy
      status: unhealthy
      winrm_status: offline
      api_status: offline
      abnormal_reason: >-
        {{ 'WinRM ping failed after ' ~ (winrm_connect_retries | default(2) | string) ~ ' attempt(s)'
        ~ (': ' ~ _winrm_ping_fail_detail if (_winrm_ping_fail_detail | length > 0) else '') }}
  vars:
    _sem_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"
    _winrm_ping_fail_detail: "{{ (_winrm_ping.msg | default('') | string) | trim }}"

- name: WinRM 建连失败则跳过后续主机任务
  ansible.builtin.meta: end_host
