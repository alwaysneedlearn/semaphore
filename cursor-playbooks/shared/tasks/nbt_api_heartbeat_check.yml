---
# GET /SendStatus — returns last data send time (plain text, e.g. 2026-06-09 13:35:19).
# Play vars: nbt_api_scheme, nbt_api_port, nbt_api_heartbeat_path, _nbt_target_host,
#   nbt_heartbeat_max_age_minutes (default 90), nbt_api_timeout, nbt_api_verify_tls.
# Sets: _nbt_heartbeat, nbt_heartbeat_last_send, nbt_heartbeat_age_minutes, nbt_heartbeat_ok,
#   _nbt_api_status (alias for debug tasks).

- name: NBT 查询心跳（上次发数据时间）
  ansible.builtin.uri:
    url: "{{ nbt_api_scheme }}://{{ _nbt_target_host }}:{{ nbt_api_port }}{{ nbt_api_heartbeat_path }}"
    method: GET
    timeout: "{{ nbt_api_timeout }}"
    validate_certs: "{{ nbt_api_verify_tls }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  register: _nbt_heartbeat
  delegate_to: localhost
  failed_when: false

- name: NBT 解析心跳响应时间
  ansible.builtin.set_fact:
    nbt_heartbeat_last_send: "{{ (_nbt_heartbeat.content | default('') | string | trim | regex_replace('^\"|\"$', '')) }}"

- name: NBT 计算心跳数据年龄
  ansible.builtin.set_fact:
    _nbt_heartbeat_age_seconds: >-
      {{
        (
          (now(fmt='%Y-%m-%d %H:%M:%S') | to_datetime)
          - (nbt_heartbeat_last_send | to_datetime('%Y-%m-%d %H:%M:%S'))
        ).total_seconds() | float
      }}
  when: >
    (_nbt_heartbeat.status | default(0) | int) == 200 and
    (nbt_heartbeat_last_send | default('') | trim | length) > 0
  failed_when: false

- name: NBT 心跳年龄无法解析
  ansible.builtin.set_fact:
    _nbt_heartbeat_age_seconds: -1
  when: >
    (_nbt_heartbeat.status | default(0) | int) != 200 or
    (nbt_heartbeat_last_send | default('') | trim | length) == 0 or
    _nbt_heartbeat_age_seconds is not defined

- name: NBT 判定心跳数据上报正常
  ansible.builtin.set_fact:
    nbt_heartbeat_age_minutes: "{{ ((_nbt_heartbeat_age_seconds | float) / 60) | round(1) }}"
    nbt_heartbeat_ok: true
  when: >
    (_nbt_heartbeat.status | default(0) | int) == 200 and
    (_nbt_heartbeat_age_seconds | default(-1) | float) >= 0 and
    ((_nbt_heartbeat_age_seconds | float) / 60) <= (nbt_heartbeat_max_age_minutes | default(90) | int)

- name: NBT 判定心跳数据上报正常（时钟略超前视为正常）
  ansible.builtin.set_fact:
    nbt_heartbeat_age_minutes: "{{ ((_nbt_heartbeat_age_seconds | float) / 60) | round(1) }}"
    nbt_heartbeat_ok: true
  when: >
    (_nbt_heartbeat.status | default(0) | int) == 200 and
    (_nbt_heartbeat_age_seconds | default(0) | float) < 0

- name: NBT 判定心跳数据上报不正常
  ansible.builtin.set_fact:
    nbt_heartbeat_ok: false
    nbt_heartbeat_age_minutes: >-
      {{
        ((_nbt_heartbeat_age_seconds | default(-1) | float) / 60) | round(1)
        if (_nbt_heartbeat_age_seconds | default(-1) | float) >= 0
        else 'n/a'
      }}
  when: >
    not (
      (
        (_nbt_heartbeat.status | default(0) | int) == 200 and
        (_nbt_heartbeat_age_seconds | default(-1) | float) >= 0 and
        ((_nbt_heartbeat_age_seconds | float) / 60) <= (nbt_heartbeat_max_age_minutes | default(90) | int)
      ) or (
        (_nbt_heartbeat.status | default(0) | int) == 200 and
        (_nbt_heartbeat_age_seconds | default(0) | float) < 0
      )
    )

- name: NBT 心跳结果供巡检 DEBUG 复用
  ansible.builtin.set_fact:
    _nbt_api_status: "{{ _nbt_heartbeat }}"

- name: DEBUG NBT 心跳
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat GET {{ nbt_api_scheme }}://{{ _nbt_target_host }}:{{ nbt_api_port }}{{ nbt_api_heartbeat_path }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat http_status={{ _nbt_heartbeat.status | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat response_body={{ _nbt_heartbeat.content | default('') | string | trim }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat last_send={{ nbt_heartbeat_last_send | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat age_minutes={{ nbt_heartbeat_age_minutes | default('n/a') }} max={{ nbt_heartbeat_max_age_minutes | default(90) }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat ok={{ nbt_heartbeat_ok | default(false) }}"
