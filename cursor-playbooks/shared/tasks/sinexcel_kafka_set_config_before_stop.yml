---
# SetConfig while SINEXCEL process is still running (before graceful stop).

- name: 准备 SINEXCEL KafkaConfig 分类
  ansible.builtin.include_tasks: sinexcel_prepare_merged_cfg.yml
  when: sinexcel_kafka_cfg_flat is not defined

- name: 初始化停止前 SetConfig 结果
  ansible.builtin.set_fact:
    _sinexcel_kafka_set_before_ok: false

- name: 进程运行中：Kafka SetConfig（停止前）
  ansible.builtin.include_tasks: sinexcel_kafka_set_config_attempt.yml
  vars:
    sinexcel_kafka_set_phase: before_stop
  when: >-
    (sinexcel_kafka_cfg_flat | default({}) | length) > 0
    and (
      'RUNNING' in (_sinexcel_process_before_restart.stdout | default(''))
      or 'RUNNING' in (_sinexcel_process_check.stdout | default(''))
      or 'RUNNING' in (_ini_agent_process_before.stdout | default(''))
    )

- name: DEBUG SINEXCEL 停止前未 SetConfig（进程未运行）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] kafka_set phase=before_stop skipped=process_not_running"
  when: >-
    (sinexcel_kafka_cfg_flat | default({}) | length) > 0
    and 'RUNNING' not in (_sinexcel_process_before_restart.stdout | default(''))
    and 'RUNNING' not in (_sinexcel_process_check.stdout | default(''))
    and 'RUNNING' not in (_ini_agent_process_before.stdout | default(''))
