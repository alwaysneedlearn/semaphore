---
# 组装 semaphore_operation_steps（登记记录的前一步）。
# localhost 补建时由 ensure 传入 _sem_delegate_host + loop item。

- name: 组装设备操作步骤
  ansible.builtin.set_fact:
    semaphore_operation_steps: "{{ _op_steps }}"
  delegate_to: "{{ _sem_delegate_host | default(omit) }}"
  delegate_facts: "{{ (_sem_delegate_host is defined) | bool }}"
  when: >-
    (_h.sem_operation_force_log | default(false) | bool)
    or ((_h.semaphore_callback_row | default({})).device_status | default('') | string == 'unhealthy')
    or (_h.sem_operation_restart_performed | default(false) | bool)
  vars:
    _sem_inv_host: "{{ _sem_delegate_host | default(inventory_hostname) }}"
    _h: "{{ hostvars[_sem_inv_host] }}"
    _cb: "{{ _h.semaphore_callback_row | default({}) }}"
    _op_type: "{{ _h.sem_operation_type | default('restart') | string }}"
    _svc_out: "{{ ((_h._jhai_service_status | default(_h._nbt_service_status | default(_h._land_process_check | default(_h._sinexcel_process_check | default({}, true), true), true), true)).stdout | default('')) | trim }}"
    _svc_running: "{{ ((_svc_out.split('|') | first | string | trim) == 'RUNNING') if (_svc_out | length > 0) else (_h.final_start_ok | default(false) | bool) }}"
    _proc_out: "{{ ((_h.status | default(_h.check_result | default({}, true), true)).stdout | default('')) | trim }}"
    _proc_running: "{{ 'NOT_RUNNING' not in (_proc_out | string) if (_proc_out | length > 0) else false }}"
    _status_steps: >-
      {{
        [{
          'step': 'WinRM',
          'result': ('ok' if ((_cb.winrm_status | default('offline') | string) == 'online') else 'failed'),
          'detail': ''
        },
        {
          'step': 'API',
          'result': ('ok' if ((_cb.api_status | default('offline') | string) == 'online') else 'failed'),
          'detail': ''
        }]
        + (
          [{
            'step': '进程/服务',
            'result': ('ok' if (_proc_running | bool) else 'failed'),
            'detail': (_proc_out | truncate(200, True))
          }] if (_proc_out | length > 0) else []
        )
        + (
          [{
            'step': '日志关键字',
            'result': ('ok' if (_h.log_status_ok | default(false) | bool) else 'failed'),
            'detail': ''
          }] if (_h.log_status_ok is defined) else []
        )
      }}
    _action_steps: >-
      {{
        [{
          'step': 'WinRM 建连',
          'result': ('ok' if (_h._winrm_session_ok | default(false) | bool) else 'failed'),
          'detail': (_h.host_failure_reason | default('') | truncate(200, True) if not (_h._winrm_session_ok | default(false) | bool) else '')
        }]
        + (
          [{
            'step': 'GUI 安装向导',
            'result': (
              'ok' if (
                (_h._land_gui_install.stdout | default('') is search('INSTALL_COMPLETE'))
                and not (_h._land_gui_install.stdout | default('') is search('INSTALL_ERROR|INSTALL_FAILED'))
              ) else 'failed'
            ),
            'detail': (
              (
                (_h._land_gui_install.stdout | default('') | regex_search('INSTALL_VERSION[^\n]*') | default(''))
                | trim
              )
              if (
                (_h._land_gui_install.stdout | default('') is search('INSTALL_COMPLETE'))
              ) else (
                (
                  (_h._land_gui_install.stdout | default('') | regex_search('INSTALL_(?:ERROR|FAILED)[^\n]*') | default(''))
                  | trim
                )
                | default(
                  (_h.host_failure_reason | default('') | truncate(200, True)),
                  true
                )
              )
            )
          }] if (
            _op_type == 'redeploy'
            and (_h.land_include_gui_installer | default(false) | bool)
            and (_h._land_gui_install is defined)
          ) else []
        )
        + (
          [{
            'step': '升级包复制',
            'result': ('ok' if (_h._sinexcel_redeploy_zip_stat.stat.exists | default(false) | bool) else 'failed'),
            'detail': (_h.redeploy_zip_dest | default('') | string)
          }] if (
            _op_type == 'redeploy'
            and (_h._sinexcel_redeploy_zip_stat is defined)
          ) else []
        )
        + (
          [{
            'step': '旧版目录备份',
            'result': ('ok' if ('BACKUP_OK' in ((_h._sinexcel_redeploy_backup.stdout | default('')) | string)) else 'failed'),
            'detail': ((_h._sinexcel_redeploy_backup.stdout | default('')) | string | truncate(200, True))
          }] if (
            _op_type == 'redeploy'
            and (_h._sinexcel_redeploy_backup is defined)
          ) else []
        )
        + (
          [{
            'step': '解压覆盖',
            'result': ('ok' if ('EXTRACT_OK' in ((_h._sinexcel_redeploy_extract.stdout | default('')) | string)) else 'failed'),
            'detail': ((_h._sinexcel_redeploy_extract.stdout | default('')) | string | truncate(200, True))
          }] if (
            _op_type == 'redeploy'
            and (_h._sinexcel_redeploy_extract is defined)
          ) else []
        )
        + (
          [{
            'step': 'INI 配置改配',
            'result': ('ok' if (
              (_h._sinexcel_config_patch_results.results | default([]) | map(attribute='stdout') | join(' ') | regex_search('CFG_OK'))
              and not (_h._sinexcel_config_patch_results.results | default([]) | map(attribute='stdout') | join(' ') | regex_search('CFG_ERROR'))
            ) else ('skipped' if (_h._sinexcel_config_patch_results is not defined) else 'failed')),
            'detail': ((_h._sinexcel_config_patch_results.results | default([]) | map(attribute='stdout') | join('; ') | string) | truncate(200, True))
          }] if (
            _op_type == 'redeploy'
            and (_h._sinexcel_config_patch_results is defined)
            and not (_h._sinexcel_config_patch_results.skipped | default(false))
          ) else []
        )
        + (
          [{
            'step': '制品下发',
            'result': ('ok' if (_h._redeploy_exe_stat_after.stat.exists | default(false) | bool) else 'failed'),
            'detail': ('exe present after deploy' if (_h._redeploy_exe_stat_after.stat.exists | default(false) | bool) else 'package/exe missing after deploy')
          }] if (_op_type == 'redeploy' and (_h._redeploy_exe_stat_after is defined)) else []
        )
        + (
          [{
            'step': ('服务重启' if (_h._jhai_service_status is defined or _h._nbt_service_status is defined) else '进程启停'),
            'result': ('ok' if (_svc_running | bool) else 'failed'),
            'detail': (_svc_out | truncate(200, True))
          }] if ((_svc_out | length > 0) or (_h.final_start_ok is defined) or (_h._jhai_service_status is defined) or (_h._nbt_service_status is defined)) else []
        )
        + (
          [{
            'step': 'API/心跳验证',
            'result': ('ok' if (_h.jhai_upload_status_ok | default(_h.nbt_heartbeat_ok | default(_h.land_api_status_ok | default(_h._sinexcel_kafka_api_ok | default(_h.final_start_ok | default(false), true), true), true), true) | bool) else 'failed'),
            'detail': (
              'upload_status code=' ~ (_h.jhai_upload_status_code | default('n/a') | string)
              if (_h.jhai_upload_status_ok is defined) else (
                'heartbeat ok=' ~ (_h.nbt_heartbeat_ok | default(false) | string)
                if (_h.nbt_heartbeat_ok is defined) else (
                  'land_api ok=' ~ (_h.land_api_status_ok | default(false) | string)
                  if (_h.land_api_status_ok is defined) else (
                    'kafka api ok=' ~ (_h._sinexcel_kafka_api_ok | default(false) | string)
                    if (_h._sinexcel_kafka_api_ok is defined) else ''
                  )
                )
              )
            )
          }] if (
            _h.jhai_upload_status_ok is defined or _h.nbt_heartbeat_ok is defined
            or _h.land_api_status_ok is defined or _h._sinexcel_kafka_api_ok is defined
            or _h.final_start_ok is defined
          ) else []
        )
        + (
          [{
            'step': '配置 API',
            'result': ('ok' if (_h.jhai_config_apis_ok | default(true) | bool) else 'failed'),
            'detail': 'Kafka/resend HTTP APIs'
          }] if (_h.jhai_config_apis_ok is defined and (_h.jhai_include_config_apis | default(false) | bool)) else []
        )
      }}
    _resend_steps: >-
      {{
        [{
          'step': '时间范围',
          'result': 'ok',
          'detail': (_h.sem_resend_range_display | default('') | truncate(200, True))
        }]
        + [{
          'step': 'WinRM 建连',
          'result': ('ok' if (_h._winrm_session_ok | default(false) | bool) else 'failed'),
          'detail': (_h.host_failure_reason | default('') | truncate(200, True) if not (_h._winrm_session_ok | default(false) | bool) else '')
        }]
        + (
          [{
            'step': '写 INI 时间范围',
            'result': ('ok' if (_h.final_start_ok | default(false) | bool) else 'failed'),
            'detail': 'HisDataFromTime/HisDataToTime'
          },
          {
            'step': '进程启停',
            'result': ('ok' if (_h.final_start_ok | default(false) | bool) else 'failed'),
            'detail': ''
          }] if (_h.final_start_ok is defined) else []
        )
        + [{
          'step': '重发 API',
          'result': ('ok' if (
            (
              _h.jhai_config_apis_ok
              if (_h.jhai_config_apis_ok is defined)
              else (
                _h.land_redeliver_ok
                if (_h.land_redeliver_ok is defined)
                else (
                  _h.sinexcel_retransmit_ok
                  if (_h.sinexcel_retransmit_ok is defined)
                  else (
                    _h.nbt_reset_data_ok
                    if (_h.nbt_reset_data_ok is defined)
                    else (_h.final_start_ok | default(false))
                  )
                )
              )
            ) | default(false) | bool
          ) else 'failed'),
          'detail': (
            'JHAI config/resend APIs'
            if (_h.jhai_config_apis_ok is defined) else (
              'LAND Redeliver'
              if (_h.land_redeliver_ok is defined) else (
                'SINEXCEL Retransmit'
                if (_h.sinexcel_retransmit_ok is defined) else (
                  'NBT ResetData'
                  if (_h.nbt_reset_data_ok is defined) else 'NEWARE INI + restart'
                )
              )
            )
          )
        }]
      }}
    _op_steps: >-
      {{
        _status_steps if (_op_type == 'status')
        else (_resend_steps if (_op_type == 'resend_data') else _action_steps)
      }}
