---
# 在 bulk PUT 之后向 TDengine 写入设备状态行（NEWARE / NBT / LAND / SINEXCEL 共用）。
# ts 固定值（可用 Variable Group TDENGINE_FIXED_TS 覆盖）默认：2262-01-01 08:00:00.000
#
# Variable Group ENV：
#   TDENGINE_URL, TDENGINE_USER, TDENGINE_PASSWORD
#   TDENGINE_DATABASE (默认 lab), TDENGINE_STATUS_TABLE (默认 neware_remote_computer_status)
#   TDENGINE_TAG_SUPPLIER — supplier 为超级表 TAG（非列），默认 newarerm
#   TDENGINE_SUPER_TABLE  — 超级表名，默认 dws_computer_status（与库名拼成 lab.dws_computer_status）
#   TDENGINE_FIXED_TS  — 可选，覆盖固定 ts 字符串
#   TDENGINE_TIMEZONE  — updated_time/check_time 时区（IANA 名），默认 Asia/Shanghai

- name: 解析 TDengine 配置并检查是否启用
  ansible.builtin.set_fact:
    _td_url: "{{ lookup('env', 'TDENGINE_URL') | default('', true) | trim }}"
    _td_user: "{{ lookup('env', 'TDENGINE_USER') | default('', true) | trim }}"
    _td_pass: "{{ lookup('env', 'TDENGINE_PASSWORD') | default('', true) | trim }}"
    _td_db: "{{ (lookup('env', 'TDENGINE_DATABASE') | default('', true) | trim) | default('lab', true) }}"
    _td_table: "{{ (lookup('env', 'TDENGINE_STATUS_TABLE') | default('', true) | trim) | default('neware_remote_computer_status', true) }}"
    _td_fixed_ts: >-
      {{ (lookup('env', 'TDENGINE_FIXED_TS') | default('', true) | trim)
         | default('2262-01-01 08:00:00.000', true) }}
    _td_timezone: >-
      {{ (lookup('env', 'TDENGINE_TIMEZONE') | default('', true) | trim)
         | default('Asia/Shanghai', true) }}
    _td_tag_supplier: >-
      {{ (lookup('env', 'TDENGINE_TAG_SUPPLIER') | default('', true) | trim)
         | default('newarerm', true) }}
    _td_super_table: >-
      {{ (lookup('env', 'TDENGINE_SUPER_TABLE') | default('', true) | trim)
         | default('dws_computer_status', true) }}
    _td_enabled: >-
      {{ (lookup('env', 'TDENGINE_URL') | default('', true) | trim | length) > 0
         and (semaphore_status_bulk_updates | default([]) | length) > 0 }}
    _td_base: >-
      {{ lookup('env', 'TDENGINE_URL') | default('', true) | trim
         | regex_replace('/rest/sql/?$', '') | regex_replace('/$', '') }}

- name: 跳过 TDengine（未配置 TDENGINE_URL）
  ansible.builtin.debug:
    msg: >-
      TDengine publish skipped: set TDENGINE_URL in template Variable Group ENV.
      bulk_rows={{ semaphore_status_bulk_updates | default([]) | length }}
  when:
    - (semaphore_status_bulk_updates | default([]) | length) > 0
    - not (_td_enabled | bool)

# 用 python3 取带时区的时间戳（避免 GNU date %3N 与 lookup pipe 问题）
- name: 获取时间（updated_time / check_time）
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os
        from datetime import datetime, timezone, timedelta

        tz_name = (os.environ.get('TDENGINE_TIMEZONE') or 'Asia/Shanghai').strip() or 'Asia/Shanghai'
        try:
            from zoneinfo import ZoneInfo
            dt = datetime.now(ZoneInfo(tz_name))
        except Exception:
            if tz_name in ('Asia/Shanghai', 'Asia/Chongqing', 'PRC', 'UTC+8'):
                dt = datetime.now(timezone(timedelta(hours=8)))
            elif tz_name == 'UTC':
                dt = datetime.now(timezone.utc)
            else:
                dt = datetime.now(timezone.utc)
        print(f"{dt.strftime('%Y-%m-%d %H:%M:%S')}.{dt.microsecond // 1000:03d}")
  environment:
    TDENGINE_TIMEZONE: "{{ _td_timezone }}"
  register: _td_now_cmd
  changed_when: false
  when: _td_enabled | bool

- name: 生成 TDengine INSERT SQL
  ansible.builtin.set_fact:
    _td_insert_table: "{{ _tbl }}"
    _td_using_stable: "{{ _stable }}"
    _td_row_count: "{{ _value_parts | length }}"
    _td_sql: >-
      INSERT INTO {{ _tbl_q }}
      USING {{ _stable_q }} TAGS('{{ _tag_esc }}')
      (ts, computer_name, ip_addr, status, updated_time, check_time, abnormal_reason)
      VALUES {{ _value_parts | join(',') }}
  vars:
    _now_esc: "{{ (_td_now_cmd.stdout | trim) | replace(\"'\", \"''\") }}"
    _ts_esc: "{{ _td_fixed_ts | replace(\"'\", \"''\") }}"
    _tag_esc: "{{ _td_tag_supplier | replace(\"'\", \"''\") }}"
    _tbl: >-
      {{ _td_table if ('.' in (_td_table | string)) else (_td_db ~ '.' ~ _td_table) }}
    _stable: >-
      {{ _td_super_table if ('.' in (_td_super_table | string)) else (_td_db ~ '.' ~ _td_super_table) }}
    _tbl_q: "{{ '`' ~ (_tbl | regex_replace('\\.', '`.`')) ~ '`' }}"
    _stable_q: "{{ '`' ~ (_stable | regex_replace('\\.', '`.`')) ~ '`' }}"
    _value_parts: >-
      {%- set out = [] -%}
      {%- for item in semaphore_status_bulk_updates | default([]) -%}
      {%- set _raw_st = (item.device_status | default(item.status | default('unhealthy')) | string | trim) -%}
      {%- set _td_mapped = 'online' if _raw_st == 'healthy' else 'offline' -%}
      {%- set _cn = (((item.hostname | default('') | trim) or (item.ip | default(''))) | string) | replace("'", "''") -%}
      {%- set _ip = (item.ip | default(item.hostname | default('')) | string) | replace("'", "''") -%}
      {%- set _raw_reason = item.abnormal_reason | default('') | string -%}
      {%- set _reason_default = '' if _td_mapped == 'online' else 'ABNORMAL' -%}
      {%- set _reason = (_raw_reason | trim) if (_raw_reason | trim | length) > 0 else _reason_default -%}
      {%- set _reason_esc = _reason | replace("'", "''") -%}
      {%- set _tuple = "('" ~ _ts_esc ~ "','" ~ _cn ~ "','" ~ _ip ~ "','" ~ _td_mapped ~ "','" ~ _now_esc ~ "','" ~ _now_esc ~ "','" ~ _reason_esc ~ "')" -%}
      {%- set _ = out.append(_tuple) -%}
      {%- endfor -%}
      {{ out }}
  when:
    - _td_enabled | bool
    - _td_now_cmd is defined
    - not (_td_now_cmd.skipped | default(false))
    - (_value_parts | length) > 0

- name: POST TDengine status INSERT
  ansible.builtin.uri:
    url: "{{ _td_base }}/rest/sql/{{ _td_db }}"
    method: POST
    headers: "{{ _td_headers }}"
    body: "{{ _td_sql }}"
    return_content: true
    status_code: [200, 400, 401, 403, 500, 502, 503]
  register: _td_put_result
  failed_when: false
  vars:
    _td_headers: >-
      {{
        {'Content-Type': 'text/plain'}
        | combine(
            {'Authorization': 'Basic ' + ((_td_user + ':' + _td_pass) | b64encode)}
            if (_td_user | trim | length) > 0 else {}
          )
      }}
  when: _td_sql is defined

- name: DEBUG TDengine INSERT 请求与结果
  ansible.builtin.debug:
    msg:
      - >-
        [DEBUG-TDENGINE] row_sample device_status={{
          (semaphore_status_bulk_updates | default([]) | first | default({})).device_status | default('n/a') | to_json
        }} trimmed_online={{
          ((semaphore_status_bulk_updates | default([]) | first | default({})).device_status | default('') | string | trim) == 'healthy'
        }}
      - "[DEBUG-TDENGINE] insert_table={{ _td_insert_table }} using_stable={{ _td_using_stable }} tag_supplier={{ _td_tag_supplier }} rows={{ _td_row_count }} fixed_ts={{ _td_fixed_ts }} timezone={{ _td_timezone }}"
      - "[DEBUG-TDENGINE] sql={{ _td_sql }}"
      - "[DEBUG-TDENGINE] http_status={{ _td_put_result.status | default('n/a') }}"
      - "[DEBUG-TDENGINE] json.code={{ _resp.code | default('n/a') }} desc={{ _resp.desc | default('') }}"
      - "[DEBUG-TDENGINE] json.affected_rows={{ _affected | default('n/a') }} rows={{ _resp.rows | default('n/a') }}"
      - "[DEBUG-TDENGINE] raw_body={{ _raw | default('(empty)') | truncate(500, True) }}"
      - >-
        {% if (_resp.code | default(0) | int != 0) or (_affected is defined and (_affected | int) == 0) %}
        [DEBUG-TDENGINE] WARN: insert may have failed — check timestamp range, table {{ _td_insert_table }}, SQL above.
        {% endif %}
  vars:
    _resp: "{{ _td_put_result.json | default({}) }}"
    _raw: >-
      {{
        (_td_put_result.content | default(''))
        if (_td_put_result.content is defined and (_td_put_result.content | string | length) > 0)
        else (_resp | to_json)
      }}
    _affected: >-
      {{
        (_resp.data | default([]) | first | default([]) | first)
        if (_resp.data is defined and (_resp.data | length) > 0)
        else none
      }}
  when: _td_put_result is defined and not (_td_put_result.skipped | default(false))
