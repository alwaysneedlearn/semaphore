---
# 登记 semaphore_operation_record（依赖 semaphore_operation_steps）。
# localhost 补建时由 ensure 传入 _sem_delegate_host + loop item。

- name: 登记设备操作记录
  ansible.builtin.set_fact:
    semaphore_operation_record: "{{ _record }}"
  delegate_to: "{{ _sem_delegate_host | default(omit) }}"
  delegate_facts: "{{ (_sem_delegate_host is defined) | bool }}"
  when: >-
    (_h.sem_operation_force_log | default(false) | bool)
    or ((_h.semaphore_callback_row | default({})).device_status | default('') | string == 'unhealthy')
    or (_h.sem_operation_restart_performed | default(false) | bool)
  vars:
    _sem_inv_host: "{{ _sem_delegate_host | default(inventory_hostname) }}"
    _h: "{{ hostvars[_sem_inv_host] }}"
    _cb: "{{ _h.semaphore_callback_row | default({}) }}"
    _dev: "{{ _h._semaphore_device_rows | default([]) | selectattr('ip', 'equalto', _sem_inv_host) | list | first | default(_h._semaphore_device_rows | default([]) | selectattr('hostname', 'equalto', _sem_inv_host) | list | first, true) | default({}) }}"
    _device_status: "{{ _cb.device_status | default('unhealthy') | string }}"
    _result: >-
      {{
        'failed' if (_h.host_failure_reason is defined)
        else (
          'success' if (_device_status == 'healthy')
          else 'failed'
        )
      }}
    _summary: >-
      {{
        _h.host_failure_reason | default('')
        if (_h.host_failure_reason is defined)
        else (
          (
            ('重发范围: ' ~ (_h.sem_resend_range_display | default('') | trim) ~ ' | ')
            if (
              (_h.sem_operation_type | default('') | string) == 'resend_data'
              and ((_h.sem_resend_range_display | default('') | trim) | length > 0)
            )
            else ''
          )
          + (
            (_cb.abnormal_reason | default('') | trim)
            if ((_cb.abnormal_reason | default('') | trim) | length > 0)
            else (
              '操作成功' if (_device_status == 'healthy')
              else '操作未达健康状态'
            )
          )
        )
      }}
    _summary_short: "{{ _summary | truncate(500, True) }}"
    _final_step:
      step: 最终结果
      result: "{{ 'ok' if (_result | string == 'success') else 'failed' }}"
      detail: "{{ _summary | truncate(200, True) }}"
    _sem_ip_rec: "{{ (_dev.ip | default('', true) | trim) or (_sem_inv_host | string) }}"
    _sem_hostname_rec: >-
      {{
        (_h._sem_display_hostname | default('', true) | trim)
        or (_dev.hostname | default('', true) | trim)
        or (_h.device_hostname | default('', true) | trim)
        or _sem_ip_rec
      }}
    _op_from_host: "{{ _h.sem_operation_type | default('', true) | string | trim }}"
    _record:
      hostname: "{{ _sem_hostname_rec }}"
      ip: "{{ _sem_ip_rec }}"
      operation: "{{ _op_from_host if (_op_from_host | length > 0) else 'restart' }}"
      result: "{{ _result }}"
      summary: "{{ _summary_short }}"
      steps: "{{ (_h.semaphore_operation_steps | default([])) + [_final_step] }}"
      task_id: {{ (_h.semaphore_task_id | default(semaphore_task_id | default(0))) | int }}
