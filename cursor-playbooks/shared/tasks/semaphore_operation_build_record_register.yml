---
# 登记 semaphore_operation_record（依赖 semaphore_operation_steps）。
# localhost 补建时由 ensure 传入 _sem_delegate_host + loop item。

- name: 登记设备操作记录
  ansible.builtin.set_fact:
    semaphore_operation_record: "{{ _record }}"
  delegate_to: "{{ _sem_delegate_host | default(omit) }}"
  delegate_facts: "{{ (_sem_delegate_host is defined) | bool }}"
  when: >-
    (sem_operation_force_log | default(false) | bool)
    or ((semaphore_callback_row | default({})).device_status | default("") | string == "unhealthy")
    or (sem_operation_restart_performed | default(false) | bool)
  vars:
    _cb: "{{ semaphore_callback_row | default({}) }}"
    _dev: "{{ _semaphore_device_rows | default([]) | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | default([]) | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({}) }}"
    _device_status: "{{ _cb.device_status | default('unhealthy') | string }}"
    _result: >-
      {{
        'failed' if (host_failure_reason is defined)
        else (
          'success' if (_device_status == 'healthy')
          else 'failed'
        )
      }}
    _summary: >-
      {{
        host_failure_reason | default('')
        if (host_failure_reason is defined)
        else (
          (
            ('重发范围: ' ~ (sem_resend_range_display | default('') | trim) ~ ' | ')
            if (
              (sem_operation_type | default('') | string) == 'resend_data'
              and ((sem_resend_range_display | default('') | trim) | length > 0)
            )
            else ''
          )
          + (
            (_cb.abnormal_reason | default('') | trim)
            if ((_cb.abnormal_reason | default('') | trim) | length > 0)
            else (
              '操作成功' if (_device_status == 'healthy')
              else '操作未达健康状态'
            )
          )
        )
      }}
    _summary_short: "{{ _summary | truncate(500, True) }}"
    _final_step:
      step: 最终结果
      result: "{{ 'ok' if (_result | string == 'success') else 'failed' }}"
      detail: "{{ _summary | truncate(200, True) }}"
    _record:
      hostname: "{{ _dev.hostname | default('', true) }}"
      ip: "{{ _dev.ip | default(inventory_hostname, true) }}"
      operation: "{{ sem_operation_type | default('restart') | string }}"
      result: "{{ _result }}"
      summary: "{{ _summary_short }}"
      steps: "{{ (semaphore_operation_steps | default([])) + [_final_step] }}"
      task_id: "{{ (semaphore_task_id | default(0)) | int }}"
