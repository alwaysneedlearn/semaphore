---
# Graceful stop with confirmation popup (CloseMainWindow + Enter on title keyword).
# Requires: deploy_sem_windows_helper_scripts.yml first.
# Play vars: stop_graceful_process_name, stop_popup_*; stop_graceful_fail_on_still_running (default true for restart/redeploy).
# Revision: STOP_GRACEFUL_CONFIRM_REV=3 — when: > form; no bare 'NOT_RUNNING' in YAML list items.

- name: DEBUG 优雅停止任务版本
  ansible.builtin.debug:
    msg: "[DEBUG-STOP] STOP_GRACEFUL_CONFIRM_REV=3 file=stop_program_close_main_window_confirm.yml"
  changed_when: false

- name: 停止程序（解析交互用户）
  ansible.windows.win_shell: |
    $explorerUser = Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
      ForEach-Object {
        $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($o -and $o.ReturnValue -eq 0 -and $o.User) { $o.User.Trim() }
      } |
      Where-Object { $_ } |
      Select-Object -First 1
    if ($explorerUser) {
      Write-Output $explorerUser
    } else {
      Write-Output "{{ hostvars[inventory_hostname].ansible_user | default('Administrator') }}"
    }
  register: _stop_get_username
  changed_when: false

- name: 停止程序（登记交互用户）
  ansible.builtin.set_fact:
    _stop_profile_user: "{{ (_stop_get_username.stdout_lines | default([]) | last | default(_stop_get_username.stdout | default(''))) | trim }}"

- name: 停止程序（主窗口关闭 + 弹窗确认）
  environment:
    STOP_GRACEFUL_PROCESS_NAME: "{{ stop_graceful_process_name }}"
    STOP_POPUP_WAIT_SECONDS: "{{ stop_popup_wait_seconds | string }}"
    STOP_POPUP_KEYWORD: "{{ stop_popup_keyword }}"
    STOP_POPUP_MATCH_MODE: "{{ stop_popup_match_mode | default('title_or_content', true) }}"
    STOP_FORCE_AFTER_GRACEFUL: "{{ stop_force_after_graceful | string | lower }}"
    STOP_VERIFY_PROCESS_NAME: "{{ stop_verify_process_name | default(stop_graceful_process_name, true) }}"
    SEMAPHORE_PROFILE_USER: "{{ _stop_profile_user }}"
    STOP_TASK_TIMEOUT_SECONDS: "{{ (lookup('env', 'STOP_TASK_TIMEOUT_SECONDS') | default('', true) | trim) | default('45', true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_stop_close_main_window_confirm_interactive.ps1
  args:
    chdir: C:\Windows\Temp
  register: stop_graceful_result
  failed_when: false
  changed_when: >-
    stop_graceful_result is defined and
    'stdout' in stop_graceful_result and
    (
      'CLOSE_MAIN_WINDOW_SENT' in stop_graceful_result.stdout or
      'FORCE_STOPPED' in stop_graceful_result.stdout or
      'NOT_RUNNING' in stop_graceful_result.stdout
    )

- name: 停止程序（优雅失败时 WinRM 强制结束）
  ansible.builtin.include_tasks: stop_program_force_fallback.yml

- name: 停止程序（弹窗确认明细）
  ansible.builtin.debug:
    msg: "{{ stop_graceful_result.stdout_lines | default([]) }}"
  when: stop_graceful_result is defined

- name: 停止程序（复核进程是否已实际退出）
  environment:
    VERIFY_PROCESS_NAME: "{{ stop_verify_process_name | default(stop_graceful_process_name, true) }}"
    PROCESS_ALIVE_MIN_HANDLES: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_HANDLES') | default('', true) | trim) | default('1', true) }}"
    PROCESS_ALIVE_MIN_WS_KB: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_WS_KB') | default('', true) | trim) | default('512', true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_verify_process_stopped_by_name_windows.ps1
  args:
    chdir: C:\Windows\Temp
  register: stop_verify_recheck_result
  changed_when: false
  failed_when: false
  when:
    - stop_graceful_result is defined
    - not (stop_graceful_result.unreachable | default(false))

- name: 停止程序（判定停止是否生效）
  ansible.builtin.set_fact:
    _stop_recheck_says_gone: >-
      {{
        (stop_verify_recheck_result is defined)
        and not (stop_verify_recheck_result.skipped | default(false))
        and ('NOT_RUNNING' in (stop_verify_recheck_result.stdout | default('')))
      }}
    _stop_graceful_log_still_running: >-
      {{
        'STILL_RUNNING' in (stop_graceful_result.stdout | default(''))
        or (
          (stop_force_fallback_result is defined)
          and not (stop_force_fallback_result.skipped | default(false))
          and ('STILL_RUNNING' in (stop_force_fallback_result.stdout | default('')))
        )
      }}
    _stop_graceful_ok: >-
      {{
        'NOT_RUNNING' in (stop_graceful_result.stdout | default(''))
        or 'ALREADY_STOPPED' in (stop_graceful_result.stdout | default(''))
        or 'FORCE_STOPPED' in (stop_graceful_result.stdout | default(''))
      }}
    _stop_fallback_ok: >-
      {{
        (stop_force_fallback_result is not defined)
        or (stop_force_fallback_result.skipped | default(false))
        or 'NOT_RUNNING' in (stop_force_fallback_result.stdout | default(''))
        or 'FORCE_STOPPED' in (stop_force_fallback_result.stdout | default(''))
      }}
    _stop_recheck_still_running: >-
      {{
        (stop_verify_recheck_result is defined)
        and not (stop_verify_recheck_result.skipped | default(false))
        and ('STILL_RUNNING' in (stop_verify_recheck_result.stdout | default('')))
      }}
  when: stop_graceful_result is defined

- name: 停止程序（汇总停止是否生效）
  ansible.builtin.set_fact:
    _stop_effectively_stopped: >-
      {{
        (_stop_recheck_says_gone | bool)
        or (
          not (_stop_recheck_still_running | bool)
          and (_stop_graceful_ok | bool)
          and (_stop_fallback_ok | bool)
        )
      }}
  when: stop_graceful_result is defined

- name: 停止程序（日志 STILL_RUNNING 但复核已退出，继续后续流程）
  ansible.builtin.debug:
    msg: >-
      [DEBUG-STOP] {{ inventory_hostname }} graceful log reported still running but alive-check says stopped:
      recheck={{ stop_verify_recheck_result.stdout | default('') | trim }}
  when:
    - _stop_recheck_says_gone | default(false) | bool
    - _stop_graceful_log_still_running | default(false) | bool

- name: 停止程序（优雅+强制后仍运行则失败本主机）
  ansible.builtin.fail:
    msg: >-
      [停止] {{ inventory_hostname }} 无法终止 {{ stop_verify_process_name | default(stop_graceful_process_name) }}:
      graceful={{ stop_graceful_result.stdout | default('') | trim }}
      fallback={{ stop_force_fallback_result.stdout | default('(not run)') | trim }}
      recheck={{ stop_verify_recheck_result.stdout | default('(not run)') | trim }}
  when:
    - stop_graceful_fail_on_still_running | default(true) | bool
    - stop_graceful_result is defined
    - not (stop_graceful_result.unreachable | default(false))
    - not (_stop_effectively_stopped | default(false) | bool)
