---
# Graceful stop with confirmation popup (CloseMainWindow + Enter on title keyword).
# Requires: deploy_sem_windows_helper_scripts.yml first.
# Play vars (or Variable Group env): stop_graceful_process_name, stop_popup_wait_seconds,
# stop_popup_keyword, stop_force_after_graceful; optional stop_verify_process_name.

- name: 停止程序（主窗口关闭 + 弹窗确认）
  environment:
    STOP_GRACEFUL_PROCESS_NAME: "{{ stop_graceful_process_name }}"
    STOP_POPUP_WAIT_SECONDS: "{{ stop_popup_wait_seconds | string }}"
    STOP_POPUP_KEYWORD: "{{ stop_popup_keyword }}"
    STOP_FORCE_AFTER_GRACEFUL: "{{ stop_force_after_graceful | string | lower }}"
    STOP_VERIFY_PROCESS_NAME: "{{ stop_verify_process_name | default(stop_graceful_process_name, true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_stop_close_main_window_confirm.ps1
  args:
    chdir: C:\Windows\Temp
  register: stop_graceful_result
  failed_when: >-
    stop_graceful_result is defined and
    'stdout' in stop_graceful_result and
    'STILL_RUNNING' in stop_graceful_result.stdout
  changed_when: >-
    stop_graceful_result is defined and
    'stdout' in stop_graceful_result and
    (
      'CLOSE_MAIN_WINDOW_SENT' in stop_graceful_result.stdout or
      'FORCE_STOPPED' in stop_graceful_result.stdout or
      'NOT_RUNNING' in stop_graceful_result.stdout
    )

- name: 停止程序（弹窗确认明细）
  ansible.builtin.debug:
    msg: "{{ stop_graceful_result.stdout_lines | default([]) }}"
  when: stop_graceful_result is defined
