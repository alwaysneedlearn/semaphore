---
# Build semaphore_operation_record for device operation history.
# Play vars:
#   sem_operation_type = restart | redeploy | status | resend_data
#   sem_operation_force_log = true  → always log (manual restart/redeploy)
#   sem_operation_restart_performed = true → check_restart ran restart
# Logs when: force_log OR callback unhealthy OR restart_performed (check_restart).

- ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record_steps.yml"

- ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record_register.yml"
