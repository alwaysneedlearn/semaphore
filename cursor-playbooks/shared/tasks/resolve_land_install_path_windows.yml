---
# Install path (APP_DIR / zip layout) vs runtime path (e.g. F:\1 while zip deploys F:\LHBTS).
# Requires: exe_dir, exe_name, app_dir, zip_name, process_name; helper scripts deployed.

- name: 登记 APP_DIR 探测候选（去重有序）
  ansible.builtin.set_fact:
    _app_dir_candidates_env: "{{ (lookup('env', 'APP_DIR_CANDIDATES') | default('', true) | trim) }}"
    app_dir_install: "{{ app_dir | default(zip_name) }}"
    _land_app_dir_try_list: >-
      {{
        (
          (
            (_app_dir_candidates_env | split(','))
            | map('trim') | reject('equalto', '') | list
            if (_app_dir_candidates_env | length > 0) else []
          )
          + ([app_dir_install] if (app_dir_install | default('') not in ['', '.']) else [])
          + ([zip_name] if (zip_name | default('') not in ['', '.']) else [])
        ) | unique | list
      }}

- name: 解析安装路径与运行路径（LHBTS 解压目录 vs 1 等旧目录）
  environment:
    SEMAPHORE_EXE_DIR: "{{ exe_dir }}"
    SEMAPHORE_EXE_NAME: "{{ exe_name }}"
    SEMAPHORE_APP_DIR_INSTALL: "{{ app_dir_install }}"
    SEMAPHORE_APP_DIR_TRY: "{{ _land_app_dir_try_list | join(',') }}"
    SEMAPHORE_PROCESS_NAME: "{{ process_name | default('') }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_resolve_land_app_dir_windows.ps1
  register: _resolve_land_app_dir
  changed_when: false

- name: 登记路径解析行
  ansible.builtin.set_fact:
    _land_install_app_dir_line: "{{ (_resolve_land_app_dir.stdout_lines | default([]) | select('search', '^INSTALL_APP_DIR=') | list | first) | default('INSTALL_APP_DIR=', true) }}"
    _land_install_exe_line: "{{ (_resolve_land_app_dir.stdout_lines | default([]) | select('search', '^INSTALL_EXE_PATH=') | list | first) | default('INSTALL_EXE_PATH=', true) }}"
    _land_runtime_app_dir_line: "{{ (_resolve_land_app_dir.stdout_lines | default([]) | select('search', '^RUNTIME_APP_DIR=') | list | first) | default('RUNTIME_APP_DIR=', true) }}"
    _land_runtime_exe_line: "{{ (_resolve_land_app_dir.stdout_lines | default([]) | select('search', '^RUNTIME_EXE_PATH=') | list | first) | default('RUNTIME_EXE_PATH=', true) }}"
    _land_app_dir_source_line: "{{ (_resolve_land_app_dir.stdout_lines | default([]) | select('search', '^APP_DIR_SOURCE=') | list | first) | default('APP_DIR_SOURCE=not_found', true) }}"

- name: 应用安装路径与运行路径
  ansible.builtin.set_fact:
    app_dir_install: "{{ (_land_install_app_dir_line | regex_replace('^INSTALL_APP_DIR=', '') | trim) | default(app_dir_install, true) }}"
    install_exe_path: "{{ (_land_install_exe_line | regex_replace('^INSTALL_EXE_PATH=', '') | trim) }}"
    _land_runtime_app_dir: "{{ (_land_runtime_app_dir_line | regex_replace('^RUNTIME_APP_DIR=', '') | trim) }}"
    _land_runtime_exe_path: "{{ (_land_runtime_exe_line | regex_replace('^RUNTIME_EXE_PATH=', '') | trim) }}"
    app_dir: "{{ _land_runtime_app_dir | default(app_dir_install, true) }}"
    exe_path: "{{ _land_runtime_exe_path if (_land_runtime_exe_path | length > 0) else install_exe_path }}"

- name: DEBUG LAND 安装路径解析
  ansible.builtin.debug:
    msg:
      - "[DEBUG-EXE_DIR] app_dir_try={{ _land_app_dir_try_list | default([]) }}"
      - "[DEBUG-EXE_DIR] {{ _land_app_dir_source_line | default('APP_DIR_SOURCE=unknown') }}"
      - "[DEBUG-EXE_DIR] install={{ app_dir_install | default('n/a') }} path={{ install_exe_path | default('n/a') }}"
      - "[DEBUG-EXE_DIR] runtime={{ app_dir | default('n/a') }} path={{ exe_path | default('n/a') }}"
  when: _resolve_land_app_dir is defined
