---
# POST QueryStatus — sets _land_api_status_raw, land_api_status_ok (HTTP 2xx + data.real_status).

- name: LAND 查询 API 状态（QueryStatus）
  ansible.builtin.uri:
    url: "{{ land_api_scheme }}://{{ _land_target_host }}:{{ land_api_port }}{{ land_api_status_path }}"
    method: POST
    body_format: json
    body:
      token: "{{ land_api_token }}"
    timeout: "{{ land_api_timeout }}"
    validate_certs: "{{ land_api_verify_tls }}"
    return_content: true
    status_code: [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]
  register: _land_api_status_raw
  delegate_to: localhost
  failed_when: false

- ansible.builtin.include_tasks: land_api_query_status_apply.yml
