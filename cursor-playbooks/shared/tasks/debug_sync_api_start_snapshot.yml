---
# After start / restart / redeploy. Play var: sem_debug_tag.

- name: "DEBUG {{ sem_debug_tag | default('DEVICE') }} 启动（路径与进程）"
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] host={{ inventory_hostname }} exe_path={{ exe_path | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] exe_exists_initial={{ _sem_dbg_exe_stat.stat.exists | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] exe_exists_after_extract={{ _sem_dbg_exe_after.stat.exists | default('n/a') if (_sem_dbg_exe_after is defined) else 'n/a' }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] profile_user={{ _reconfig_profile_user | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] need_reconfigure={{ _sem_dbg_need_reconfigure | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] process_check={{ _sem_dbg_process_out | trim }}"
  vars:
    _sem_dbg_exe_stat: "{{ _land_exe_stat | default(_sinexcel_exe_stat | default(_nbt_exe_stat)) }}"
    _sem_dbg_exe_after: "{{ _land_exe_stat_after_extract | default(_sinexcel_exe_stat_after_extract | default(_nbt_exe_stat_after_extract)) }}"
    _sem_dbg_need_reconfigure: "{{ _land_need_reconfigure | default(_sinexcel_need_reconfigure | default(_nbt_need_reconfigure)) }}"
    _sem_dbg_process_out: >-
      {% if _land_process_after_start is defined %}{{ _land_process_after_start.stdout | default('') }}
      {% elif _sinexcel_process_after_start is defined %}{{ _sinexcel_process_after_start.stdout | default('') }}
      {% elif _nbt_process_after_start is defined %}{{ _nbt_process_after_start.stdout | default('') }}
      {% elif _land_process_after_restart is defined %}{{ _land_process_after_restart.stdout | default('') }}
      {% elif _sinexcel_process_after_restart is defined %}{{ _sinexcel_process_after_restart.stdout | default('') }}
      {% elif _nbt_process_after_restart is defined %}{{ _nbt_process_after_restart.stdout | default('') }}
      {% elif _land_process_check is defined %}{{ _land_process_check.stdout | default('') }}
      {% elif _sinexcel_process_check is defined %}{{ _sinexcel_process_check.stdout | default('') }}
      {% elif _nbt_process_check is defined %}{{ _nbt_process_check.stdout | default('') }}
      {% else %}skipped{% endif %}
  when: _sem_dbg_exe_stat is defined

- name: "DEBUG {{ sem_debug_tag | default('DEVICE') }} 启动（Kafka API）"
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] kafka_check_enabled={{ sinexcel_start_check_api | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] kafka POST {{ sinexcel_kafka_api_scheme | default('http') }}://{{ _sem_dbg_kafka_host }}:{{ sinexcel_kafka_api_port }}{{ sinexcel_kafka_query_config_path | default('/kafka/QueryConfig') }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] kafka http_status={{ _sem_dbg_kafka_raw.status | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] kafka result={{ _sinexcel_kafka_result_text | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] kafka EnableFlowInfoExtendedSqlite={{ _sinexcel_kafka_enabled | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] kafka api_ok={{ _sinexcel_kafka_api_ok | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] kafka response_body={{ (_sem_dbg_kafka_raw.content | default('') | string) | truncate(2000, True) }}"
  vars:
    _sem_dbg_kafka_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"
    _sem_dbg_kafka_raw: "{{ _sinexcel_kafka_query_raw | default(_sinexcel_api_after) }}"
  when: _sem_dbg_kafka_raw is defined

- name: "DEBUG {{ sem_debug_tag | default('DEVICE') }} 启动（SyncLims API）"
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] api_check_enabled={{ land_start_check_api | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] api http_status={{ _sem_dbg_land_api_status }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] api response_body={{ _sem_dbg_land_api_body | truncate(2000, True) }}"
  vars:
    _sem_dbg_land_api_status: >-
      {% if _land_api_after_start is defined %}{{ _land_api_after_start.status | default('n/a') }}
      {% elif _land_api_after_restart is defined %}{{ _land_api_after_restart.status | default('n/a') }}
      {% elif _land_api_check is defined %}{{ _land_api_check.status | default('n/a') }}
      {% else %}skipped{% endif %}
    _sem_dbg_land_api_body: >-
      {% if _land_api_after_start is defined %}{{ _land_api_after_start.content | default('') | string }}
      {% elif _land_api_after_restart is defined %}{{ _land_api_after_restart.content | default('') | string }}
      {% elif _land_api_check is defined %}{{ _land_api_check.content | default('') | string }}
      {% else %}{% endif %}
  when: _land_api_after_start is defined or _land_api_after_restart is defined or _land_api_check is defined

- name: "DEBUG {{ sem_debug_tag | default('DEVICE') }} 启动（NBT 心跳 API）"
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] api_check_enabled={{ nbt_start_check_api | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] heartbeat_ok={{ nbt_heartbeat_ok | default('n/a') }} last_send={{ nbt_heartbeat_last_send | default('n/a') }} age_min={{ nbt_heartbeat_age_minutes | default('n/a') }}"
  when:
    - (sem_debug_tag | default('')) == 'NBT'
    - nbt_heartbeat_ok is defined or nbt_heartbeat_last_send is defined

- name: "DEBUG {{ sem_debug_tag | default('DEVICE') }} 启动（回调行预览）"
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] callback device_status={{ semaphore_callback_row.device_status | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] callback api_status={{ semaphore_callback_row.api_status | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('DEVICE') }}] callback abnormal_reason={{ semaphore_callback_row.abnormal_reason | default('') | trim }}"
  when: semaphore_callback_row is defined
