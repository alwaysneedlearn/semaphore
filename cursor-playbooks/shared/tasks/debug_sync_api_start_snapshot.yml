---
# After start / restart / redeploy. Play var: sem_debug_tag. Single consolidated DEBUG task.

- name: "DEBUG {{ sem_debug_tag | default('DEVICE') }} 启动"
  ansible.builtin.debug:
    msg: "{{ _start_dbg_lines }}"
  vars:
    _tag: "{{ sem_debug_tag | default('DEVICE') }}"
    _sem_dbg_install_path: >-
      {% if service_path is defined and (service_path | string | trim) | length > 0 %}{{ service_path }}
      {% elif exe_path is defined %}{{ exe_path }}
      {% elif exe_dir is defined and exe_name is defined %}{{ exe_dir }}\{{ exe_name }}
      {% else %}n/a{% endif %}
    _sem_dbg_exe_stat: "{{ _land_exe_stat | default(_sinexcel_exe_stat | default(_nbt_service_path_stat, true), true) }}"
    _sem_dbg_exe_after: "{{ _land_exe_stat_after_extract | default(_sinexcel_exe_stat_after_extract | default(_redeploy_exe_stat_after)) }}"
    _sem_dbg_need_reconfigure: "{{ _land_need_reconfigure | default(_sinexcel_need_reconfigure | default(_nbt_need_reconfigure)) }}"
    _sem_dbg_process_out: >-
      {% if _land_process_after_start is defined %}{{ _land_process_after_start.stdout | default('') }}
      {% elif _sinexcel_process_after_start is defined %}{{ _sinexcel_process_after_start.stdout | default('') }}
      {% elif _nbt_process_after_start is defined %}{{ _nbt_process_after_start.stdout | default('') }}
      {% elif _land_process_after_restart is defined %}{{ _land_process_after_restart.stdout | default('') }}
      {% elif _sinexcel_process_after_restart is defined %}{{ _sinexcel_process_after_restart.stdout | default('') }}
      {% elif _ini_agent_process_after is defined %}{{ _ini_agent_process_after.stdout | default('') }}
      {% elif _nbt_service_status is defined %}{{ _nbt_service_status.stdout | default('') }}
      {% elif _nbt_process_after_restart is defined %}{{ _nbt_process_after_restart.stdout | default('') }}
      {% elif _land_process_check is defined %}{{ _land_process_check.stdout | default('') }}
      {% elif _sinexcel_process_check is defined %}{{ _sinexcel_process_check.stdout | default('') }}
      {% elif _nbt_process_check is defined %}{{ _nbt_process_check.stdout | default('') }}
      {% else %}skipped{% endif %}
    _sem_dbg_api_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"
    _sem_dbg_api_raw: "{{ _sinexcel_kafka_query_raw | default(_sinexcel_api_after) }}"
    _sem_dbg_land_api_status: >-
      {% if _land_api_after_start is defined %}{{ _land_api_after_start.status | default('n/a') }}
      {% elif _land_api_after_restart is defined %}{{ _land_api_after_restart.status | default('n/a') }}
      {% elif _land_api_check is defined %}{{ _land_api_check.status | default('n/a') }}
      {% else %}skipped{% endif %}
    _start_dbg_lines: >-
      {{
        (
          [
            '[DEBUG-' ~ _tag ~ '] host=' ~ inventory_hostname ~ ' install_path=' ~ _sem_dbg_install_path,
            '[DEBUG-' ~ _tag ~ '] exe_exists_initial=' ~ (_sem_dbg_exe_stat.stat.exists | default(false) | string if (_sem_dbg_exe_stat is defined) else 'n/a'),
            '[DEBUG-' ~ _tag ~ '] need_reconfigure=' ~ (_sem_dbg_need_reconfigure | default('n/a') | string),
            '[DEBUG-' ~ _tag ~ '] process_check=' ~ (_sem_dbg_process_out | trim),
            '[DEBUG-' ~ _tag ~ '] service_name=' ~ (service_name | default('n/a')),
            '[DEBUG-' ~ _tag ~ '] service_status=' ~ (_nbt_service_status.stdout | default('n/a') | trim if (_nbt_service_status is defined) else 'n/a')
          ] if (_sem_dbg_exe_stat is defined or _nbt_service_status is defined) else []
        )
        + (
          [
            '[DEBUG-' ~ _tag ~ '] start_script_stdout=' ~ ((relaunch_result.stdout | default('') | string | trim) | truncate(3000, True)),
            '[DEBUG-' ~ _tag ~ '] start_popup_confirmed=' ~ (('POPUP_CONFIRMED' in (relaunch_result.stdout | default(''))) | string),
            '[DEBUG-' ~ _tag ~ '] start_verify_ok=' ~ (('VERIFY_OK' in (relaunch_result.stdout | default(''))) | string)
          ] if (relaunch_result is defined) else []
        )
        + (
          [
            '[DEBUG-' ~ _tag ~ '] api_check_enabled=' ~ (sinexcel_start_check_api | default(false) | string),
            '[DEBUG-' ~ _tag ~ '] api POST ' ~ (sinexcel_kafka_api_scheme | default('http')) ~ '://' ~ _sem_dbg_api_host
              ~ ':' ~ (sinexcel_kafka_api_port | string) ~ (sinexcel_kafka_query_config_path | default('/kafka/QueryConfig'))
              ~ ' http=' ~ (_sem_dbg_api_raw.status | default('n/a') | string),
            '[DEBUG-' ~ _tag ~ '] api result=' ~ (_sinexcel_kafka_result_text | default('n/a') | string),
            '[DEBUG-' ~ _tag ~ '] api api_ok=' ~ (_sinexcel_kafka_api_ok | default(false) | string)
          ] if (_sem_dbg_api_raw is defined) else []
        )
        + (
          [
            '[DEBUG-' ~ _tag ~ '] land_api http=' ~ (_sem_dbg_land_api_status | string),
            '[DEBUG-' ~ _tag ~ '] nbt_heartbeat_ok=' ~ (nbt_heartbeat_ok | default('n/a') | string)
          ] if (_land_api_after_start is defined or _land_api_after_restart is defined or _land_api_check is defined
                  or nbt_heartbeat_ok is defined or nbt_heartbeat_last_send is defined) else []
        )
        + (
          [
            '[DEBUG-' ~ _tag ~ '] callback device_status=' ~ (semaphore_callback_row.device_status | default('n/a') | string),
            '[DEBUG-' ~ _tag ~ '] callback api_status=' ~ (semaphore_callback_row.api_status | default('n/a') | string),
            '[DEBUG-' ~ _tag ~ '] callback abnormal_reason=' ~ (semaphore_callback_row.abnormal_reason | default('') | trim)
          ] if (semaphore_callback_row is defined) else []
        )
      }}
  when: >
    _sem_dbg_exe_stat is defined or _nbt_service_status is defined or relaunch_result is defined or
    _sem_dbg_api_raw is defined or semaphore_callback_row is defined or nbt_heartbeat_ok is defined
