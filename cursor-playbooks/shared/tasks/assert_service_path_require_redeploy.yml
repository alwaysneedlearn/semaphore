---
# Fail with redeploy hint when service_path / install_path is missing.

- name: 检查服务安装路径是否存在
  ansible.windows.win_stat:
    path: "{{ install_path | default(service_path) }}"
  register: _assert_service_path_stat

- name: 服务路径不存在：登记 unhealthy 并跳过后续步骤
  when: not (_assert_service_path_stat.stat.exists | default(false))
  block:
    - name: 登记需重新部署回调行
      ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ (_sem_dev | default({})).hostname | default('', true) }}"
          ip: "{{ (_sem_dev | default({})).ip | default(inventory_hostname, true) }}"
          device_status: unhealthy
          winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
          api_status: offline
          abnormal_reason: "Service path not found: {{ install_path | default(service_path) }} — 请先执行重新部署 (redeploy)"
      vars:
        _sem_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"

    - ansible.builtin.meta: end_host
