---
# Include from windows_hosts play post_tasks: run_once + delegate_to localhost + block wrapper.
# hostvar semaphore_callback_row per host; rdp_status usually omitted.

- ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_resolve_bulk_credentials.yml"

- name: 补登记 WinRM ping 失败但未写回调的主机
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_callback_winrm_fallback_missing_rows.yml"

- name: 汇总各主机 semaphore_callback_row（含 status 字段供 API）
  ansible.builtin.set_fact:
    semaphore_status_bulk_updates: "{{ semaphore_status_bulk_updates | default([]) + [_sem_bulk_item] }}"
  loop: "{{ _sem_bulk_host_list | default([]) }}"
  when: hostvars[item].semaphore_callback_row is defined
  vars:
    _sem_row: "{{ hostvars[item].semaphore_callback_row }}"
    _sem_host_eff_name: >-
      {{
        (_sem_row.hostname | default('') | trim)
        or (hostvars[item].device_hostname | default('') | trim)
        or (hostvars[item].device_name | default('') | trim)
        or (hostvars[item]._sem_display_hostname | default('') | trim)
        or item
      }}
    _sem_bulk_item: >-
      {{
        _sem_row
        | combine(
            {
              'device_status': (_sem_row.device_status | default(_sem_row.status | default('unhealthy')) | string | trim),
              'status': (_sem_row.device_status | default(_sem_row.status | default('unhealthy')) | string | trim),
              'hostname': _sem_host_eff_name,
              'ip': (_sem_row.ip | default(item, true) | string | trim) or item
            },
            recursive=True
          )
      }}

- name: DEBUG bulk 回调（前置检查 / 缺凭据提示）
  ansible.builtin.debug:
    msg: "{{ _bulk_debug_lines }}"
  vars:
    _bulk_cred_ok: "{{ (_sem_bulk_pid | default('') | trim | length) > 0 and (_sem_bulk_token | default('') | trim | length) > 0 }}"
    _bulk_debug_lines: >-
      {{
        [
          '[DEBUG-API] bulk_host_list=' ~ (_sem_bulk_host_list | default([]) | join(',')),
          '[DEBUG-API] bulk_hosts=' ~ (_sem_bulk_host_list | default([]) | length | string)
            ~ ' rows=' ~ (semaphore_status_bulk_updates | default([]) | length | string),
          '[DEBUG-API] bulk_pid=' ~ (_sem_bulk_pid | default('')),
          '[DEBUG-API] bulk_url=' ~ (_sem_bulk_url | default('')),
          '[DEBUG-API] bulk_token_set=' ~ (_bulk_cred_ok | string)
        ]
        + (
          ['Bulk status callback skipped: need semaphore_project_id and SEMAPHORE_API_TOKEN']
          if ((semaphore_status_bulk_updates | default([]) | length) > 0 and not (_bulk_cred_ok | bool))
          else []
        )
      }}
  when: semaphore_status_bulk_updates is defined

- name: PUT Semaphore /devices/status/bulk
  ansible.builtin.uri:
    url: "{{ _sem_bulk_url | regex_replace('/$', '') }}/api/project/{{ _sem_bulk_pid }}/devices/status/bulk"
    method: PUT
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ _sem_bulk_token }}"
    body_format: json
    body:
      updates: "{{ semaphore_status_bulk_updates | default([]) }}"
    status_code: [200, 400, 401, 403, 404]
  register: _sem_bulk_put_result
  failed_when: false
  when:
    - (_sem_bulk_pid | default('') | trim | length) > 0
    - (_sem_bulk_token | default('') | trim | length) > 0
    - (semaphore_status_bulk_updates | default([])) | length > 0

- name: DEBUG Semaphore bulk PUT 响应
  ansible.builtin.debug:
    msg:
      - "[DEBUG-API] bulk PUT http_status={{ _sem_bulk_put_result.status | default('n/a') }} updated={{ (_sem_bulk_put_result.json.updated | default('n/a')) if (_sem_bulk_put_result.json is defined) else 'n/a' }}"
      - "[DEBUG-API] bulk PUT response_body={{ _sem_bulk_put_result.content | default('') | truncate(2000, True) }}"
  when: _sem_bulk_put_result is defined and not (_sem_bulk_put_result.skipped | default(false))

- name: 写入 TDengine 状态
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_tdengine_publish_from_bulk.yml"
