---
# end_host 会跳过 windows_hosts play 的 post_tasks，导致 semaphore_operation_record 未登记。
# 在 localhost bulk 阶段按 hostvars 补建：loop 在 include_tasks 上，delegate 在 set_fact 上（非 block）。

- ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record_steps.yml"
  loop: "{{ _sem_bulk_host_list | default([]) }}"
  loop_control:
    loop_var: _sem_op_host
  vars:
    _sem_delegate_host: "{{ _sem_op_host }}"
  when:
    - hostvars[_sem_op_host].semaphore_operation_record is not defined
    - hostvars[_sem_op_host].semaphore_callback_row is defined
    - >-
      (hostvars[_sem_op_host].sem_operation_force_log | default(false) | bool)
      or (
        (hostvars[_sem_op_host].semaphore_callback_row | default({})).device_status | default('') | string == 'unhealthy'
      )
      or (hostvars[_sem_op_host].sem_operation_restart_performed | default(false) | bool)

- ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record_register.yml"
  loop: "{{ _sem_bulk_host_list | default([]) }}"
  loop_control:
    loop_var: _sem_op_host
  vars:
    _sem_delegate_host: "{{ _sem_op_host }}"
  when:
    - hostvars[_sem_op_host].semaphore_operation_record is not defined
    - hostvars[_sem_op_host].semaphore_callback_row is defined
    - >-
      (hostvars[_sem_op_host].sem_operation_force_log | default(false) | bool)
      or (
        (hostvars[_sem_op_host].semaphore_callback_row | default({})).device_status | default('') | string == 'unhealthy'
      )
      or (hostvars[_sem_op_host].sem_operation_restart_performed | default(false) | bool)
