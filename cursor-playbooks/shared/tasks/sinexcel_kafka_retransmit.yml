---
# QueryHistory by time range, then batch POST /kafka/Retransmit with FlowId list (LAND Redeliver equivalent).

- name: 准备 SINEXCEL 配置分类
  ansible.builtin.include_tasks: sinexcel_prepare_merged_cfg.yml
  when: sinexcel_retransmit_cfg is not defined

- name: 解析 Retransmit 时间字段
  ansible.builtin.set_fact:
    _sinexcel_retransmit_start: "{{ sinexcel_retransmit_cfg.StartTime | default(sinexcel_retransmit_cfg.startTime | default('')) | trim }}"
    _sinexcel_retransmit_end: "{{ sinexcel_retransmit_cfg.EndTime | default(sinexcel_retransmit_cfg.endTime | default('')) | trim }}"

- name: 校验 Retransmit 时间非空
  ansible.builtin.set_fact:
    _sinexcel_retransmit_start_ok: "{{ (_sinexcel_retransmit_start | default('') | trim | length) > 0 }}"
    _sinexcel_retransmit_end_ok: "{{ (_sinexcel_retransmit_end | default('') | trim | length) > 0 }}"

- name: DEBUG SINEXCEL QueryHistory 请求
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] QueryHistory url={{ sinexcel_kafka_api_scheme }}://{{ _sinexcel_kafka_target_host }}:{{ sinexcel_kafka_api_port }}{{ sinexcel_kafka_query_history_path }}"
      - "[DEBUG-SINEXCEL] QueryHistory request={{ {'StartTime': _sinexcel_retransmit_start, 'EndTime': _sinexcel_retransmit_end} | to_json }}"
  when:
    - _sinexcel_retransmit_start_ok | default(false) | bool
    - _sinexcel_retransmit_end_ok | default(false) | bool
  vars:
    _sinexcel_kafka_target_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"

- name: 查询历史数据（Kafka QueryHistory）
  ansible.builtin.uri:
    url: >-
      {{ sinexcel_kafka_api_scheme }}://{{ _sinexcel_kafka_target_host }}:{{ sinexcel_kafka_api_port }}{{ sinexcel_kafka_query_history_path }}
    method: POST
    body_format: json
    body:
      StartTime: "{{ _sinexcel_retransmit_start }}"
      EndTime: "{{ _sinexcel_retransmit_end }}"
    timeout: "{{ sinexcel_kafka_timeout | default(15) | int }}"
    validate_certs: "{{ sinexcel_kafka_verify_tls | default(false) | bool }}"
    return_content: true
    status_code: [200, 201, 204, 400, 401, 403, 404, 409, 422, 500, 502, 503]
  register: _sinexcel_kafka_history_raw
  delegate_to: localhost
  failed_when: false
  when:
    - _sinexcel_retransmit_start_ok | default(false) | bool
    - _sinexcel_retransmit_end_ok | default(false) | bool
  vars:
    _sinexcel_kafka_target_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"

- name: DEBUG SINEXCEL QueryHistory 响应
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] QueryHistory http={{ _sinexcel_kafka_history_raw.status | default('n/a') }}"
      - "[DEBUG-SINEXCEL] QueryHistory response={{ _sinexcel_kafka_history_raw.content | default('') | truncate(3000, True) }}"
  when:
    - _sinexcel_kafka_history_raw is defined
    - not (_sinexcel_kafka_history_raw.skipped | default(false))

- name: 解析 QueryHistory 响应信封
  ansible.builtin.set_fact:
    _sinexcel_kafka_history_envelope: "{{ _sinexcel_kafka_history_raw.content | from_json }}"
  when: >
    _sinexcel_kafka_history_raw is defined and
    not (_sinexcel_kafka_history_raw.skipped | default(false)) and
    (_sinexcel_kafka_history_raw.status | default(0) | int) == 200

- name: 解析 QueryHistory 历史行
  ansible.builtin.set_fact:
    _sinexcel_kafka_history_rows: "{{ (_sinexcel_kafka_history_envelope.Msg | default('[]') | from_json) }}"
  when: >
    _sinexcel_kafka_history_envelope is defined and
    (_sinexcel_kafka_history_envelope.Msg | default('') | trim) | length > 0

- name: 筛选待重传 FlowId（默认仅 UploadExist=false）
  ansible.builtin.set_fact:
    _sinexcel_retransmit_flow_items: >-
      {{
        (
          _sinexcel_kafka_history_rows
          | selectattr('UploadExist', 'equalto', false)
          | list
        )
        if (sinexcel_retransmit_only_missing | default(true) | bool)
        else _sinexcel_kafka_history_rows
      }}
  when: _sinexcel_kafka_history_rows is defined

- name: 初始化批量 Retransmit 请求体
  ansible.builtin.set_fact:
    _sinexcel_retransmit_body: []
  when: _sinexcel_retransmit_flow_items is defined

- name: 组装批量 Retransmit 请求体（FlowId 列表）
  ansible.builtin.set_fact:
    _sinexcel_retransmit_body: "{{ _sinexcel_retransmit_body + [{'FlowId': item.FlowId}] }}"
  loop: "{{ _sinexcel_retransmit_flow_items | default([]) }}"
  loop_control:
    label: "{{ item.FlowId | default('n/a') }}"
  when: _sinexcel_retransmit_flow_items is defined

- name: DEBUG SINEXCEL Retransmit 请求
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] Retransmit url={{ sinexcel_kafka_api_scheme }}://{{ _sinexcel_kafka_target_host }}:{{ sinexcel_kafka_api_port }}{{ sinexcel_kafka_retransmit_path }}"
      - "[DEBUG-SINEXCEL] Retransmit request={{ _sinexcel_retransmit_body | to_json }}"
  when:
    - _sinexcel_retransmit_body is defined
    - (_sinexcel_retransmit_body | length) > 0
  vars:
    _sinexcel_kafka_target_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"

- name: 批量重传历史数据（Kafka Retransmit）
  ansible.builtin.uri:
    url: >-
      {{ sinexcel_kafka_api_scheme }}://{{ _sinexcel_kafka_target_host }}:{{ sinexcel_kafka_api_port }}{{ sinexcel_kafka_retransmit_path }}
    method: POST
    body_format: json
    body: "{{ _sinexcel_retransmit_body }}"
    timeout: "{{ sinexcel_kafka_timeout | default(15) | int }}"
    validate_certs: "{{ sinexcel_kafka_verify_tls | default(false) | bool }}"
    return_content: true
    status_code: [200, 201, 204, 400, 401, 403, 404, 409, 422, 500, 502, 503]
  register: _sinexcel_kafka_retransmit_raw
  delegate_to: localhost
  failed_when: false
  when:
    - _sinexcel_retransmit_body is defined
    - (_sinexcel_retransmit_body | length) > 0
  vars:
    _sinexcel_kafka_target_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"

- name: DEBUG SINEXCEL Retransmit 跳过（时间为空）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] retransmit skipped=empty_time"
      - "[DEBUG-SINEXCEL] retransmit StartTime={{ _sinexcel_retransmit_start | default('') }} ok={{ _sinexcel_retransmit_start_ok | default(false) }}"
      - "[DEBUG-SINEXCEL] retransmit EndTime={{ _sinexcel_retransmit_end | default('') }} ok={{ _sinexcel_retransmit_end_ok | default(false) }}"
  when: not (_sinexcel_retransmit_start_ok | default(false) | bool) or not (_sinexcel_retransmit_end_ok | default(false) | bool)

- name: DEBUG SINEXCEL Retransmit 跳过（无 FlowId）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] retransmit skipped=no_flow_ids"
      - "[DEBUG-SINEXCEL] QueryHistory http={{ _sinexcel_kafka_history_raw.status | default('skipped') }}"
      - "[DEBUG-SINEXCEL] history_rows={{ _sinexcel_kafka_history_rows | default([]) | length }}"
      - "[DEBUG-SINEXCEL] flow_items_after_filter={{ _sinexcel_retransmit_flow_items | default([]) | length }}"
      - "[DEBUG-SINEXCEL] only_missing={{ sinexcel_retransmit_only_missing | default(true) }}"
      - "[DEBUG-SINEXCEL] hint={{ 'no_history_rows' if (_sinexcel_kafka_history_rows | default([]) | length) == 0 else 'all_rows_already_uploaded_or_filtered' }}"
  when:
    - _sinexcel_retransmit_start_ok | default(false) | bool
    - _sinexcel_retransmit_end_ok | default(false) | bool
    - (_sinexcel_retransmit_body | default([]) | length) == 0

- name: DEBUG SINEXCEL Retransmit 响应
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] Retransmit http={{ _sinexcel_kafka_retransmit_raw.status | default('skipped') }}"
      - "[DEBUG-SINEXCEL] Retransmit response={{ _sinexcel_kafka_retransmit_raw.content | default('') | truncate(3000, True) }}"
      - "[DEBUG-SINEXCEL] Retransmit flow_count={{ _sinexcel_retransmit_body | default([]) | length }}"
  when:
    - _sinexcel_kafka_retransmit_raw is defined
    - not (_sinexcel_kafka_retransmit_raw.skipped | default(false))
