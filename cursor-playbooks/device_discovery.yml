---
  # 与 playbook/network_discovery.yml：端口扫描用 ThreadPool + JSON；IP 列表用 ipaddress（掩码正确）。
  # 主机名获取：对开放 WinRM 的主机 delegate + win_command hostname。
  # API 端口：TCP 探测（默认 9002，环境变量 API_PORT / Variable Group 可覆盖）。
  - name: 网络发现 - 检测WinRM端口并获取主机名
    hosts: localhost
    gather_facts: no
    vars:
      # 优先级：Variable Group 环境变量（非空）> Semaphore extra-vars（subnet / network_cidr）> 默认值
      network_subnet: "{{ (lookup('env', 'NETWORK_SUBNET') | default('', true) | trim) | default(subnet | default('', true) | trim, true) | default(network_cidr | default('', true) | trim, true) | default('192.168.1.0/24', true) }}"
      winrm_port: "{{ (lookup('env', 'WINRM_PORT') | default('', true) | trim) | default('5985', true) }}"
      rdp_port: "{{ (lookup('env', 'RDP_PORT') | default('', true) | trim) | default('3389', true) }}"
      api_scan_port: "{{ (lookup('env', 'API_PORT') | default('', true) | trim) | default('9002', true) }}"
      winrm_user: "{{ (lookup('env', 'WINRM_USER') | default('', true) | trim) | default('administrator', true) }}"
      winrm_password: "{{ (lookup('env', 'WINRM_PASSWORD') | default('', true) | trim) | default('', true) }}"
      timeout_seconds: "{{ (lookup('env', 'SCAN_TIMEOUT_SECONDS') | default('', true) | trim) | default('2', true) }}"
      scan_workers: "{{ (lookup('env', 'SCAN_WORKERS') | default('', true) | trim) | default('64', true) }}"

    tasks:
      - name: 解析网段生成IP列表（Python，按真实掩码；单 IP /32 兼容）
        ansible.builtin.shell: |
          python3 - << 'PY'
          import ipaddress
          net = ipaddress.ip_network("{{ network_subnet }}", strict=False)
          addrs = list(net.hosts())
          if not addrs:
              addrs = [net.network_address]
          for ip in addrs:
              print(str(ip))
          PY
        register: ip_list
        changed_when: false

      - name: 设置目标IP列表
        ansible.builtin.set_fact:
          target_ips: "{{ ip_list.stdout_lines }}"

      - name: 显示待扫描IP数量
        ansible.builtin.debug:
          msg: "待扫描 {{ target_ips | length }} 台主机 ({{ network_subnet }})"

      - name: 使用Python扫描WinRM、RDP与API端口（限流并发）
        ansible.builtin.shell: |
          cat > /tmp/scan_ports.py << EOF
          import socket
          import json
          from concurrent.futures import ThreadPoolExecutor, as_completed

          ip_str = "{{ target_ips | join(' ') }}"
          ip_list = ip_str.split() if ip_str else []
          winrm_port = {{ winrm_port }}
          rdp_port = {{ rdp_port }}
          api_port = {{ api_scan_port }}
          timeout = {{ timeout_seconds }}
          max_workers = {{ scan_workers }}

          def is_port_open(ip, port):
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(timeout)
                  result = sock.connect_ex((ip, port))
                  sock.close()
                  return result == 0
              except Exception:
                  return False

          open_winrm_ips = set()
          open_rdp_ips = set()
          open_api_ips = set()

          with ThreadPoolExecutor(max_workers=max_workers) as executor:
              futures = {}
              for ip in ip_list:
                  futures[executor.submit(is_port_open, ip, winrm_port)] = (ip, "winrm")
                  futures[executor.submit(is_port_open, ip, rdp_port)] = (ip, "rdp")
                  futures[executor.submit(is_port_open, ip, api_port)] = (ip, "api")

              for future in as_completed(futures):
                  ip, proto = futures[future]
                  if future.result():
                      if proto == "winrm":
                          open_winrm_ips.add(ip)
                      elif proto == "rdp":
                          open_rdp_ips.add(ip)
                      else:
                          open_api_ips.add(ip)

          print(json.dumps({
              "winrm_ips": sorted(open_winrm_ips),
              "rdp_ips": sorted(open_rdp_ips),
              "api_ips": sorted(open_api_ips)
          }, ensure_ascii=False))
          EOF
          python3 /tmp/scan_ports.py
        register: python_scan
        changed_when: false

      - name: 提取Python扫描结果（JSON）
        ansible.builtin.set_fact:
          scan_output: "{{ (python_scan.stdout | default('{}')) | from_json }}"

      - name: 提取WinRM开放IP
        ansible.builtin.set_fact:
          open_winrm_ips: "{{ scan_output.winrm_ips | default([]) }}"

      - name: 提取RDP开放IP
        ansible.builtin.set_fact:
          open_rdp_ips: "{{ scan_output.rdp_ips | default([]) }}"

      - name: 提取API端口开放IP
        ansible.builtin.set_fact:
          open_api_ips: "{{ scan_output.api_ips | default([]) }}"

      - name: 显示开放WinRM端口的主机数量
        ansible.builtin.debug:
          msg: "发现 {{ open_winrm_ips | length }} 台主机开放WinRM端口 ({{ winrm_port }})"

      - name: 显示开放RDP端口的主机数量
        ansible.builtin.debug:
          msg: "发现 {{ open_rdp_ips | length }} 台主机开放RDP端口 ({{ rdp_port }})"

      - name: 显示开放API端口的主机数量
        ansible.builtin.debug:
          msg: "发现 {{ open_api_ips | length }} 台主机开放API端口 ({{ api_scan_port }})"

      - name: 使用WinRM连接获取主机名
        ansible.windows.win_command: hostname
        register: hostname_result
        delegate_to: "{{ item }}"
        loop: "{{ open_winrm_ips }}"
        loop_control:
          label: "{{ item }}"
        when: open_winrm_ips | length > 0
        ignore_errors: true
        ignore_unreachable: true
        failed_when: false
        vars:
          ansible_connection: winrm
          ansible_winrm_port: "{{ winrm_port }}"
          ansible_user: "{{ winrm_user }}"
          ansible_password: "{{ winrm_password }}"
          ansible_winrm_server_cert_validation: ignore
          ansible_winrm_transport: basic

      - name: 构建 hostname 映射（WinRM hostname 命令结果）
        ansible.builtin.set_fact:
          hostname_map: "{{ hostname_map | default({}) | combine({ item.item: (item.stdout | default('') | trim) }) }}"
        loop: "{{ hostname_result.results | default([]) }}"
        when:
          - hostname_result is defined
          - hostname_result.results is defined

      - name: 汇总发现结果（简版）
        ansible.builtin.debug:
          msg: "扫描完成：网段={{ network_subnet }}，总数={{ target_ips | length }}，WinRM在线={{ open_winrm_ips | length }}，RDP在线={{ open_rdp_ips | length }}，API在线={{ open_api_ips | length }}"

      - name: 汇总 discovered_devices 结构化结果
        ansible.builtin.set_fact:
          discovered_devices: "{{ discovered_devices | default([]) + [device_item] }}"
        loop: "{{ (open_winrm_ips + open_rdp_ips + open_api_ips) | unique }}"
        vars:
          host_ip: "{{ item }}"
          host_name: "{{ (hostname_map | default({})).get(host_ip, '') }}"
          effective_hostname: "{{ host_name if (host_name | trim) else host_ip }}"
          winrm_online: "{{ host_ip in open_winrm_ips }}"
          rdp_online: "{{ host_ip in open_rdp_ips }}"
          api_online: "{{ host_ip in open_api_ips }}"
          device_item:
            hostname: "{{ effective_hostname }}"
            ip_address: "{{ host_ip }}"
            api_port: "{{ api_scan_port | int }}"
            winrm_status: "{{ 'online' if winrm_online else 'offline' }}"
            rdp_status: "{{ 'online' if rdp_online else 'offline' }}"
            api_status: "{{ 'online' if api_online else 'offline' }}"
            device_status: >-
              {{ 'healthy' if (winrm_online and api_online) else 'unhealthy' }}

      - name: 清理临时文件
        ansible.builtin.file:
          path: /tmp/scan_ports.py
          state: absent

      # 发现流程仅输出 JSON 供前端解析；不在此写回 Semaphore。
      - name: 输出前端可解析的 JSON 数组（最后输出，固定前缀，单行）
        ansible.builtin.debug:
          msg: "SEMAPHORE_DISCOVERY_JSON={{ discovered_devices | default([]) | to_json }}"
        changed_when: false
