---
# Play 0：批量查一次 TDengine 通道 LAST(insert_time)（不依赖 WinRM）
- name: NEWARE check_restart — 批量加载 TDengine 通道新鲜度
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_tdengine_query_channel_last.yml"

- name: NEWARE 巡检重启（健康则跳过；不健康仅 restart，无 redeploy/zip）
  hosts: windows_hosts
  strategy: free
  gather_facts: false
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    # NEWARE helpers (sem_collect_process_status_windows.ps1, …) live in ./files, not shared/files.
    sem_files_dir: "{{ playbook_dir }}/files"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
    sem_operation_type: restart
    sem_debug_tag: NEWARE
    # WinRM 失败时由本 play 自行登记回调并 end_host
    winrm_defer_fail_callback: true
    _exe_name_default: uu.exe
    _exe_name_env: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) }}"
    _exe_name_base: "{{ (_exe_name_env if (_exe_name_env | length > 0) else _exe_name_default) | regex_replace('(?i)\\.exe$', '') }}"
    exe_name: "{{ _exe_name_base ~ '.exe' }}"
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('D:\\Program Files\\NEWARE', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('test', true) }}"
    exe_path: "{{ exe_dir }}\\{{ zip_name }}\\{{ exe_name }}"
    zip_path: "{{ (lookup('env', 'ZIP_PATH') | default('', true) | trim) | default('/root/neware/dbwb', true) }}"
    exe_args: "{{ (lookup('env', 'EXE_ARGS') | default('', true) | trim) | default('', true) }}"
    config_file_name: "{{ (lookup('env', 'CONFIG_FILE_NAME') | default('', true) | trim) | default('NWReport_DBWB.iconf', true) }}"
    api_host: "{{ inventory_hostname }}"
    api_port: "{% set hp = hostvars[inventory_hostname].api_port | default(0) %}{% if (hp | int) > 0 %}{{ hp | int }}{% else %}{{ (lookup('env', 'API_PORT') | default('', true) | trim) | default('9002', true) | int }}{% endif %}"
    his_data_from_time: "{{ (lookup('env', 'HIS_DATA_FROM_TIME') | default('', true) | trim) | default('', true) }}"
    neware_include_his_data_resend: true
    restart_delay: "{{ ((lookup('env', 'RESTART_DELAY') | default('', true) | trim) | default('30', true)) | int }}"
    process_verify_poll_seconds: "{{ ((lookup('env', 'PROCESS_VERIFY_POLL_SECONDS') | default('', true) | trim) | default('5', true)) | int }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"
    default_cfg: "{{ default_config | default({}) }}"
    device_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"
    merged_cfg: "{{ default_cfg | combine(device_cfg, recursive=True) }}"
    merged_system_config: "{{ (default_cfg.SystemConfig | default({})) | combine(device_cfg.SystemConfig | default({}), recursive=True) }}"
    merged_cfg_json: "{{ merged_cfg | to_json }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_resolve_device_row.yml"

    # --- 1) TDengine 通道新鲜度（首要；满足则 healthy，不跑 API/WinRM）---
    - name: 应用本机 TDengine 通道新鲜度
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/tdengine_channel_freshness_for_host.yml"

    - name: 通道数据新鲜 — 健康快路径（跳过 API / WinRM / restart）
      when: td_channel_fresh | default(false) | bool
      block:
        - name: 登记 need_reconfigure=false（通道新鲜）
          ansible.builtin.set_fact:
            need_reconfigure: false
            upload_status_ok: true
            upload_health_via_api: false
        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/check_restart_channel_fresh_callback.yml"
        - ansible.builtin.include_tasks: tasks/debug_action_snapshot.yml
        - name: 通道新鲜 — 结束本主机
          ansible.builtin.meta: end_host

    # --- 2) 新鲜度不满足：再查数据上报 API ---
    - name: 数据上报状态 API（通道不新鲜时的次级判定）
      ansible.builtin.include_tasks: tasks/neware_query_upload_status_api.yml
      vars:
        neware_api_query_context: check_restart

    - name: 数据上报 API 已健康（跳过 restart）
      when: api_upload_started | default(false) | bool
      block:
        - name: WinRM 参考探测（仅填写 winrm_status）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_probe_reference_only.yml"
          vars:
            winrm_probe_reference_label: "check_restart API 快路径 WinRM 参考"

        - name: 登记 Semaphore 状态回调行（API 健康快路径）
          ansible.builtin.set_fact:
            need_reconfigure: false
            upload_status_ok: true
            upload_health_via_api: true
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: healthy
              winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
              api_status: online
              abnormal_reason: >-
                {{
                  'WinRM unreachable (API upload healthy; TDengine channel not fresh)'
                  if not (_winrm_session_ok | default(false) | bool)
                  else ''
                }}

        - ansible.builtin.include_tasks: tasks/debug_action_snapshot.yml

        - name: API 健康 — 结束本主机
          ansible.builtin.meta: end_host

    # API 不可达 / 非 200 / 信封无效 → 需要 restart
    - name: API 未通过 — 标记需要 restart
      ansible.builtin.set_fact:
        need_reconfigure: true
        upload_health_via_api: false
      when: not (api_upload_status_ok | default(false) | bool)

    # API 通但 ExecResultData 无值（通道已不新鲜）→ 需要 restart
    - name: API ExecResultData 无值 — 标记需要 restart
      ansible.builtin.set_fact:
        need_reconfigure: true
        upload_status_ok: false
        upload_health_via_api: false
      when:
        - api_upload_status_ok | default(false) | bool
        - not (api_upload_started | default(false) | bool)

    # --- 3) 仍需处理：WinRM + 进程 + restart ---
    - name: WinRM 建连（含重试）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"

    - name: WinRM 未连通 — 登记回调后结束本主机
      when: not (_winrm_session_ok | default(false) | bool)
      block:
        - ansible.builtin.include_tasks: tasks/check_restart_winrm_fail_with_tdengine.yml

    - name: WinRM 未连通则不再执行本主机后续步骤
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"

    - name: 一次性部署 Windows 辅助脚本
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"

    - name: 解析 EXE_DIR
      block:
        - ansible.builtin.include_tasks: tasks/resolve_exe_dir_windows.yml
      ignore_unreachable: true

    - name: 采集进程状态
      block:
        - ansible.builtin.include_tasks: tasks/collect_process_status_windows.yml
        - ansible.builtin.set_fact:
            check_result: "{{ _sem_process_status }}"
      ignore_unreachable: true

    - name: WinRM 中途不可达 — 登记回调后结束本主机
      when: check_result is defined and (check_result.unreachable | default(false))
      block:
        - ansible.builtin.include_tasks: tasks/check_restart_winrm_fail_with_tdengine.yml

    - name: 进程采集失败 — 登记回调后结束本主机
      when: >
        (check_result is not defined)
        or (
          (check_result is defined)
          and not (check_result.unreachable | default(false))
          and (check_result.rc | default(0) | int) != 0
        )
      block:
        - name: 登记 Semaphore 状态回调行（进程采集失败）
          ansible.builtin.set_fact:
            host_failure_reason: "Process status collection failed"
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: unhealthy
              winrm_status: online
              api_status: offline
              abnormal_reason: >-
                Process status collection failed
                (rc={{ (check_result | default({})).rc | default('n/a') | string }};
                {{ ((check_result | default({})).stderr | default((check_result | default({})).msg | default('helper script missing or non-zero rc')) | string | trim) }})
        - ansible.builtin.include_tasks: tasks/debug_action_snapshot.yml
        - ansible.builtin.meta: end_host

    - name: 登记进程运行状态（供 stop 判断）
      ansible.builtin.set_fact:
        process_running: "{{ 'NOT_RUNNING' not in (check_result.stdout | default('')) }}"
      when: check_result is defined and 'stdout' in check_result

    - block:
        - ansible.builtin.set_fact:
            sem_operation_restart_performed: true
        - ansible.builtin.include_tasks: tasks/neware_config_start_verify.yml
      when: need_reconfigure | default(false) | bool
      rescue:
        - ansible.builtin.set_fact:
            host_failure_reason: "{{ (ansible_failed_result.msg | default('check-restart failed')) | string }}"

  post_tasks:
    - ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _sem_display_hostname }}"
          ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
          device_status: >-
            {{ 'unhealthy' if host_failure_reason is defined
               else ('unhealthy' if (need_reconfigure | default(false) | bool and not (final_start_ok | default(false) | bool))
               else 'healthy') }}
          api_status: >-
            {{ 'offline' if host_failure_reason is defined
               else ('offline' if (need_reconfigure | default(false) | bool and not (final_start_ok | default(false) | bool))
               else 'online') }}
          winrm_status: >-
            {{
              'offline'
              if not (_start_verify_winrm_ok | default(_winrm_session_ok | default(false)) | bool)
              else 'online'
            }}
          abnormal_reason: >-
            {{
              host_failure_reason | default('')
              if (host_failure_reason is defined)
              else (
                'WinRM unreachable after start (API healthy; winrm_status=offline)'
                if (
                  (final_start_ok | default(false) | bool)
                  and not (_start_verify_winrm_ok | default(_winrm_session_ok | default(false)) | bool)
                )
                else (
                  (
                    'TDengine channel data not fresh (insert_time='
                    ~ (td_channel_insert_time | default('?') | string)
                    ~ ', age_h=' ~ (td_channel_age_hours | default('?') | string)
                    ~ ')'
                  )
                  if (
                    (need_reconfigure | default(false) | bool)
                    and not (td_channel_fresh | default(false) | bool)
                    and not (final_start_ok | default(false) | bool)
                  )
                  else ''
                )
              )
            }}
      when: semaphore_callback_row is not defined

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record.yml"
      when: semaphore_callback_row is defined

    - ansible.builtin.include_tasks: tasks/debug_action_snapshot.yml
      when: semaphore_callback_row is defined

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_operation_logs.yml"
