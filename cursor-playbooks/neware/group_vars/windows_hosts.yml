---
# NEWARE BTSClient 数据上报状态 API（POST http://{ip}:{port}，body CallType=1）
api_host: "{{ inventory_hostname }}"
api_port: "{% set hp = hostvars[inventory_hostname].api_port | default(0) %}{% if (hp | int) > 0 %}{{ hp | int }}{% else %}{{ (lookup('env', 'API_PORT') | default('', true) | trim) | default('9002', true) | int }}{% endif %}"
api_status_call_type: "{{ ((lookup('env', 'API_STATUS_CALL_TYPE') | default('', true) | trim) | default('1', true)) | int }}"
api_timeout_seconds: "{{ ((lookup('env', 'API_TIMEOUT_SECONDS') | default('', true) | trim) | default('15', true)) | int }}"
api_status_retries: "{{ ((lookup('env', 'API_STATUS_RETRIES') | default('', true) | trim) | default('3', true)) | int }}"
api_status_retry_delay: "{{ ((lookup('env', 'API_STATUS_RETRY_DELAY') | default('', true) | trim) | default('3', true)) | int }}"
api_expected_response_code: "{{ (lookup('env', 'API_EXPECTED_RESPONSE_CODE') | default('', true) | trim) | default('0', true) }}"
api_expected_exec_success_code: "{{ (lookup('env', 'API_EXPECTED_EXEC_SUCCESS_CODE') | default('', true) | trim) | default('0', true) }}"
# ExecResultData：1=程序已启动 2=启动数据上报中 3=数据上报已启动（健康）
export_not_started: "{{ (lookup('env', 'EXPORT_NOT_STARTED') | default('', true) | trim) | default('1', true) }}"
export_starting: "{{ (lookup('env', 'EXPORT_STARTING') | default('', true) | trim) | default('2', true) }}"
export_started: "{{ (lookup('env', 'EXPORT_STARTED') | default('', true) | trim) | default('3', true) }}"
# 启动验证：轮询直至 ExecResultData==3（默认与 LOG_POLL_RETRIES/DELAY 对齐）
api_status_start_poll_retries: "{{ ((lookup('env', 'API_STATUS_START_POLL_RETRIES') | default('', true) | trim) | default((lookup('env', 'LOG_POLL_RETRIES') | default('', true) | trim) | default('8', true), true)) | int }}"
api_status_start_poll_delay: "{{ ((lookup('env', 'API_STATUS_START_POLL_DELAY') | default('', true) | trim) | default((lookup('env', 'LOG_POLL_DELAY') | default('', true) | trim) | default('10', true), true)) | int }}"

# WinRM 超时：单主机慢响应时优先快速失败，避免拖慢整批执行
ansible_winrm_connection_timeout: 25
ansible_winrm_operation_timeout_sec: 20
ansible_winrm_read_timeout_sec: 30
ansible_winrm_server_cert_validation: ignore
