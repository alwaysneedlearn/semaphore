---
# 在 localhost 第二 play 上构建 _status_report_msg_lines（每台设备一行）。
# 不可放在 windows_hosts play 的 run_once post_tasks：strategy: free 会在第一台完成时抢跑。
# 判定基于 semaphore_callback_row（所有路径均会设置），不再依赖 status.stdout（仅参考路径设置）。

- name: 初始化状态报告行
  ansible.builtin.set_fact:
    _status_report_msg_lines:
      - "【{{ status_report_exe_name }}】程序运行状态总览 @ {{ lookup('pipe', 'date +\"%Y-%m-%d %H:%M:%S\"') }}"
      - "--- 各主机（hostname / ip=inventory） ---"

- name: 追加各主机状态行
  ansible.builtin.set_fact:
    _status_report_msg_lines: "{{ _status_report_msg_lines + [_host_report_line] }}"
  loop: "{{ status_report_hosts }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _cb: "{{ hostvars[item].semaphore_callback_row | default({}) }}"
    _sem_hostname: "{{ (_cb.hostname | default('', true) | trim) }}"
    _sem_ip: "{{ (_cb.ip | default(item) | trim) }}"
    _host_label: >-
      {{
        (_sem_hostname | length > 0)
        | ternary(_sem_hostname ~ ' ip=' ~ _sem_ip, _sem_ip)
      }}
    _ds: "{{ _cb.device_status | default('') | string | trim }}"
    _reason: "{{ _cb.abnormal_reason | default('') | string | trim }}"
    _host_report_line: >-
      {%- if _cb == {} -%}
      · {{ _host_label }} | 不可达
      {%- elif _ds == 'healthy' -%}
      · {{ _host_label }} | 正常
      {%- elif _ds == 'unhealthy' -%}
      · {{ _host_label }} | 异常 | {{ _reason if (_reason | length > 0) else '无详情' }}
      {%- else -%}
      · {{ _host_label }} | {{ _ds if (_ds | length > 0) else '不可达' }}
      {%- endif -%}

- name: 追加状态报告汇总行
  ansible.builtin.set_fact:
    _status_report_msg_lines: "{{ _status_report_msg_lines + [_status_report_summary] }}"
  vars:
    _status_report_summary: >-
      {%- set ns = namespace(normal=0, abnormal=0, unreachable=0) -%}
      {%- for host in status_report_hosts -%}
      {%- set _cb = hostvars[host].semaphore_callback_row | default({}) -%}
      {%- set _ds = _cb.device_status | default('') | string | trim -%}
      {%- if _cb == {} -%}
      {%- set ns.unreachable = ns.unreachable + 1 -%}
      {%- elif _ds == 'healthy' -%}
      {%- set ns.normal = ns.normal + 1 -%}
      {%- else -%}
      {%- set ns.abnormal = ns.abnormal + 1 -%}
      {%- endif -%}
      {%- endfor -%}
      【汇总】总计 {{ status_report_hosts | length }} 台 · 正常 {{ ns.normal }} · 异常 {{ ns.abnormal }} · 不可达 {{ ns.unreachable }}
