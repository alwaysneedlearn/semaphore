---
# 在 localhost 第二 play 上构建 _status_report_msg_lines（每台设备一行）。
# 不可放在 windows_hosts play 的 run_once post_tasks：strategy: free 会在第一台完成时抢跑。
# 期望变量：status_report_hosts（groups['windows_hosts']）、status_report_exe_name
# 行首展示 Semaphore hostname（若有），并带 ip=；不再把 inventory_hostname 单独顶在任务 ok 行上。

- name: 初始化状态报告行
  ansible.builtin.set_fact:
    _status_report_msg_lines:
      - "【{{ status_report_exe_name }}】程序运行状态总览 @ {{ lookup('pipe', 'date +\"%Y-%m-%d %H:%M:%S\"') }}"
      - "--- 各主机（hostname / ip=inventory） ---"

- name: 追加各主机状态行
  ansible.builtin.set_fact:
    _status_report_msg_lines: "{{ _status_report_msg_lines + [_host_report_line] }}"
  loop: "{{ status_report_hosts }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _sem_row: "{{ hostvars[item].semaphore_callback_row | default({}) }}"
    _sem_hostname: "{{ (_sem_row.hostname | default('', true) | trim) }}"
    _sem_ip: "{{ (_sem_row.ip | default(item) | trim) }}"
    _host_label: >-
      {{
        (_sem_hostname | length > 0)
        | ternary(_sem_hostname ~ ' ip=' ~ _sem_ip, _sem_ip)
      }}
    _host_report_line: >-
      {%- set h = item -%}
      {%- if hostvars[h].status is defined and hostvars[h].status.stdout is defined -%}
      {%- set host_status = hostvars[h].status.stdout | trim -%}
      {%- if 'NOT_RUNNING' in host_status -%}
      · {{ _host_label }} | 未运行 | {{ host_status }}
      {%- elif hostvars[h].need_reconfigure is defined and hostvars[h].need_reconfigure | bool -%}
      · {{ _host_label }} | 异常(需重配) | {{ host_status }} | 日志_OK={{ hostvars[h].log_status_ok | default('n/a') }}
      {%- else -%}
      · {{ _host_label }} | 正常 | {{ host_status }} | 日志_OK={{ hostvars[h].log_status_ok | default('n/a') }}
      {%- endif -%}
      {%- else -%}
      · {{ _host_label }} | 不可达
      {%- endif -%}

- name: 追加状态报告汇总行
  ansible.builtin.set_fact:
    _status_report_msg_lines: "{{ _status_report_msg_lines + [_status_report_summary] }}"
  vars:
    _status_report_summary: >-
      {%- set ns = namespace(normal=0, abnormal=0, not_running=0, unreachable=0) -%}
      {%- for host in status_report_hosts -%}
      {%- if hostvars[host].status is not defined or 'stdout' not in hostvars[host].status -%}
      {%- set ns.unreachable = ns.unreachable + 1 -%}
      {%- elif 'NOT_RUNNING' in hostvars[host].status.stdout -%}
      {%- set ns.not_running = ns.not_running + 1 -%}
      {%- elif hostvars[host].need_reconfigure is defined and hostvars[host].need_reconfigure | bool -%}
      {%- set ns.abnormal = ns.abnormal + 1 -%}
      {%- else -%}
      {%- set ns.normal = ns.normal + 1 -%}
      {%- endif -%}
      {%- endfor -%}
      【汇总】总计 {{ status_report_hosts | length }} 台 · 正常 {{ ns.normal }} · 异常(需重配) {{ ns.abnormal }} · 未运行 {{ ns.not_running }} · 不可达 {{ ns.unreachable }}
