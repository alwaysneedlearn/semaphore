---
# 启动验证：启动后按 RESTART_DELAY / PROCESS_VERIFY_POLL_SECONDS 轮询进程（仅诊断 / winrm_status）
# final_start_ok 不依赖本结果；until/retries 必须挂在 win_shell 上。

- name: 启动验证：计算启动后进程轮询次数
  ansible.builtin.set_fact:
    _process_verify_poll_retries: >-
      {{
        [
          (
            (
              (restart_delay | default(30) | int) +
              (process_verify_poll_seconds | default(5) | int) -
              1
            ) / (process_verify_poll_seconds | default(5) | int)
          ) | int,
          1
        ] | max | int
      }}

- name: 启动验证：轮询启动后进程状态
  environment:
    EXE_NAME: "{{ exe_name }}"
    PROCESS_ALIVE_MIN_HANDLES: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_HANDLES') | default('', true) | trim) | default('1', true) }}"
    PROCESS_ALIVE_MIN_WS_KB: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_WS_KB') | default('', true) | trim) | default('512', true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_collect_process_status_windows.ps1
  args:
    chdir: C:\Windows\Temp
  register: _sem_process_status
  until: >
    _sem_process_status is defined and
    not (_sem_process_status.unreachable | default(false)) and
    ('stdout' in _sem_process_status) and
    ('NOT_RUNNING' not in (_sem_process_status.stdout | default('')))
  retries: "{{ _process_verify_poll_retries | int }}"
  delay: "{{ process_verify_poll_seconds | default(5) | int }}"
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: 启动验证：登记启动后进程终态
  ansible.builtin.set_fact:
    check_result_after_start: "{{ _sem_process_status }}"

- name: 启动验证：DEBUG 启动后进程轮询汇总
  ansible.builtin.debug:
    msg:
      - "[DEBUG-PROCESS-POLL] retries_cfg={{ _process_verify_poll_retries }} interval_s={{ process_verify_poll_seconds | default(5) }}"
      - "[DEBUG-PROCESS-POLL] poll_attempts={{ _sem_process_status.attempts | default(1) }}"
      - "[DEBUG-PROCESS-POLL] final_stdout={{ check_result_after_start.stdout | default('n/a') | trim }}"
  when: check_result_after_start is defined

- name: 启动验证：输出启动后程序状态（轮询终态）
  ansible.builtin.debug:
    msg: "[程序状态-启动后] {{ check_result_after_start.stdout | trim }}"
  when: >
    check_result_after_start is defined and
    not (check_result_after_start.unreachable | default(false)) and
    'stdout' in check_result_after_start

- name: 启动验证：登记进程/WinRM 诊断事实
  ansible.builtin.set_fact:
    _start_verify_winrm_ok: >-
      {{
        check_result_after_start is defined and
        not (check_result_after_start.unreachable | default(false))
      }}
    process_running_after_start: >-
      {{
        check_result_after_start is defined and
        not (check_result_after_start.unreachable | default(false)) and
        'stdout' in check_result_after_start and
        ('NOT_RUNNING' not in (check_result_after_start.stdout | default('')))
      }}
