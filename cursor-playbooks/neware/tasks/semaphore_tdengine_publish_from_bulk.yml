---
# 在 bulk PUT 之后向 TDengine 写入 neware_remote_computer_status 行。
# 每台设备只保留一行：ts 由 computer_name 哈希派生，固定不变，相同 ts INSERT 时 TDengine 覆盖该行。
#
# Variable Group ENV 配置项：
#   TDENGINE_URL          必填，REST 基址（不含 /rest/sql），例如 http://tdengine:6041
#   TDENGINE_USER         可选 Basic 认证用户名
#   TDENGINE_PASSWORD     可选 Basic 认证密码
#   TDENGINE_DATABASE     可选，默认 lab
#   TDENGINE_STATUS_TABLE 可选，默认 neware_remote_computer_status
#
# 表结构（每台设备一行，ts 固定，重复 INSERT 覆盖）：
#   ts              TIMESTAMP  — 由 computer_name md5 哈希派生的固定毫秒时间戳
#   computer_name   VARCHAR(200) — 设备 hostname
#   status          VARCHAR(200) — online（healthy）/ offline（其余）
#   updated_time    TIMESTAMP  — 本次写入的实际 UTC 时间
#   check_time      TIMESTAMP  — 本次写入的实际 UTC 时间（同 updated_time）
#   supplier        VARCHAR(100) — 固定值 newarerm

- name: 解析 TDengine 凭据（Variable Group ENV）
  ansible.builtin.set_fact:
    _td_url: "{{ lookup('env', 'TDENGINE_URL') | default('', true) | trim }}"
    _td_user: "{{ lookup('env', 'TDENGINE_USER') | default('', true) | trim }}"
    _td_pass: "{{ lookup('env', 'TDENGINE_PASSWORD') | default('', true) | trim }}"
    _td_db: "{{ (lookup('env', 'TDENGINE_DATABASE') | default('', true) | trim) | default('lab', true) }}"
    _td_table: "{{ (lookup('env', 'TDENGINE_STATUS_TABLE') | default('', true) | trim) | default('neware_remote_computer_status', true) }}"

- name: TDengine 写入前提检查（需 TDENGINE_URL 且有 bulk 行）
  ansible.builtin.set_fact:
    _td_enabled: "{{ (_td_url | trim | length) > 0 and (semaphore_status_bulk_updates | default([]) | length) > 0 }}"

- name: 规范化 TDengine REST 基址
  ansible.builtin.set_fact:
    _td_base: "{{ _td_url | regex_replace('/rest/sql/?$', '') | regex_replace('/$', '') }}"
  when: _td_enabled | bool

- name: 获取当前 UTC 时间（作为 updated_time / check_time）
  ansible.builtin.command: date -u +"%Y-%m-%d %H:%M:%S.%3N"
  register: _td_now_cmd
  changed_when: false
  when: _td_enabled | bool

- name: 设置当前 UTC 时间变量
  ansible.builtin.set_fact:
    _td_now: "{{ _td_now_cmd.stdout | trim }}"
  when:
    - _td_enabled | bool
    - _td_now_cmd is defined and not (_td_now_cmd.skipped | default(false))

- name: 组装 TDengine INSERT 行（每台设备 ts 固定，重复写入覆盖同行）
  ansible.builtin.set_fact:
    _td_value_parts: "{{ _td_value_parts | default([]) + [_td_tuple] }}"
  loop: "{{ semaphore_status_bulk_updates | default([]) }}"
  loop_control:
    label: "{{ item.hostname | default(item.ip | default('host')) }}"
  vars:
    _raw_st: "{{ item.device_status | default(item.status | default('unhealthy')) }}"
    _td_mapped: "{{ 'online' if (_raw_st | string) == 'healthy' else 'offline' }}"
    _cn: "{{ item.hostname | default(item.ip | default('')) | string | replace(\"'\", \"''\") }}"
    # 固定 ts：以 2000-01-01 00:00:00 UTC（epoch ms = 946684800000）为基准，
    # 加上 computer_name md5 哈希前8位（十六进制）转换成的整数毫秒偏移（0~4294967295 ms ≈ 49.7天范围，唯一性足够）。
    # 相同 computer_name 每次算出相同 ts，TDengine 覆盖该行，实现「每台设备只保留一行」。
    _hash_hex: "{{ _cn | hash('md5') | truncate(8, True, '') }}"
    _hash_int: "{{ (_hash_hex | int(base=16)) }}"
    _td_fixed_ts_ms: "{{ 946684800000 + (_hash_int | int) }}"
    _td_tuple: >-
      ({{ _td_fixed_ts_ms }},'{{ _cn }}','{{ _td_mapped }}','{{ _td_now }}','{{ _td_now }}','newarerm')
  when:
    - _td_enabled | bool
    - _td_now is defined

- name: POST TDengine status INSERT（覆盖更新各设备唯一行）
  ansible.builtin.uri:
    url: "{{ _td_base }}/rest/sql"
    method: POST
    headers: "{{ _td_headers }}"
    body: "{{ _td_sql }}"
    body_format: raw
    status_code: [200, 400, 401, 403, 500, 502, 503]
  register: _td_put_result
  failed_when: false
  vars:
    _td_sql: >-
      INSERT INTO `{{ _td_db }}`.`{{ _td_table }}`
      (ts, computer_name, status, updated_time, check_time, supplier)
      VALUES {{ _td_value_parts | join(',') }}
    _td_headers: >-
      {{
        {'Content-Type': 'text/plain'}
        | combine(
            {'Authorization': 'Basic ' + ((_td_user + ':' + _td_pass) | b64encode)}
            if (_td_user | trim | length) > 0 else {}
          )
      }}
  when:
    - _td_enabled | bool
    - (_td_value_parts | default([]) | length) > 0
    - _td_base is defined

- name: DEBUG TDengine INSERT 响应
  ansible.builtin.debug:
    msg:
      - "[DEBUG-TDENGINE] url={{ _td_base | default('') }}/rest/sql table={{ _td_db }}.{{ _td_table }} rows={{ _td_value_parts | default([]) | length }}"
      - "[DEBUG-TDENGINE] http_status={{ _td_put_result.status | default('n/a') }}"
      - "[DEBUG-TDENGINE] response={{ _td_put_result.content | default('') | truncate(1500, True) }}"
  when: _td_put_result is defined and not (_td_put_result.skipped | default(false))

- name: 跳过 TDengine（未配置 TDENGINE_URL）
  ansible.builtin.debug:
    msg: >-
      TDengine publish skipped: set TDENGINE_URL in template Variable Group ENV.
      bulk_rows={{ semaphore_status_bulk_updates | default([]) | length }}
  when:
    - (semaphore_status_bulk_updates | default([]) | length) > 0
    - (_td_url | default('') | trim | length) < 1
