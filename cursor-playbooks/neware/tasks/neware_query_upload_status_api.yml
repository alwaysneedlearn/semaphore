---
# POST 查询 NEWARE BTSClient 数据上报状态（根路径 HTTP API，CallType=API_STATUS_CALL_TYPE）。
# 需要 play/group vars：api_host、api_port；可选 api_status_*、export_*、neware_api_query_context。
# 产出：api_upload_status_result、api_upload_exec_result_data、api_upload_status_ok、api_upload_started

- name: 数据上报状态：登记 API 查询参数
  ansible.builtin.set_fact:
    _neware_api_patrol_mode: "{{ (neware_api_query_context | default('', true) | trim) in ['patrol', 'check_restart'] }}"
    _neware_api_status_call_type: "{{ api_status_call_type | default(((lookup('env', 'API_STATUS_CALL_TYPE') | default('', true) | trim) | default('1', true)) | int) | int }}"
    _neware_api_timeout_seconds: >-
      {{
        (
          (lookup('env', 'API_PATROL_TIMEOUT_SECONDS') | default('', true) | trim)
          if ((neware_api_query_context | default('', true) | trim) in ['patrol', 'check_restart'])
          else (lookup('env', 'API_TIMEOUT_SECONDS') | default('', true) | trim)
        )
        | default(
            '5' if ((neware_api_query_context | default('', true) | trim) in ['patrol', 'check_restart']) else '15',
            true
          )
        | int
      }}
    _neware_api_status_retries: >-
      {{
        0
        if ((neware_api_query_context | default('', true) | trim) in ['patrol', 'check_restart'])
        else (
          (lookup('env', 'API_STATUS_RETRIES') | default('', true) | trim)
          | default('3', true)
          | int
        )
      }}
    _neware_api_status_retry_delay: "{{ api_status_retry_delay | default(((lookup('env', 'API_STATUS_RETRY_DELAY') | default('', true) | trim) | default('3', true)) | int) | int }}"
    _neware_api_expected_response_code: "{{ api_expected_response_code | default(((lookup('env', 'API_EXPECTED_RESPONSE_CODE') | default('', true) | trim) | default('0', true)) | int) | int }}"
    _neware_api_expected_exec_success_code: "{{ api_expected_exec_success_code | default(((lookup('env', 'API_EXPECTED_EXEC_SUCCESS_CODE') | default('', true) | trim) | default('0', true)) | int) | int }}"
    _neware_export_upload_started: "{{ export_started | default(((lookup('env', 'EXPORT_STARTED') | default('', true) | trim) | default('3', true)) | int) | int }}"

- name: 数据上报状态：调用 API 查询（Patrol 单次快速探测）
  ansible.builtin.uri:
    url: "http://{{ api_host }}:{{ api_port }}"
    method: POST
    body_format: json
    body:
      CallType: "{{ _neware_api_status_call_type | int }}"
    headers:
      Content-Type: "application/json; charset=utf-8"
    return_content: true
    timeout: "{{ _neware_api_timeout_seconds | int }}"
  register: api_upload_status_result
  delegate_to: localhost
  failed_when: false
  when: _neware_api_patrol_mode | default(false) | bool

- name: 数据上报状态：调用 API 查询（含失败重试）
  ansible.builtin.uri:
    url: "http://{{ api_host }}:{{ api_port }}"
    method: POST
    body_format: json
    body:
      CallType: "{{ _neware_api_status_call_type | int }}"
    headers:
      Content-Type: "application/json; charset=utf-8"
    return_content: true
    timeout: "{{ _neware_api_timeout_seconds | int }}"
  register: api_upload_status_result
  delegate_to: localhost
  failed_when: false
  until: >
    api_upload_status_result is defined and
    (api_upload_status_result.status | default(0) | int) == 200 and
    ((api_upload_status_result.content | default('') | trim) | length) > 0 and
    ((api_upload_status_result.content | from_json).ResponeResultCode | default(-1) | int == _neware_api_expected_response_code | int) and
    ((api_upload_status_result.content | from_json).ExecResultCode | default(-1) | int == _neware_api_expected_exec_success_code | int)
  retries: "{{ _neware_api_status_retries | int }}"
  delay: "{{ _neware_api_status_retry_delay | int }}"
  when: not (_neware_api_patrol_mode | default(false) | bool)

- ansible.builtin.include_tasks: neware_query_upload_status_api_apply.yml
