---
# 单次建连；外层 loop 在 session 已 ok 时整块 skip（when 写在 block 上）
- name: 单次 WinRM 建连尝试
  when: not (_winrm_session_ok | default(false) | bool)
  block:
    - name: "重试前重置与等待（第 {{ _winrm_connect_attempt }}/{{ winrm_connect_retries }} 次建连）"
      ansible.builtin.include_tasks: "{{ _sem_tasks_dir }}/winrm_connect_retry_pause.yml"
      when: (_winrm_connect_attempt | int) > 1

    - name: "WinRM ping 探测（第 {{ _winrm_connect_attempt }}/{{ winrm_connect_retries }} 次）"
      ansible.windows.win_ping:
      register: _winrm_ping
      failed_when: false
      ignore_unreachable: true

    - ansible.builtin.include_tasks: "{{ _sem_tasks_dir }}/winrm_eval_ping_result.yml"

    - name: 登记 WinRM 已连通
      ansible.builtin.set_fact:
        _winrm_session_ok: true
        _winrm_ping_last_success: "{{ _winrm_ping }}"
      when: _winrm_ping_ok | default(false) | bool

  always:
    - ansible.builtin.include_tasks: "{{ _sem_tasks_dir }}/winrm_eval_ping_result.yml"
      when: _winrm_ping is defined

    # 无 ignore_unreachable 时 UNREACHABLE 会跳过 block 内后续任务；always 内再 clear 以便重试与登记回调
    - name: ping 未成功则标记并清除 unreachable
      when: _winrm_ping is defined and not (_winrm_ping_ok | default(false) | bool)
      block:
        - name: 标记 WinRM 建连未成功
          ansible.builtin.set_fact:
            _winrm_connect_failed: true
        - name: DEBUG 本次 ping 未成功
          ansible.builtin.debug:
            msg: >-
              [DEBUG-WINRM] 第 {{ _winrm_connect_attempt }}/{{ winrm_connect_retries }} 次 ping 未成功
              （unreachable={{ _winrm_ping.unreachable | default(false) }} ping={{ _winrm_ping.ping | default('') }}）
              {% if (_winrm_connect_attempt | int) < (winrm_connect_retries | int) %}
              → 将继续下一次建连重试（非「已连通」后的业务步骤）
              {% else %}
              → 已达最大重试次数，将登记 unhealthy 并 end_host
              {% endif %}
        - name: 执行 clear_host_errors
          ansible.builtin.meta: clear_host_errors
