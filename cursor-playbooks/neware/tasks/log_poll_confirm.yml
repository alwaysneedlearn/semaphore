---
# 依赖：log_path、log_poll_state_path、log_poll_baseline（启动程序前写入）、log_success_keyword
- name: 启动验证：日志轮询确认
  win_shell: |
    $ErrorActionPreference = 'Stop'
    $logPath = $env:SEM_LOG_PATH
    $statePath = $env:SEM_LOG_POLL_STATE
    $keyword = $env:SEM_LOG_KEYWORD
    $baseline = [int64]0
    if (-not [string]::IsNullOrWhiteSpace($env:SEM_LOG_BASELINE)) {
      $baseline = [int64]$env:SEM_LOG_BASELINE
    }
    # Ansible 若未解析 stdout_lines，SEM_LOG_BASELINE 可能为 0；以 state 中启动程序前写入的书签为准
    if ($baseline -eq 0 -and (Test-Path -LiteralPath $statePath)) {
      try {
        $rawB = (Get-Content -LiteralPath $statePath -Raw -ErrorAction Stop).Trim()
        if ($rawB.Length -gt 0) {
          $fromState = [int64]$rawB
          if ($fromState -gt 0) { $baseline = $fromState }
        }
      } catch { }
    }
    if ([string]::IsNullOrWhiteSpace($logPath) -or [string]::IsNullOrWhiteSpace($statePath) -or [string]::IsNullOrWhiteSpace($keyword)) {
      [Console]::Error.WriteLine('[LOG_POLL] missing SEM_LOG_PATH / SEM_LOG_POLL_STATE / SEM_LOG_KEYWORD')
      exit 1
    }
    if (!(Test-Path -LiteralPath $logPath)) {
      Write-Output "LOG_POLL_ATTEMPT|file_missing path=$logPath"
      exit 1
    }

    $lastLine = $baseline
    if (Test-Path -LiteralPath $statePath) {
      try {
        $raw = (Get-Content -LiteralPath $statePath -Raw -ErrorAction Stop).Trim()
        if ($raw.Length -gt 0) {
          $cursor = [int64]$raw
          if ($cursor -gt $lastLine) { $lastLine = $cursor }
        }
      } catch {
        $lastLine = $baseline
      }
    }

    function Test-KeywordLine([string]$line, [string]$kw) {
      if ([string]::IsNullOrWhiteSpace($line) -or [string]::IsNullOrWhiteSpace($kw)) { return $false }
      if ($line.IndexOf($kw, [StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true }
      $alt = $kw.Trim()
      if ($alt.StartsWith('提示 ')) {
        $short = $alt.Substring(3)
        if ($line.IndexOf($short, [StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true }
      } elseif ($line.IndexOf(('提示 ' + $alt), [StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true }
      return $false
    }

    $readRetries = {{ log_read_retries | default(5) | int }}
    $readRetryDelay = {{ log_read_retry_delay | default(2) | int }}

    function Scan-Log([int64]$startAfter, [ref]$totalLines, [ref]$foundMatch, [ref]$newLines) {
      $foundMatch.Value = $false
      $totalLines.Value = [int64]0
      $newLines.Value = New-Object System.Collections.Generic.List[string]
      $attempt = 0
      while ($true) {
        $attempt++
        $stream = $null
        $reader = $null
        try {
          $stream = [System.IO.File]::Open($logPath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
          $reader = New-Object System.IO.StreamReader($stream, [System.Text.Encoding]::UTF8, $true)
          while ($null -ne ($line = $reader.ReadLine())) {
            $totalLines.Value++
            if ($totalLines.Value -gt $startAfter) {
              [void]$newLines.Value.Add($line)
              if (-not $foundMatch.Value -and (Test-KeywordLine $line $keyword)) {
                $foundMatch.Value = $true
              }
            }
          }
          return
        } catch {
          if ($attempt -ge $readRetries) { throw }
          Write-Output ("LOG_READ_RETRY|attempt={0}|delay_s={1}" -f $attempt, $readRetryDelay)
          Start-Sleep -Seconds $readRetryDelay
        } finally {
          if ($null -ne $reader) { $reader.Close() }
          if ($null -ne $stream) { $stream.Dispose() }
        }
      }
    }

    function Write-PollDebug([int64]$startAfter, [int64]$total, [bool]$found, [int]$newLineCount, [string]$phase) {
      Write-Output ("LOG_POLL_ATTEMPT|phase={0}|baseline={1}|start_after={2}|total_lines={3}|new_lines={4}|keyword_found={5}|keyword={6}|path={7}" -f $phase, $baseline, $startAfter, $total, $newLineCount, $found, $keyword, $logPath)
    }

    $total = [int64]0
    $found = $false
    $newLines = $null
    Scan-Log $lastLine ([ref]$total) ([ref]$found) ([ref]$newLines)
    Write-PollDebug $lastLine $total $found $newLines.Count 'scan'

    if ($total -lt $lastLine) {
      if ($total -lt $baseline) {
        # 启动后日志被截断/重建：当前文件行数 < exe 启动前书签，必须从第 0 行重扫
        Write-Output ("LOG_POLL_RESET|reason=file_lines_below_baseline|total={0}|baseline={1}" -f $total, $baseline)
        $lastLine = [int64]0
      } else {
        $lastLine = $baseline
      }
      Scan-Log $lastLine ([ref]$total) ([ref]$found) ([ref]$newLines)
      Write-PollDebug $lastLine $total $found $newLines.Count 'rescan_after_shrink'
    }

    # 勿把 state 写成大于实际行数（旧逻辑会导致截断后永远只扫 >369 的空区间）
    [System.IO.File]::WriteAllText($statePath, $total.ToString())

    if ($found) {
      Write-Output "LOG_OK|baseline=$baseline|cursor=$lastLine|total=$total"
      exit 0
    }
    $tail = @($newLines.Value | Select-Object -Last 5)
    $sampleIdx = 0
    foreach ($ln in $tail) {
      $sampleIdx++
      $snippet = $ln
      if ($snippet.Length -gt 240) { $snippet = $snippet.Substring(0, 240) + '...' }
      Write-Output ("LOG_MISS_SAMPLE|{0}|{1}" -f $sampleIdx, $snippet)
    }
    Write-Output "LOG_MISS|baseline=$baseline|cursor=$lastLine|total=$total"
    exit 1
  environment:
    SEM_LOG_PATH: "{{ log_path }}"
    SEM_LOG_POLL_STATE: "{{ log_poll_state_path }}"
    SEM_LOG_KEYWORD: "{{ log_success_keyword }}"
    SEM_LOG_BASELINE: "{{ log_poll_baseline | default(0) | int }}"
  register: log_poll
  retries: "{{ log_poll_retries }}"
  delay: "{{ log_poll_delay }}"
  until: log_poll.rc == 0
  failed_when: false

- name: 启动验证：DEBUG 日志轮询每次扫描内容
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LOG-POLL] attempt {{ ansible_loop.index }}/{{ ansible_loop.length }} rc={{ item.rc | default('n/a') }} attempts_total={{ log_poll.attempts | default(1) }}"
      - "{{ _poll_lines }}"
  vars:
    _poll_lines: "{{ item.stdout_lines | default([]) | map('regex_replace', '\\r$', '') | map('trim') | select('search', 'LOG_POLL|LOG_MISS') | list }}"
  loop: "{{ log_poll.results | default([log_poll], true) }}"
  loop_control:
    extended: true
    label: "poll attempt {{ ansible_loop.index }}"
  when: log_poll is defined

- name: 启动验证：DEBUG 日志轮询未注册结果
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LOG-POLL] warning: log_poll 未 register（检查 include_tasks/when）"
      - "[DEBUG-LOG-POLL] log_poll_baseline={{ log_poll_baseline | default('n/a') }}"
  when: log_poll is not defined
