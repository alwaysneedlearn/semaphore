---
# 更新桌面快捷方式（覆盖同名 .lnk，勾选「用管理员身份运行」）。
# 前置：deploy_sem_windows_helper_scripts.yml；依赖 play vars：exe_path。
# 可选 ENV：SHORTCUT_DESKTOP、SHORTCUT_NAME；EXE_ARGS 写入快捷方式 Arguments。

- name: 更新桌面快捷方式（管理员启动）
  environment:
    SEMAPHORE_SHORTCUT_EXE_PATH: "{{ exe_path }}"
    SEMAPHORE_SHORTCUT_DESKTOP: "{{ (lookup('env', 'SHORTCUT_DESKTOP') | default('', true) | trim) | default('', true) }}"
    SEMAPHORE_SHORTCUT_NAME: "{{ (lookup('env', 'SHORTCUT_NAME') | default('', true) | trim) | default('', true) }}"
    SEMAPHORE_EXE_ARGS: "{{ exe_args | default('', true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_update_desktop_shortcut_windows.ps1
  args:
    chdir: C:\Windows\Temp
  register: _sem_desktop_shortcut
  changed_when: >-
    _sem_desktop_shortcut is defined and
    'SHORTCUT_OK' in (_sem_desktop_shortcut.stdout | default(''))
  failed_when: false

- name: DEBUG 桌面快捷方式
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SHORTCUT] exe_path={{ exe_path | default('n/a') }}"
      - "[DEBUG-SHORTCUT] {{ (_sem_desktop_shortcut.stdout | default('n/a')) | trim }}"
      - "[DEBUG-SHORTCUT] rc={{ _sem_desktop_shortcut.rc | default('n/a') }}"
  when: _sem_desktop_shortcut is defined
