---
# NEWARE: stop (optional) → INI config → start → verify. No zip.

- name: 停止程序（运行中时）
  ansible.builtin.include_tasks: stop_program_windows.yml
  when: process_running | default(false) | bool

- name: 写入 INI 设备配置
  ansible.builtin.include_tasks: apply_neware_style_device_config_files.yml

- name: WinRM 中途建连（日志轮询前）
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_refresh_midplay.yml"
  vars:
    winrm_refresh_label: "WinRM 中途建连（日志轮询前）"

- name: 解析 Windows 当日日志路径
  ansible.builtin.include_tasks: log_poll_resolve_windows_path.yml

- name: 记录启动程序前日志行书签
  ansible.builtin.include_tasks: log_poll_record_baseline_before_start_api.yml
  when: log_path is defined

- name: 获取当前登录用户（交互式计划任务）
  ansible.windows.win_shell: |
    $explorerUser = Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
      ForEach-Object {
        $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($o -and $o.ReturnValue -eq 0 -and $o.User) { $o.User.Trim() }
      } |
      Where-Object { $_ } |
      Select-Object -First 1
    if ($explorerUser) {
      Write-Output $explorerUser
    } else {
      Write-Output "{{ hostvars[inventory_hostname].ansible_user | default('Administrator') }}"
    }
  register: get_username_result
  changed_when: false

- name: 规范化启动用户
  ansible.builtin.set_fact:
    _reconfig_profile_user: "{{ (get_username_result.stdout_lines | default([]) | last | default(get_username_result.stdout | default(''))) | trim }}"

- name: 启动程序
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/reconfig_start_program_windows.yml"

- name: 启动验证
  ansible.builtin.include_tasks: start_verify_after_reconfig.yml
