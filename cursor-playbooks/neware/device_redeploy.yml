---
- name: NEWARE 重新部署（目标机 zip 检查 → 条件复制 → 配置 → 启停验证）
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/../shared/files"
    sem_profile_files_dir: "{{ playbook_dir }}/files"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
    sem_debug_tag: NEWARE
    _exe_name_default: uu.exe
    _exe_name_env: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) }}"
    _exe_name_base: "{{ (_exe_name_env if (_exe_name_env | length > 0) else _exe_name_default) | regex_replace('(?i)\\.exe$', '') }}"
    exe_name: "{{ _exe_name_base ~ '.exe' }}"
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('D:\\Program Files\\NEWARE', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('test', true) }}"
    exe_path: "{{ exe_dir }}\\{{ zip_name }}\\{{ exe_name }}"
    zip_path: "{{ (lookup('env', 'ZIP_PATH') | default('', true) | trim) | default('/root/neware/dbwb', true) }}"
    redeploy_zip_dest: "{{ exe_dir }}\\{{ zip_name }}.zip"
    redeploy_zip_src: "{{ zip_path }}/{{ zip_name }}.zip"
    redeploy_extract_dest: "{{ exe_dir }}"
    exe_args: "{{ (lookup('env', 'EXE_ARGS') | default('', true) | trim) | default('', true) }}"
    config_file_name: "{{ (lookup('env', 'CONFIG_FILE_NAME') | default('', true) | trim) | default('NWReport_DBWB.iconf', true) }}"
    api_host: "{{ inventory_hostname }}"
    api_port: "{% set hp = hostvars[inventory_hostname].api_port | default(0) %}{% if (hp | int) > 0 %}{{ hp | int }}{% else %}{{ (lookup('env', 'API_PORT') | default('', true) | trim) | default('9002', true) | int }}{% endif %}"
    his_data_from_time: "{{ (lookup('env', 'HIS_DATA_FROM_TIME') | default('', true) | trim) | default('', true) }}"
    restart_delay: "{{ ((lookup('env', 'RESTART_DELAY') | default('', true) | trim) | default('30', true)) | int }}"
    process_verify_poll_seconds: "{{ ((lookup('env', 'PROCESS_VERIFY_POLL_SECONDS') | default('', true) | trim) | default('5', true)) | int }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"
    default_cfg: "{{ default_config | default({}) }}"
    device_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"
    merged_cfg: "{{ default_cfg | combine(device_cfg, recursive=True) }}"
    merged_system_config: "{{ (default_cfg.SystemConfig | default({})) | combine(device_cfg.SystemConfig | default({}), recursive=True) }}"
    merged_cfg_json: "{{ merged_cfg | to_json }}"
    log_success_keyword: "{{ (lookup('env', 'LOG_SUCCESS_KEYWORD') | default('', true) | trim) | default('提示 本轮通道状态上传成功', true) }}"
    log_poll_retries: "{{ ((lookup('env', 'LOG_POLL_RETRIES') | default('', true) | trim) | default('6', true)) | int }}"
    log_poll_delay: "{{ ((lookup('env', 'LOG_POLL_DELAY') | default('', true) | trim) | default('10', true)) | int }}"
    log_read_retries: "{{ ((lookup('env', 'LOG_READ_RETRIES') | default('', true) | trim) | default('5', true)) | int }}"
    log_read_retry_delay: "{{ ((lookup('env', 'LOG_READ_RETRY_DELAY') | default('', true) | trim) | default('2', true)) | int }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"
    - block:
        - ansible.builtin.include_tasks: tasks/resolve_exe_dir_windows.yml
      ignore_unreachable: true

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/redeploy_ensure_package_windows.yml"

    - block:
        - ansible.builtin.include_tasks: tasks/collect_process_status_windows.yml
        - ansible.builtin.set_fact:
            check_result: "{{ _sem_process_status }}"
      ignore_unreachable: true

    - ansible.builtin.set_fact:
        process_running: "{{ 'NOT_RUNNING' not in (check_result.stdout | default('')) }}"

    - block:
        - ansible.builtin.include_tasks: tasks/neware_config_start_verify.yml
      rescue:
        - ansible.builtin.set_fact:
            host_failure_reason: "{{ (ansible_failed_result.msg | default('redeploy failed')) | string }}"

  post_tasks:
    - ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ (_sem_dev | default({})).hostname | default('', true) }}"
          ip: "{{ (_sem_dev | default({})).ip | default(inventory_hostname, true) }}"
          device_status: "{{ 'unhealthy' if (host_failure_reason is defined) else ('healthy' if (final_start_ok | default(false) | bool) else 'unhealthy') }}"
          api_status: "{{ 'offline' if (host_failure_reason is defined) else ('online' if (final_start_ok | default(false) | bool) else 'offline') }}"
          winrm_status: online
          abnormal_reason: "{{ host_failure_reason | default('') }}"
      vars:
        _sem_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"

    - ansible.builtin.include_tasks: tasks/debug_action_snapshot.yml

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
