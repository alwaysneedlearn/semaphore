---
# Play 0：批量查一次 TDengine 通道 LAST(insert_time)（不依赖 WinRM；与 check_restart 同一套）
- name: NEWARE status — 批量加载 TDengine 通道新鲜度
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_tdengine_query_channel_last.yml"

- name: 生成所有主机程序运行状态总览
  hosts: windows_hosts
  strategy: free
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/files"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
    sem_operation_type: status
    sem_debug_tag: NEWARE
    # Variable Group 环境变量（非空）优先，否则使用下列默认值
    _exe_name_default: uu.exe
    _exe_name_env: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) }}"
    _exe_name_base: "{{ (_exe_name_env if (_exe_name_env | length > 0) else _exe_name_default) | regex_replace('(?i)\\.exe$', '') }}"
    exe_name: "{{ _exe_name_base ~ '.exe' }}"
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('D:\\Program Files\\NEWARE', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('test', true) }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_resolve_device_row.yml"

    # --- 1) TDengine 通道新鲜度（首要；满足则 healthy，不跑 API/WinRM）---
    - name: 应用本机 TDengine 通道新鲜度
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/tdengine_channel_freshness_for_host.yml"

    - name: 通道数据新鲜 — 健康快路径（跳过 API / WinRM）
      when: td_channel_fresh | default(false) | bool
      block:
        - name: 登记 need_reconfigure=false（通道新鲜）
          ansible.builtin.set_fact:
            need_reconfigure: false
            upload_status_ok: true
            upload_health_via_api: false
        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/check_restart_channel_fresh_callback.yml"
        - name: DEBUG NEWARE 巡检（通道新鲜快路径）
          ansible.builtin.include_tasks: tasks/debug_patrol_snapshot.yml
        - name: 通道新鲜 — 结束本主机
          ansible.builtin.meta: end_host

    # --- 2) 新鲜度不满足：再查 BTSClient 数据上报 API（controller HTTP，不依赖 WinRM）---
    - name: 数据上报状态 API（通道不新鲜时的次级判定）
      ansible.builtin.include_tasks: tasks/neware_query_upload_status_api.yml
      vars:
        neware_api_query_context: patrol

    # API 快路径：ExecResultData 有值 → healthy；WinRM 仅作参考
    - name: 数据上报 API 已健康（跳过 WinRM 深度检查）
      when: api_upload_started | default(false) | bool
      block:
        - name: WinRM 参考探测（仅填写 winrm_status，不改变 API 健康结论）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_probe_reference_only.yml"
          vars:
            winrm_probe_reference_label: "Patrol API 快路径 WinRM 参考"

        - name: 登记 Semaphore 状态回调行（API 健康快路径）
          ansible.builtin.set_fact:
            need_reconfigure: false
            upload_status_ok: true
            upload_health_via_api: true
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: healthy
              winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
              api_status: online
              abnormal_reason: >-
                {{
                  'WinRM unreachable (API upload healthy; TDengine channel not fresh)'
                  if not (_winrm_session_ok | default(false) | bool)
                  else ''
                }}

        - name: DEBUG NEWARE 巡检（API 快路径）
          ansible.builtin.include_tasks: tasks/debug_patrol_snapshot.yml

        - name: API 健康 — 结束本主机
          ansible.builtin.meta: end_host

    # 快速失败：API 不通 / 非 200 / 响应信封无效 → unhealthy
    - name: Patrol API 不可达或非 200 — 快速失败
      when:
        - not (api_upload_started | default(false) | bool)
        - not (api_upload_status_ok | default(false) | bool)
      block:
        - name: 登记 Semaphore 状态回调行（API 快速失败）
          ansible.builtin.set_fact:
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: unhealthy
              winrm_status: offline
              api_status: offline
              abnormal_reason: >-
                {{
                  'API unreachable: ' ~ (api_upload_status_result.msg | default('connection failed') | string)
                  if (api_upload_status_result.status | default(0) | int) in [0, -1]
                  else (
                    'API HTTP ' ~ (api_upload_status_result.status | default(0) | string) ~ ' (expected 200)'
                    if (api_upload_status_result.status | default(0) | int) != 200
                    else 'API response invalid (HTTP 200 but envelope check failed)'
                  )
                }}

        - name: DEBUG NEWARE 巡检（API 快速失败）
          ansible.builtin.include_tasks: tasks/debug_patrol_snapshot.yml

        - name: API 快速失败 — 结束本主机
          ansible.builtin.meta: end_host

    # HTTP 200 且信封有效，但 ExecResultData 无值 → unhealthy（健康判定仅 TDengine + API）
    - name: API 200 但 ExecResultData 无值 — 标记不健康
      when:
        - not (api_upload_started | default(false) | bool)
        - api_upload_status_ok | default(false) | bool
      block:
        - name: WinRM 参考探测（仅填写 winrm_status）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_probe_reference_only.yml"
          vars:
            winrm_probe_reference_label: "Patrol API 无 ExecResultData WinRM 参考"

        - name: 登记 Semaphore 状态回调行（API 无 ExecResultData）
          ansible.builtin.set_fact:
            need_reconfigure: true
            upload_status_ok: false
            upload_health_via_api: false
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: unhealthy
              winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
              api_status: offline
              abnormal_reason: >-
                API ExecResultData missing
                (TDengine channel not fresh: insert_time={{ td_channel_insert_time | default('?') }}, age_h={{ td_channel_age_hours | default('?') }})

        - name: DEBUG NEWARE 巡检（API 无 ExecResultData）
          ansible.builtin.include_tasks: tasks/debug_patrol_snapshot.yml

        - name: API 无 ExecResultData — 结束本主机
          ansible.builtin.meta: end_host

  post_tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record.yml"
      when: semaphore_callback_row is defined

- name: 写回 Semaphore 设备状态（bulk PUT + TDengine，仅此一处）
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/files"
  tasks:
    # strategy: free 下不可在 play1 用 run_once 出总览（会在第一台完成时抢跑）。
    - name: 生成状态报告
      when: groups['windows_hosts'] is defined and (groups['windows_hosts'] | length) > 0
      block:
        - ansible.builtin.include_tasks: tasks/build_device_status_report.yml
          vars:
            status_report_hosts: "{{ groups['windows_hosts'] }}"
            status_report_exe_name: "{{ hostvars[groups['windows_hosts'][0]].exe_name | default('NWReport_DBWB') }}"
        - name: 生成状态报告
          ansible.builtin.debug:
            msg: "{{ _status_report_msg_lines }}"
    - name: 执行 bulk 回调
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_operation_logs.yml"
