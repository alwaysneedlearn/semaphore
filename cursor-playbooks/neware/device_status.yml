---
- name: 生成所有主机程序运行状态总览
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/files"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
    sem_operation_type: status
    sem_debug_tag: NEWARE
    # Variable Group 环境变量（非空）优先，否则使用下列默认值
    _exe_name_default: uu.exe
    _exe_name_env: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) }}"
    _exe_name_base: "{{ (_exe_name_env if (_exe_name_env | length > 0) else _exe_name_default) | regex_replace('(?i)\\.exe$', '') }}"
    exe_name: "{{ _exe_name_base ~ '.exe' }}"
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('D:\\Program Files\\NEWARE', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('test', true) }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_resolve_device_row.yml"

    # --- 必要：BTSClient 数据上报 API（controller HTTP，不依赖 WinRM）---
    - name: 数据上报状态 API（Patrol 首要判定）
      ansible.builtin.include_tasks: tasks/neware_query_upload_status_api.yml
      vars:
        neware_api_query_context: patrol

  # 快路径：ExecResultData==3 → healthy；WinRM/进程/Kafka 仅作参考或跳过
    - name: 数据上报 API 已健康（跳过 WinRM/进程/Kafka 参考检查）
      when: api_upload_started | default(false) | bool
      block:
        - name: WinRM 参考探测（仅填写 winrm_status，不改变 API 健康结论）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_probe_reference_only.yml"
          vars:
            winrm_probe_reference_label: "Patrol API 快路径 WinRM 参考"

        - name: 登记 Semaphore 状态回调行（API 健康快路径）
          ansible.builtin.set_fact:
            need_reconfigure: false
            log_status_ok: true
            upload_health_via_api: true
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: healthy
              winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
              api_status: online
              abnormal_reason: >-
                {{
                  'WinRM unreachable (API upload healthy; reference only)'
                  if not (_winrm_session_ok | default(false) | bool)
                  else ''
                }}

        - name: DEBUG NEWARE 巡检（API 快路径）
          ansible.builtin.include_tasks: tasks/debug_patrol_snapshot.yml

        - name: API 健康 — 结束本主机
          ansible.builtin.meta: end_host

    # 快速失败：API 不通 / 非 200 / 响应信封无效 → unhealthy，不跑 WinRM 参考链
    - name: Patrol API 不可达或非 200 — 快速失败
      when:
        - not (api_upload_started | default(false) | bool)
        - not (api_upload_status_ok | default(false) | bool)
      block:
        - name: 登记 Semaphore 状态回调行（API 快速失败）
          ansible.builtin.set_fact:
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: unhealthy
              winrm_status: offline
              api_status: offline
              abnormal_reason: >-
                {{
                  'API unreachable: ' ~ (api_upload_status_result.msg | default('connection failed') | string)
                  if (api_upload_status_result.status | default(0) | int) in [0, -1]
                  else (
                    'API HTTP ' ~ (api_upload_status_result.status | default(0) | string) ~ ' (expected 200)'
                    if (api_upload_status_result.status | default(0) | int) != 200
                    else 'API response invalid (HTTP 200 but envelope check failed)'
                  )
                }}

        - name: DEBUG NEWARE 巡检（API 快速失败）
          ansible.builtin.include_tasks: tasks/debug_patrol_snapshot.yml

        - name: API 快速失败 — 结束本主机
          ansible.builtin.meta: end_host

    # 参考路径：HTTP 200 且信封有效，但 ExecResultData!=3 → WinRM + 进程 + Kafka TCP
    - name: API 200 但未达上报已启动 — WinRM/进程/Kafka 参考检查
      when:
        - not (api_upload_started | default(false) | bool)
        - api_upload_status_ok | default(false) | bool
      block:
        - name: WinRM 建连（含重试）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"

        - name: WinRM 未连通则不再执行本主机后续步骤
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"

        - name: 一次性部署 Windows 辅助脚本
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"

        - name: 解析 EXE_DIR（参考）
          block:
            - ansible.builtin.include_tasks: tasks/resolve_exe_dir_windows.yml
          ignore_unreachable: true

        - name: 采集进程状态（参考）
          block:
            - ansible.builtin.include_tasks: tasks/collect_process_status_windows.yml
            - ansible.builtin.set_fact:
                status: "{{ _sem_process_status }}"
          ignore_unreachable: true

        - name: 状态判断：输出程序状态
          ansible.builtin.debug:
            msg: "[程序状态] {{ status.stdout | trim }}"
          when: >
            not (status.unreachable | default(false)) and
            status is defined and
            'stdout' in status

        - name: DEBUG NEWARE 巡检（进程）
          ansible.builtin.include_tasks: tasks/debug_patrol_snapshot.yml

        - name: 登记 Semaphore 回调行（WinRM/进程采集不可达）
          ansible.builtin.set_fact:
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: unhealthy
              winrm_status: offline
              api_status: offline
              abnormal_reason: "{{ 'WinRM unreachable: ' ~ (status.msg | default('connection failed') | string) }}"
          when: status.unreachable | default(false)

        - name: 跳过不可达主机
          ansible.builtin.meta: end_host
          when: status.unreachable | default(false)

        - name: 进程未运行时标记异常
          ansible.builtin.set_fact:
            need_reconfigure: true
            log_status_ok: false
            kafka_status_ok: false
            upload_health_via_api: false
          when: >
            status is defined and
            'stdout' in status and
            'NOT_RUNNING' in status.stdout

        - name: Kafka TCP 回退（API 未达 3 且进程在跑）
          when: >
            status is defined and
            'stdout' in status and
            'NOT_RUNNING' not in status.stdout
          block:
            - ansible.builtin.include_tasks: tasks/kafka_health_check_windows.yml
            - ansible.builtin.include_tasks: tasks/health_gate_need_reconfigure_from_kafka.yml
            - ansible.builtin.set_fact:
                upload_health_via_api: false

            - name: 输出综合判断结果（参考路径）
              ansible.builtin.debug:
                msg: >
                  [综合判断] 程序状态={{ status.stdout | trim | regex_search('^[^|]+') }} |
                  api_upload_started={{ api_upload_started | default(false) }} |
                  ExecResultData={{ api_upload_exec_result_data | default('n/a') }} |
                  Kafka_OK={{ kafka_status_ok | default('n/a') }} |
                  异常/需关注={{ need_reconfigure | default('n/a') }} |
                  kafka={{ kafka_check_result.stdout | default('') | trim }}

        - name: 登记 Semaphore 状态回调行（参考路径）
          ansible.builtin.set_fact:
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: >-
                {{ 'unhealthy' if status is not defined or ('stdout' not in status)
                   else ('unhealthy' if 'NOT_RUNNING' in (status.stdout | default(''))
                   else ('unhealthy' if (need_reconfigure is defined and need_reconfigure | bool)
                   else 'healthy')) }}
              winrm_status: >-
                {{ 'offline' if (not (_winrm_session_ok | default(false) | bool))
                or (kafka_check_result is defined and (kafka_check_result.unreachable | default(false)))
                else 'online' }}
              api_status: >-
                {{ 'offline' if status is not defined or ('stdout' not in status)
                   else ('offline' if 'NOT_RUNNING' in (status.stdout | default(''))
                   else ('online' if (need_reconfigure is defined and not (need_reconfigure | bool))
                   else 'offline')) }}
              abnormal_reason: >-
                {% if 'NOT_RUNNING' in (status.stdout | default('')) %}Process not running
                {% elif kafka_check_result is defined and (kafka_check_result.unreachable | default(false)) %}WinRM unreachable during Kafka TCP check
                {% elif need_reconfigure is defined and need_reconfigure | bool %}API ExecResultData!=3 and Kafka TCP not Established
                {% else %}{% endif %}

        - name: DEBUG NEWARE 巡检（结果）
          ansible.builtin.include_tasks: tasks/debug_patrol_snapshot.yml

  post_tasks:
    - name: 生成状态报告
      when: ansible_play_hosts_all is defined and (ansible_play_hosts_all | length) > 0
      run_once: true
      delegate_to: localhost
      block:
        - ansible.builtin.include_tasks: tasks/build_device_status_report.yml
          vars:
            status_report_hosts: "{{ ansible_play_hosts_all }}"
            status_report_exe_name: "{{ hostvars[ansible_play_hosts_all[0]].exe_name | default('NWReport_DBWB') }}"
        - name: 生成状态报告
          ansible.builtin.debug:
            msg: "{{ _status_report_msg_lines }}"

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record.yml"
      when: semaphore_callback_row is defined

- name: 写回 Semaphore 设备状态（bulk PUT + TDengine，仅此一处）
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/files"
  tasks:
    - name: 执行 bulk 回调
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_operation_logs.yml"
