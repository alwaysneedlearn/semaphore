---
- name: SINEXCEL 状态巡检（API + 进程）
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars_files:
    - vars/api_port.yml
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/files"
    sem_debug_tag: SINEXCEL
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('C:\\Program Files\\SINEXCEL', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    _exe_name_default: sinexcel_agent.exe
    _exe_name_env: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) }}"
    _exe_name_base: "{{ (_exe_name_env if (_exe_name_env | length > 0) else _exe_name_default) | regex_replace('(?i)\\.exe$', '') }}"
    exe_name: "{{ _exe_name_base ~ '.exe' }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('sinexcel', true) }}"
    _app_dir_env: "{{ (lookup('env', 'APP_DIR') | default('', true) | trim) }}"
    app_dir: "{{ _app_dir_env if (_app_dir_env | length > 0) else zip_name }}"
    exe_dir_fallback_drives: "{{ (lookup('env', 'EXE_DIR_FALLBACK_DRIVES') | default('', true) | trim) | default('D,E,C', true) }}"
    exe_scan_latest: "{{ ((lookup('env', 'EXE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool }}"
    exe_scan_max_depth: "{{ ((lookup('env', 'EXE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('2', true)) | int }}"
    exe_path: "{{ exe_dir ~ '\\' ~ exe_name if app_dir in ['.', ''] else exe_dir ~ '\\' ~ app_dir ~ '\\' ~ exe_name }}"
    process_name: "{{ ((lookup('env', 'PROCESS_NAME') | default('', true) | trim) | regex_replace('(?i)\\.exe$', '')) | default(_exe_name_base, true) }}"
    sinexcel_start_check_api: true
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - name: WinRM 建连（含重试）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"
    - name: WinRM 未连通则不再执行本主机后续步骤
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"
    - name: 部署 Windows 启动辅助脚本
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"
    - name: 解析每设备安装路径
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/prepare_device_exe_paths.yml"
    - name: 解析 EXE_DIR（盘符回退）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/resolve_exe_dir_windows.yml"
    - name: 解析当前设备信息
      ansible.builtin.set_fact:
        _sinexcel_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({}) }}"
        _sinexcel_target_host: "{{ ((_semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({})).ip | default(inventory_hostname, true)) }}"

    - name: 检查 SINEXCEL 程序文件是否存在
      ansible.windows.win_stat:
        path: "{{ exe_path }}"
      register: _sinexcel_exe_stat
      ignore_unreachable: true

    - name: 检查 SINEXCEL 进程状态
      ansible.windows.win_shell: |
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $p) {
          $wsMb = [math]::Round($p.WorkingSet64 / 1MB, 1)
          "RUNNING|pid=$($p.Id)|ws=${wsMb}MB|path=$($p.Path)"
        } else {
          "NOT_RUNNING"
        }
      register: _sinexcel_process_check
      changed_when: false
      ignore_unreachable: true

    - name: 查询 SINEXCEL Kafka 配置（健康判定）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/sinexcel_kafka_query_config.yml"
      vars:
        sinexcel_kafka_register_api_after: false

    - name: 状态判断并组装回调行
      ansible.builtin.set_fact:
        need_reconfigure: "{{ _sinexcel_need_reconfig | bool }}"
        semaphore_callback_row:
          hostname: "{{ _sinexcel_dev.hostname | default('', true) }}"
          ip: "{{ _sinexcel_dev.ip | default(inventory_hostname, true) }}"
          device_status: "{{ 'healthy' if not (_sinexcel_need_reconfig | bool) else 'unhealthy' }}"
          winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
          api_status: "{{ 'online' if not (_sinexcel_need_reconfig | bool) else 'offline' }}"
          abnormal_reason: "{{ _sinexcel_abnormal_reason | trim }}"
      vars:
        _sinexcel_proc_out: "{{ _sinexcel_process_check.stdout | default('') | trim }}"
        _sinexcel_proc_running: "{{ (_sinexcel_proc_out.split('|') | first) == 'RUNNING' }}"
        _sinexcel_need_reconfig: >-
          {{
            (not (_sinexcel_exe_stat.stat.exists | default(false)))
            or (not (_sinexcel_proc_running | bool))
            or (not (_sinexcel_kafka_api_ok | default(false) | bool))
          }}
        _sinexcel_abnormal_reason: >-
          {% if not (_sinexcel_exe_stat.stat.exists | default(false)) %}Executable not found: {{ exe_path }}
          {% elif not (_sinexcel_proc_running | bool) %}Process not running: {{ process_name }} ({{ _sinexcel_proc_out }})
          {% elif not (_sinexcel_kafka_api_ok | default(false) | bool) %}Kafka not enabled: EnableFlowInfoExtendedSqlite!=true result={{ _sinexcel_kafka_result_text | default('n/a') }}
          {% else %}{% endif %}

    - name: DEBUG SINEXCEL 巡检结果
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/debug_sync_api_patrol_snapshot.yml"

- name: 写回 Semaphore 设备状态（bulk PUT + TDengine，仅此一处）
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/files"
  tasks:
    - name: 执行 bulk 回调
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"