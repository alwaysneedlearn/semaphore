---
# Patch program_dir\config INI/JSON files after redeploy extract (before start).
# Variable Group: SINEXCEL_CONFIG_FILES=file1.ini,file2.ini
# Semaphore device config categories: ConfigFile1, ConfigFile2 (flat key=value maps).
# INI section keys use dotted form: Section.Key=value

- name: 准备 SINEXCEL 配置分类（磁盘改配）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_prepare_merged_cfg.yml"

- name: 解析重新部署配置文件列表
  ansible.builtin.set_fact:
    _sinexcel_config_file_names: >-
      {{
        (
          (lookup('env', 'SINEXCEL_CONFIG_FILES') | default('', true) | trim)
          | split(',')
          | map('trim')
          | reject('equalto', '')
          | list
        )
      }}
    _sinexcel_config_patch_1: "{{ merged_cfg.ConfigFile1 | default({}) }}"
    _sinexcel_config_patch_2: "{{ merged_cfg.ConfigFile2 | default({}) }}"

- name: 重新部署：无配置文件名则跳过磁盘改配
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] config_files=skipped (set SINEXCEL_CONFIG_FILES in Variable Group, e.g. foo.ini,bar.ini)"
      - "[DEBUG-SINEXCEL] config_dir={{ _sinexcel_program_dir | default('') }}\\{{ sinexcel_config_rel_dir | default('config', true) }}"
  when: (_sinexcel_config_file_names | default([]) | length) == 0

- name: 重新部署：写入 config 目录配置文件
  environment:
    SINEXCEL_PROGRAM_DIR: "{{ _sinexcel_program_dir }}"
    SINEXCEL_CONFIG_REL_DIR: "{{ sinexcel_config_rel_dir | default('config', true) }}"
    SINEXCEL_CONFIG_FILE_NAME: "{{ item.file }}"
    SINEXCEL_CONFIG_PATCH_JSON: "{{ item.patch | to_json }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_sinexcel_patch_config_file.ps1
  args:
    chdir: C:\Windows\Temp
  register: _sinexcel_config_patch_results
  loop: >-
    {{
      [
        {
          'file': (_sinexcel_config_file_names | first),
          'patch': _sinexcel_config_patch_1
        }
      ]
      + (
        [{
          'file': (_sinexcel_config_file_names | list)[1],
          'patch': _sinexcel_config_patch_2
        }] if ((_sinexcel_config_file_names | default([]) | length) > 1) else []
      )
    }}
  loop_control:
    label: "{{ item.file }}"
  when: (_sinexcel_config_file_names | default([]) | length) > 0
  failed_when: false

- name: 重新部署：配置文件改配失败
  ansible.builtin.fail:
    msg: >-
      SINEXCEL config file patch failed on {{ inventory_hostname }}.
      results={{ (_sinexcel_config_patch_results.results | default([]) | map(attribute='stdout') | list) }}
  when:
    - _sinexcel_config_patch_results is defined
    - not (_sinexcel_config_patch_results.skipped | default(false))
    - >-
      (_sinexcel_config_patch_results.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) > 0
      or ('CFG_ERROR' in ((_sinexcel_config_patch_results.results | default([]) | map(attribute='stdout') | join(' '))))

- name: DEBUG SINEXCEL config 文件改配
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] config_files={{ _sinexcel_config_file_names | default([]) }}"
      - "[DEBUG-SINEXCEL] config_patch_stdout={{ (_sinexcel_config_patch_results.results | default([]) | map(attribute='stdout') | list) }}"
  when: _sinexcel_config_patch_results is defined
