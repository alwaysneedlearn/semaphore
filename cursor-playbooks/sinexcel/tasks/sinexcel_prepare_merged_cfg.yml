---
# Split merged_cfg for SINEXCEL Kafka playbooks.
# SetConfig uses **KafkaConfig only** (no SystemConfig fallback — avoids stray keys like IsHisDataFromFirst).
# Retransmit -> QueryHistory + /kafka/Retransmit.

- name: 拆分 SINEXCEL 配置分类
  ansible.builtin.set_fact:
    sinexcel_kafka_cfg_flat: "{{ merged_cfg.KafkaConfig | default({}) }}"
    sinexcel_retransmit_cfg: "{{ merged_cfg.Retransmit | default({}) }}"

- name: DEBUG SINEXCEL 合并配置来源（SetConfig / Retransmit）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] merged_cfg_categories={{ merged_cfg.keys() | list }}"
      - "[DEBUG-SINEXCEL] kafka_setconfig_keys={{ sinexcel_kafka_cfg_flat | dict2items | map(attribute='key') | list }}"
      - "[DEBUG-SINEXCEL] kafka_setconfig_source=KafkaConfig-only (SystemConfig ignored for SetConfig)"
      - "[DEBUG-SINEXCEL] retransmit_keys={{ sinexcel_retransmit_cfg | dict2items | map(attribute='key') | list }}"
      - "[DEBUG-SINEXCEL] hint=keys come from Semaphore default_config + device config (category KafkaConfig)"
