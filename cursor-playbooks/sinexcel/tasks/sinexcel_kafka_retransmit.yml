---
# QueryHistory by time range, then batch POST /kafka/Retransmit with FlowId list.

- name: 准备 SINEXCEL 配置分类
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_prepare_merged_cfg.yml"
  when: sinexcel_retransmit_cfg is not defined

- name: 解析并校验 Retransmit 时间
  ansible.builtin.set_fact:
    _sinexcel_retransmit_start: "{{ _rtx_start }}"
    _sinexcel_retransmit_end: "{{ _rtx_end }}"
    _sinexcel_retransmit_time_ok: "{{ (_rtx_start | length) > 0 and (_rtx_end | length) > 0 }}"
  vars:
    _rtx_start: "{{ sinexcel_retransmit_cfg.StartTime | default(sinexcel_retransmit_cfg.startTime | default('')) | trim }}"
    _rtx_end: "{{ sinexcel_retransmit_cfg.EndTime | default(sinexcel_retransmit_cfg.endTime | default('')) | trim }}"

- name: 查询历史数据（Kafka QueryHistory）
  ansible.builtin.uri:
    url: >-
      {{ sinexcel_kafka_api_scheme }}://{{ _sinexcel_kafka_target_host }}:{{ sinexcel_kafka_api_port }}{{ sinexcel_kafka_query_history_path }}
    method: POST
    body_format: json
    body:
      StartTime: "{{ _sinexcel_retransmit_start }}"
      EndTime: "{{ _sinexcel_retransmit_end }}"
    timeout: "{{ sinexcel_api_timeout | default(30) | int }}"
    validate_certs: "{{ sinexcel_kafka_verify_tls | default(false) | bool }}"
    return_content: true
    status_code: [200, 201, 204, 400, 401, 403, 404, 409, 422, 500, 502, 503]
  register: _sinexcel_kafka_history_raw
  delegate_to: localhost
  failed_when: false
  when: _sinexcel_retransmit_time_ok | bool
  vars:
    _sinexcel_kafka_target_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"

- name: 解析 QueryHistory 并组装 Retransmit 请求体
  ansible.builtin.set_fact:
    _sinexcel_kafka_history_rows: "{{ _history_rows }}"
    _sinexcel_retransmit_flow_items: "{{ _history_rows }}"
    _sinexcel_retransmit_body: "{{ _history_rows | json_query('[].{FlowId: FlowId}') | default([]) }}"
  vars:
    _history_envelope: >-
      {{
        (_sinexcel_kafka_history_raw.content | from_json)
        if (_sinexcel_kafka_history_raw is defined)
          and not (_sinexcel_kafka_history_raw.skipped | default(false))
          and ((_sinexcel_kafka_history_raw.status | default(0) | int) == 200)
          and ((_sinexcel_kafka_history_raw.content | default('') | trim) | length) > 0
        else {}
      }}
    _history_rows: >-
      {{
        (_history_envelope.Msg | default('[]') | from_json)
        if ((_history_envelope.Msg | default('') | trim) | length) > 0
        else []
      }}
  when: _sinexcel_retransmit_time_ok | bool

- name: 批量重传历史数据（Kafka Retransmit）
  ansible.builtin.uri:
    url: >-
      {{ sinexcel_kafka_api_scheme }}://{{ _sinexcel_kafka_target_host }}:{{ sinexcel_kafka_api_port }}{{ sinexcel_kafka_retransmit_path }}
    method: POST
    body_format: json
    body: "{{ _sinexcel_retransmit_body }}"
    timeout: "{{ sinexcel_api_timeout | default(30) | int }}"
    validate_certs: "{{ sinexcel_kafka_verify_tls | default(false) | bool }}"
    return_content: true
    status_code: [200, 201, 204, 400, 401, 403, 404, 409, 422, 500, 502, 503]
  register: _sinexcel_kafka_retransmit_raw
  delegate_to: localhost
  failed_when: false
  when:
    - _sinexcel_retransmit_body is defined
    - (_sinexcel_retransmit_body | length) > 0
  vars:
    _sinexcel_kafka_target_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"

- name: DEBUG SINEXCEL Retransmit 全流程
  ansible.builtin.debug:
    msg: "{{ _rtx_debug_lines }}"
  vars:
    _sinexcel_kafka_target_host: "{{ _agent_target_host | default(_sinexcel_target_host | default(inventory_hostname, true), true) }}"
    _rtx_debug_lines: >-
      {{
        (
          [
            '[DEBUG-SINEXCEL] retransmit skipped=empty_time',
            '[DEBUG-SINEXCEL] retransmit StartTime=' ~ (_sinexcel_retransmit_start | default('')),
            '[DEBUG-SINEXCEL] retransmit EndTime=' ~ (_sinexcel_retransmit_end | default(''))
          ] if not (_sinexcel_retransmit_time_ok | default(false) | bool) else []
        )
        + (
          [
            '[DEBUG-SINEXCEL] QueryHistory url=' ~ (sinexcel_kafka_api_scheme | default('http')) ~ '://' ~ _sinexcel_kafka_target_host
              ~ ':' ~ (sinexcel_kafka_api_port | string) ~ (sinexcel_kafka_query_history_path | default('')),
            '[DEBUG-SINEXCEL] QueryHistory request=' ~ ({'StartTime': _sinexcel_retransmit_start, 'EndTime': _sinexcel_retransmit_end} | to_json),
            '[DEBUG-SINEXCEL] QueryHistory http=' ~ (_sinexcel_kafka_history_raw.status | default('n/a') | string),
            '[DEBUG-SINEXCEL] QueryHistory response=' ~ (_sinexcel_kafka_history_raw.content | default('') | truncate(3000, True))
          ] if (_sinexcel_retransmit_time_ok | default(false) | bool) and (_sinexcel_kafka_history_raw is defined) else []
        )
        + (
          [
            '[DEBUG-SINEXCEL] retransmit skipped=no_flow_ids',
            '[DEBUG-SINEXCEL] history_rows=' ~ (_sinexcel_kafka_history_rows | default([]) | length | string)
          ] if (_sinexcel_retransmit_time_ok | default(false) | bool) and ((_sinexcel_retransmit_body | default([]) | length) == 0) else []
        )
        + (
          [
            '[DEBUG-SINEXCEL] Retransmit url=' ~ (sinexcel_kafka_api_scheme | default('http')) ~ '://' ~ _sinexcel_kafka_target_host
              ~ ':' ~ (sinexcel_kafka_api_port | string) ~ (sinexcel_kafka_retransmit_path | default('')),
            '[DEBUG-SINEXCEL] Retransmit request=' ~ (_sinexcel_retransmit_body | to_json),
            '[DEBUG-SINEXCEL] Retransmit http=' ~ (_sinexcel_kafka_retransmit_raw.status | default('skipped') | string),
            '[DEBUG-SINEXCEL] Retransmit response=' ~ (_sinexcel_kafka_retransmit_raw.content | default('') | truncate(3000, True)),
            '[DEBUG-SINEXCEL] Retransmit flow_count=' ~ (_sinexcel_retransmit_body | default([]) | length | string)
          ] if (_sinexcel_kafka_retransmit_raw is defined) and not (_sinexcel_kafka_retransmit_raw.skipped | default(false)) else []
        )
      }}

- name: 判定 QueryHistory 是否成功
  ansible.builtin.set_fact:
    sinexcel_query_history_ok: "{{ _qh_ok | bool }}"
  vars:
    _qh_ok: >-
      {{
        (_sinexcel_kafka_history_raw is defined)
        and not (_sinexcel_kafka_history_raw.skipped | default(false))
        and ((_sinexcel_kafka_history_raw.status | default(0) | int) == 200)
        and (
          '成功' in (
            (
              (_sinexcel_kafka_history_raw.content | default('{}') | from_json).Result | default('')
            ) | string
          )
        )
      }}

- name: 判定 Retransmit 是否成功（查询成功但无历史视为成功）
  ansible.builtin.set_fact:
    sinexcel_retransmit_ok: "{{ _rtx_ok | bool }}"
  vars:
    _rtx_ok: >-
      {{
        (sinexcel_query_history_ok | default(false) | bool)
        and (
          ((_sinexcel_kafka_history_rows | default([]) | length) == 0)
          or (
            (_sinexcel_kafka_retransmit_raw is defined)
            and not (_sinexcel_kafka_retransmit_raw.skipped | default(false))
            and ((_sinexcel_kafka_retransmit_raw.status | default(0) | int) == 200)
          )
        )
      }}

- name: DEBUG SINEXCEL Retransmit 判定结果
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] query_history_ok={{ sinexcel_query_history_ok | default(false) | bool }}"
      - "[DEBUG-SINEXCEL] retransmit_ok={{ sinexcel_retransmit_ok | default(false) | bool }}"
      - "[DEBUG-SINEXCEL] history_rows={{ _sinexcel_kafka_history_rows | default([]) | length }}"
