---
# SINEXCEL: Kafka SetConfig/IsEnable (while running) → graceful stop → start (+ start popup) → QueryConfig → retry → Retransmit.
# 不写 INI；配置仅经 HTTP API（KafkaConfig / SetConfig）。Play vars: merged_cfg, process_name, sinexcel_kafka_*.
# Revision marker (logs): SINEXCEL_CONFIG_STOP_START_REV=6 — graceful stop only (no force kill).

- name: "DEBUG SINEXCEL 启停流程版本（无 INI 重配）"
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] SINEXCEL_CONFIG_STOP_START_REV=6"
      - "[DEBUG-SINEXCEL] ini_reconfig=disabled (HTTP API only; no apply_neware_style_device_config_files)"
      - "[DEBUG-SINEXCEL] stop_mode=graceful_only (stop_force_after_graceful=false, no force fallback)"

- name: 准备 SINEXCEL 配置分类
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_prepare_merged_cfg.yml"

- name: 重启前检查进程
  ansible.windows.win_shell: |
    $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
  register: _sinexcel_process_before_restart
  changed_when: false

- ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_set_process_running_before_stop.yml"

- name: 进程运行中：Kafka SetConfig（停止前）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_kafka_set_config_before_stop.yml"

- name: 进程运行中：开启 Kafka 上传（停止前）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_kafka_enable.yml"
  vars:
    sinexcel_kafka_enable_phase: before_stop
  when: _sinexcel_process_running_before_stop | default(false) | bool

- name: 优雅停止（重启前）
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/stop_program_graceful_before_reconfig.yml"

- name: 获取当前登录用户
  ansible.windows.win_shell: |
    $explorerUser = Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
      ForEach-Object {
        $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($o -and $o.ReturnValue -eq 0 -and $o.User) { $o.User.Trim() }
      } |
      Where-Object { $_ } |
      Select-Object -First 1
    if ($explorerUser) { Write-Output $explorerUser } else { Write-Output "{{ hostvars[inventory_hostname].ansible_user | default('Administrator') }}" }
  register: get_username_result
  changed_when: false

- name: 规范化启动用户
  ansible.builtin.set_fact:
    _reconfig_profile_user: "{{ (get_username_result.stdout_lines | default([]) | last | default(get_username_result.stdout | default(''))) | trim }}"

- name: 更新桌面快捷方式（管理员启动）
  block:
    - ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/update_desktop_shortcut_windows.yml"
  ignore_unreachable: true

- name: 启动程序
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/reconfig_start_program_windows.yml"

- name: 启动后确认进程状态
  ansible.windows.win_shell: |
    Start-Sleep -Seconds 3
    $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
  register: _ini_agent_process_after
  changed_when: false
  when: not (start_aborted_exe_missing | default(false) | bool)

- ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_set_process_running_after_start.yml"
  when: not (start_aborted_exe_missing | default(false) | bool)

- name: 启动后查询 Kafka 配置（健康判定，轮询）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_kafka_query_config_start_poll.yml"
  when:
    - not (start_aborted_exe_missing | default(false) | bool)
    - sinexcel_start_check_api | default(true) | bool

- name: 启动后：Kafka SetConfig 重试
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_kafka_set_config_after_start_retry.yml"
  when: not (start_aborted_exe_missing | default(false) | bool)

- name: 启动后：开启 Kafka 上传
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_kafka_enable.yml"
  vars:
    sinexcel_kafka_enable_phase: after_start
  when: >-
    not (start_aborted_exe_missing | default(false) | bool)
    and (_sinexcel_process_running_after_start | default(false) | bool)
    and not (_sinexcel_kafka_enabled | default(false) | bool)

- name: 启动后再次查询 Kafka 配置（IsEnable 后，轮询）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_kafka_query_config_start_poll.yml"
  when: >-
    not (start_aborted_exe_missing | default(false) | bool)
    and sinexcel_start_check_api | default(true) | bool
    and (_sinexcel_kafka_enable_raw is defined)
    and not (_sinexcel_kafka_enable_raw.skipped | default(true))

- name: 历史数据重传（Kafka Retransmit，restart 专用）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_kafka_retransmit.yml"
  when: >-
    not (start_aborted_exe_missing | default(false) | bool)
    and (sinexcel_include_retransmit | default(false) | bool)
    and (sinexcel_retransmit_cfg | default(merged_cfg.Retransmit | default({})) | length) > 0
    and (_sinexcel_process_running_after_start | default(false) | bool)
    and (_sinexcel_kafka_enabled | default(false) | bool)
