---
# SINEXCEL restart：登录用户桌面快捷方式勾选「用管理员身份运行」。
# 依赖：_reconfig_profile_user（explorer GetOwner）。
# 已有 .lnk → 只改 0x15 管理员标志（可重复执行，幂等）；不存在则按 exe_path 新建。
# ENV：SHORTCUT_NAME（默认 BTS - 快捷方式.lnk）、SHORTCUT_DESKTOP（可选）。

- name: 登记 SINEXCEL 快捷方式用户与名称
  ansible.builtin.set_fact:
    _sinexcel_shortcut_profile_user: "{{ _reconfig_profile_user | default('', true) | trim }}"
    _sinexcel_shortcut_name_env: "{{ lookup('env', 'SHORTCUT_NAME') | default('', true) | trim }}"
    _sinexcel_shortcut_desktop_env: "{{ lookup('env', 'SHORTCUT_DESKTOP') | default('', true) | trim }}"

- name: 登记 SINEXCEL 快捷方式最终名称
  ansible.builtin.set_fact:
    _sinexcel_shortcut_name: "{{ _sinexcel_shortcut_name_env if ((_sinexcel_shortcut_name_env | length) > 0) else 'BTS - 快捷方式.lnk' }}"

- name: 更新桌面快捷方式（管理员启动）
  environment:
    SEMAPHORE_SHORTCUT_EXE_PATH: "{{ exe_path }}"
    SEMAPHORE_SHORTCUT_PROFILE_USER: "{{ _sinexcel_shortcut_profile_user }}"
    SEMAPHORE_SHORTCUT_DESKTOP: "{{ _sinexcel_shortcut_desktop_env }}"
    SEMAPHORE_SHORTCUT_NAME: "{{ _sinexcel_shortcut_name }}"
    SEMAPHORE_EXE_ARGS: "{{ exe_args | default('', true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_update_desktop_shortcut_windows.ps1
  args:
    chdir: C:\Windows\Temp
  register: _sinexcel_desktop_shortcut
  changed_when: >-
    _sinexcel_desktop_shortcut is defined and
    'SHORTCUT_OK' in (_sinexcel_desktop_shortcut.stdout | default(''))
  failed_when: false
  when: (_sinexcel_shortcut_profile_user | default('') | length) > 0

- name: DEBUG SINEXCEL 桌面快捷方式
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] shortcut user={{ _sinexcel_shortcut_profile_user | default('n/a') }} name={{ _sinexcel_shortcut_name | default('n/a') }}"
      - "[DEBUG-SINEXCEL] shortcut exe_path={{ exe_path | default('n/a') }}"
      - "[DEBUG-SINEXCEL] shortcut {{ (_sinexcel_desktop_shortcut.stdout | default('n/a')) | trim }}"
      - "[DEBUG-SINEXCEL] shortcut rc={{ _sinexcel_desktop_shortcut.rc | default('n/a') }}"
  when: _sinexcel_desktop_shortcut is defined
