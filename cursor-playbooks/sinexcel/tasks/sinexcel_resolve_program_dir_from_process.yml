---
# Resolve program directory from running process (Win32_Process.ExecutablePath).
# Falls back to play facts exe_path / exe_dir when process is not running.
# Sets: _sinexcel_program_dir, _sinexcel_program_parent, exe_path, exe_dir,
#       redeploy_zip_dest, redeploy_extract_dest, _sinexcel_program_dir_source

- name: 重新部署：从运行进程解析程序目录
  ansible.windows.win_shell: |
    $procName = "{{ process_name }}"
    $procName = $procName -replace '(?i)\.exe$', ''
    $filters = @(
      "Name='$procName.exe'",
      "Name='$procName'"
    )
    $exePath = ''
    foreach ($flt in $filters) {
      $p = Get-CimInstance Win32_Process -Filter $flt -ErrorAction SilentlyContinue | Select-Object -First 1
      if ($null -eq $p) { continue }
      $candidate = [string]$p.ExecutablePath
      $candidate = $candidate.Trim()
      if ($candidate.Length -gt 0 -and (Test-Path -LiteralPath $candidate)) {
        $exePath = $candidate
        break
      }
    }
    if ($exePath.Length -eq 0) {
      Write-Output 'NOT_FOUND|'
      exit 0
    }
    $progDir = Split-Path -LiteralPath $exePath -Parent
    $parentDir = Split-Path -LiteralPath $progDir -Parent
    if ([string]::IsNullOrWhiteSpace($parentDir)) { $parentDir = $progDir }
    Write-Output ("FOUND|" + $exePath + "|" + $progDir + "|" + $parentDir)
  register: _sinexcel_process_path_probe
  changed_when: false

- name: 重新部署：登记进程解析结果
  ansible.builtin.set_fact:
    _sinexcel_program_dir_source: >-
      {{
        'process'
        if ((_sinexcel_process_path_probe.stdout | default('') | trim).split('|') | first) == 'FOUND'
        else 'scan'
      }}
    _sinexcel_program_dir: >-
      {{
        ((_sinexcel_process_path_probe.stdout | default('') | trim).split('|') | list)[2]
        if ((_sinexcel_process_path_probe.stdout | default('') | trim).split('|') | first) == 'FOUND'
        else (
          (exe_path | regex_replace('\\\\[^\\\\]+$', ''))
          if ((exe_path | default('') | trim | length) > 0)
          else (
            (exe_dir ~ '\\' ~ app_dir)
            if (app_dir | default('') | trim | length > 0 and app_dir not in ['.', ''])
            else exe_dir
          )
        )
      }}
    exe_path: >-
      {{
        ((_sinexcel_process_path_probe.stdout | default('') | trim).split('|') | list)[1]
        if ((_sinexcel_process_path_probe.stdout | default('') | trim).split('|') | first) == 'FOUND'
        else exe_path
      }}

- name: 重新部署：解析程序上级目录
  ansible.builtin.set_fact:
    _sinexcel_program_parent: >-
      {{
        ((_sinexcel_process_path_probe.stdout | default('') | trim).split('|') | list)[3]
        if ((_sinexcel_process_path_probe.stdout | default('') | trim).split('|') | first) == 'FOUND'
        else (
          (_sinexcel_program_dir | regex_replace('\\\\[^\\\\]+$', ''))
          if ((_sinexcel_program_dir | default('') | trim | length) > 0)
          else exe_dir
        )
      }}

- name: 重新部署：规范化程序目录与 zip 路径
  ansible.builtin.set_fact:
    exe_dir: "{{ _sinexcel_program_dir }}"
    redeploy_zip_dest: "{{ _sinexcel_program_parent }}\\{{ zip_name }}.zip"
    redeploy_extract_dest: "{{ _sinexcel_program_parent }}"

- name: DEBUG SINEXCEL 程序目录解析
  ansible.builtin.debug:
    msg:
      - "[DEBUG-SINEXCEL] program_dir_source={{ _sinexcel_program_dir_source | default('n/a') }}"
      - "[DEBUG-SINEXCEL] program_dir={{ _sinexcel_program_dir | default('n/a') }}"
      - "[DEBUG-SINEXCEL] program_parent={{ _sinexcel_program_parent | default('n/a') }}"
      - "[DEBUG-SINEXCEL] exe_path={{ exe_path | default('n/a') }}"
      - "[DEBUG-SINEXCEL] redeploy_zip_dest={{ redeploy_zip_dest | default('n/a') }}"
      - "[DEBUG-SINEXCEL] redeploy_extract_dest={{ redeploy_extract_dest | default('n/a') }}"
