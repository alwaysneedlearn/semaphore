---
- name: SINEXCEL 强制重启程序
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/../shared/files"
    exe_dir: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('C:\\Program Files\\SINEXCEL', true) }}"
    exe_name: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) | default('sinexcel_agent.exe', true) }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('sinexcel', true) }}"
    exe_path: "{{ exe_dir }}\\{{ zip_name }}\\{{ exe_name }}"
    zip_path: "{{ (lookup('env', 'ZIP_PATH') | default('', true) | trim) | default('/root/sinexcel/pkg', true) }}"
    exe_args: "{{ (lookup('env', 'EXE_ARGS') | default('', true) | trim) | default('', true) }}"
    restart_delay: "{{ ((lookup('env', 'RESTART_DELAY') | default('', true) | trim) | default('30', true)) | int }}"
    process_verify_poll_seconds: "{{ ((lookup('env', 'PROCESS_VERIFY_POLL_SECONDS') | default('', true) | trim) | default('5', true)) | int }}"
    process_name: "{{ (lookup('env', 'PROCESS_NAME') | default('', true) | trim) | default((exe_name | regex_replace('\\.exe$', '')), true) }}"
    sinexcel_api_scheme: "{{ (lookup('env', 'SINEXCEL_API_SCHEME') | default('', true) | trim) | default('http', true) }}"
    sinexcel_api_port: "{{ ((lookup('env', 'SINEXCEL_API_PORT') | default('', true) | trim) | default('8080', true)) | int }}"
    sinexcel_api_status_path: "{{ (lookup('env', 'SINEXCEL_API_STATUS_PATH') | default('', true) | trim) | default('/SyncLims/QueryStatus', true) }}"
    sinexcel_api_timeout: "{{ ((lookup('env', 'SINEXCEL_API_TIMEOUT') | default('', true) | trim) | default('8', true)) | int }}"
    sinexcel_api_token: "{{ (lookup('env', 'SINEXCEL_API_TOKEN') | default('', true) | trim) | default('sinexcelapi', true) }}"
    sinexcel_api_verify_tls: "{{ ((lookup('env', 'SINEXCEL_API_VERIFY_TLS') | default('', true) | trim) | default('true', true)) | bool }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"
    sem_profile_tasks_dir: "{{ playbook_dir }}/../neware/tasks"
    config_file_name: "{{ (lookup('env', 'CONFIG_FILE_NAME') | default('', true) | trim) | default('sinexcel.iconf', true) }}"
    api_host: "{{ inventory_hostname }}"
    api_port: "{% set hp = hostvars[inventory_hostname].api_port | default(0) %}{% if (hp | int) > 0 %}{{ hp | int }}{% else %}{{ (lookup('env', 'API_PORT') | default('', true) | trim) | default('8080', true) | int }}{% endif %}"
    his_data_from_time: "{{ (lookup('env', 'HIS_DATA_FROM_TIME') | default('', true) | trim) | default('', true) }}"
    default_cfg: "{{ default_config | default({}) }}"
    device_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"
    merged_cfg: "{{ default_cfg | combine(device_cfg, recursive=True) }}"
    merged_system_config: "{{ (default_cfg.SystemConfig | default({})) | combine(device_cfg.SystemConfig | default({}), recursive=True) }}"
    merged_cfg_json: "{{ merged_cfg | to_json }}"

  tasks:
    - name: WinRM 建连（含重试）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"
    - name: WinRM 未连通则不再执行本主机后续步骤
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"
    - name: 部署 Windows 启动辅助脚本
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"

    - name: 写入设备配置（INI 文件，NEWARE 方式）
      ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/apply_neware_style_device_config_files.yml"
      when: >
        (merged_cfg | default({}) | length > 0) or
        ((lookup('env', 'CONFIG_FILE_NAME') | default('', true) | trim) | length > 0)
    - name: 解析当前设备信息
      ansible.builtin.set_fact:
        _sinexcel_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({}) }}"
        _sinexcel_target_host: "{{ ((_semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({})).ip | default(inventory_hostname, true)) }}"

    - name: 检查 SINEXCEL 程序文件是否存在
      ansible.windows.win_stat:
        path: "{{ exe_path }}"
      register: _sinexcel_exe_stat

    - name: 检查本地压缩包是否存在
      ansible.windows.win_shell: |
        if (Test-Path "{{ exe_dir }}\\{{ zip_name }}.zip") { "ZIP_FOUND" } else { "ZIP_NOT_FOUND" }
      register: zip_local_check_result
      changed_when: false
      when: not (_sinexcel_exe_stat.stat.exists | default(false))

    - name: 创建程序根目录
      ansible.builtin.win_file:
        path: "{{ exe_dir }}"
        state: directory
      when: not (_sinexcel_exe_stat.stat.exists | default(false))

    - name: 从服务器复制安装包
      ansible.builtin.win_copy:
        src: "{{ zip_path }}/{{ zip_name }}.zip"
        dest: "{{ exe_dir }}\\{{ zip_name }}.zip"
      register: zip_copy_result
      when: >
        not (_sinexcel_exe_stat.stat.exists | default(false)) and
        (zip_local_check_result is skipped or 'ZIP_NOT_FOUND' in (zip_local_check_result.stdout | default('')))


    - name: 解压程序包
      ansible.windows.win_shell: |
        $zipPath = "{{ exe_dir }}\\{{ zip_name }}.zip"
        $destDir = "{{ exe_dir }}"
        try {
          Expand-Archive -Path $zipPath -DestinationPath $destDir -Force
          "EXTRACT_OK"
        } catch {
          "EXTRACT_ERROR:$($_.Exception.Message)"
        }
      register: extract_result
      failed_when: >
        extract_result is defined and 'stdout' in extract_result and
        'EXTRACT_ERROR' in extract_result.stdout
      when: not (_sinexcel_exe_stat.stat.exists | default(false))

    - name: 重新检查 SINEXCEL 程序文件是否存在
      ansible.windows.win_stat:
        path: "{{ exe_path }}"
      register: _sinexcel_exe_stat_after_extract

    - name: 强制停止 SINEXCEL 进程
      ansible.windows.win_shell: |
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue
        if ($null -ne $p) { $p | Stop-Process -Force -ErrorAction SilentlyContinue; "STOPPED" } else { "ALREADY_STOPPED" }
      register: _sinexcel_stop_result
      changed_when: "'STOPPED' in (_sinexcel_stop_result.stdout | default(''))"
      when: (_sinexcel_exe_stat.stat.exists | default(false)) or (_sinexcel_exe_stat_after_extract.stat.exists | default(false))

    - name: 获取当前登录用户（用于交互式计划任务）
      ansible.windows.win_shell: |
        $explorerUser = Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
          ForEach-Object {
            $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
            if ($o -and $o.ReturnValue -eq 0 -and $o.User) { $o.User.Trim() }
          } |
          Where-Object { $_ } |
          Select-Object -First 1
        if ($explorerUser) {
          Write-Output $explorerUser
        } else {
          Write-Output "{{ hostvars[inventory_hostname].ansible_user | default('Administrator') }}"
        }
      register: get_username_result
      changed_when: false

    - name: 规范化启动用户
      ansible.builtin.set_fact:
        _reconfig_profile_user: "{{ (get_username_result.stdout_lines | default([]) | last | default(get_username_result.stdout | default(''))) | trim }}"

    - name: 启动 SINEXCEL 程序（管理员交互式计划任务）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/reconfig_start_program_windows.yml"
      when: (_sinexcel_exe_stat.stat.exists | default(false)) or (_sinexcel_exe_stat_after_extract.stat.exists | default(false))

    - name: 重启后确认进程状态
      ansible.windows.win_shell: |
        Start-Sleep -Seconds 3
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
      register: _sinexcel_process_after_restart
      changed_when: false
      when: (_sinexcel_exe_stat.stat.exists | default(false)) or (_sinexcel_exe_stat_after_extract.stat.exists | default(false))

    - name: 重启后查询 SINEXCEL API 状态
      ansible.builtin.uri:
        url: "{{ sinexcel_api_scheme }}://{{ _sinexcel_target_host }}:{{ sinexcel_api_port }}{{ sinexcel_api_status_path }}"
        method: POST
        body_format: json
        body:
          token: "{{ sinexcel_api_token }}"
        timeout: "{{ sinexcel_api_timeout }}"
        validate_certs: "{{ sinexcel_api_verify_tls }}"
        return_content: true
        status_code: [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]
      register: _sinexcel_api_after_restart
      delegate_to: localhost
      failed_when: false
      when: (_sinexcel_exe_stat.stat.exists | default(false)) or (_sinexcel_exe_stat_after_extract.stat.exists | default(false))

    - name: 登记 SINEXCEL 重启回调行
      ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _sinexcel_dev.hostname | default('', true) }}"
          ip: "{{ _sinexcel_dev.ip | default(inventory_hostname, true) }}"
          device_status: "{{ 'healthy' if ((_sinexcel_exe_stat.stat.exists | default(false)) or (_sinexcel_exe_stat_after_extract.stat.exists | default(false))) and ('RUNNING' in (_sinexcel_process_after_restart.stdout | default(''))) and ((_sinexcel_api_after_restart.status | default(0) | int) >= 200 and (_sinexcel_api_after_restart.status | default(0) | int) < 300) else 'unhealthy' }}"
          winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
          api_status: "{{ 'online' if ((_sinexcel_api_after_restart.status | default(0) | int) >= 200 and (_sinexcel_api_after_restart.status | default(0) | int) < 300) else 'offline' }}"
          abnormal_reason: >-
            {% if not ((_sinexcel_exe_stat.stat.exists | default(false)) or (_sinexcel_exe_stat_after_extract.stat.exists | default(false))) %}Executable not found: {{ exe_path }}
            {% elif 'RUNNING' not in (_sinexcel_process_after_restart.stdout | default('')) %}Restart failed: process not running
            {% elif not (((_sinexcel_api_after_restart.status | default(0) | int) >= 200) and ((_sinexcel_api_after_restart.status | default(0) | int) < 300)) %}API check failed after restart: http={{ _sinexcel_api_after_restart.status | default('n/a') }}
            {% else %}{% endif %}

  post_tasks:
    - name: 写回 Semaphore 设备状态（post_tasks）
      run_once: true
      delegate_to: localhost
      block:
        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
- name: 写回 Semaphore 设备状态（独立 play）
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/../shared/files"
  tasks:
    - name: 执行 bulk 回调
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"