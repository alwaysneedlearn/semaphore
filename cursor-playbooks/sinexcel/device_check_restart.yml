---
- name: SINEXCEL 巡检重启
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_debug_tag: SINEXCEL
    ini_agent_force_stop: false
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('C:\\Program Files\\SINEXCEL', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    exe_name: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) | default('sinexcel_agent.exe', true) }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('sinexcel', true) }}"
    exe_path: "{{ exe_dir }}\\{{ zip_name }}\\{{ exe_name }}"
    process_name: "{{ (lookup('env', 'PROCESS_NAME') | default('', true) | trim) | default((exe_name | regex_replace('\\.exe$', '')), true) }}"
    stop_graceful_process_name: "{{ process_name }}"
    stop_popup_wait_seconds: "{{ ((lookup('env', 'STOP_POPUP_WAIT_SECONDS') | default('', true) | trim) | default('2', true)) | int }}"
    stop_popup_keyword: "{{ (lookup('env', 'STOP_POPUP_KEYWORD') | default('', true) | trim) | default('警告', true) }}"
    stop_force_after_graceful: "{{ ((lookup('env', 'STOP_FORCE_AFTER_GRACEFUL') | default('', true) | trim) | default('true', true)) | bool }}"
    stop_verify_process_name: "{{ process_name }}"
    sinexcel_start_check_api: true
    sinexcel_api_scheme: "{{ (lookup('env', 'SINEXCEL_API_SCHEME') | default('', true) | trim) | default('http', true) }}"
    sinexcel_api_port: "{{ ((lookup('env', 'SINEXCEL_API_PORT') | default('', true) | trim) | default('8080', true)) | int }}"
    sinexcel_api_status_path: "{{ (lookup('env', 'SINEXCEL_API_STATUS_PATH') | default('', true) | trim) | default('/SyncLims/QueryStatus', true) }}"
    sinexcel_api_timeout: "{{ ((lookup('env', 'SINEXCEL_API_TIMEOUT') | default('', true) | trim) | default('8', true)) | int }}"
    sinexcel_api_token: "{{ (lookup('env', 'SINEXCEL_API_TOKEN') | default('', true) | trim) | default('sinexcelapi', true) }}"
    sinexcel_api_verify_tls: "{{ ((lookup('env', 'SINEXCEL_API_VERIFY_TLS') | default('', true) | trim) | default('true', true)) | bool }}"
    sem_profile_tasks_dir: "{{ playbook_dir }}/../neware/tasks"
    config_file_name: "{{ (lookup('env', 'CONFIG_FILE_NAME') | default('', true) | trim) | default('sinexcel.iconf', true) }}"
    exe_args: "{{ (lookup('env', 'EXE_ARGS') | default('', true) | trim) | default('', true) }}"
    restart_delay: "{{ ((lookup('env', 'RESTART_DELAY') | default('', true) | trim) | default('30', true)) | int }}"
    process_verify_poll_seconds: "{{ ((lookup('env', 'PROCESS_VERIFY_POLL_SECONDS') | default('', true) | trim) | default('5', true)) | int }}"
    api_host: "{{ inventory_hostname }}"
    his_data_from_time: "{{ (lookup('env', 'HIS_DATA_FROM_TIME') | default('', true) | trim) | default('', true) }}"
    default_cfg: "{{ default_config | default({}) }}"
    device_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"
    merged_cfg: "{{ default_cfg | combine(device_cfg, recursive=True) }}"
    merged_cfg_json: "{{ merged_cfg | to_json }}"
    merged_system_config: "{{ (default_cfg.SystemConfig | default({})) | combine(device_cfg.SystemConfig | default({}), recursive=True) }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/resolve_exe_dir_windows.yml"
    - ansible.builtin.set_fact:
        _sinexcel_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({}) }}"

    - ansible.builtin.set_fact:
        _agent_target_host: "{{ _sinexcel_dev.ip | default(inventory_hostname, true) }}"

    - ansible.windows.win_stat:
        path: "{{ exe_path }}"
      register: _sinexcel_exe_stat

    - ansible.windows.win_shell: |
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
      register: _sinexcel_process_check
      changed_when: false
      when: _sinexcel_exe_stat.stat.exists | default(false)

    - ansible.builtin.uri:
        url: "{{ sinexcel_api_scheme }}://{{ _agent_target_host }}:{{ sinexcel_api_port }}{{ sinexcel_api_status_path }}"
        method: POST
        body_format: json
        body:
          token: "{{ sinexcel_api_token }}"
        timeout: "{{ sinexcel_api_timeout }}"
        validate_certs: "{{ sinexcel_api_verify_tls }}"
        return_content: true
        status_code: [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]
      register: _sinexcel_api_check
      delegate_to: localhost
      failed_when: false
      when: _sinexcel_exe_stat.stat.exists | default(false)

    - ansible.builtin.set_fact:
        _sinexcel_need_reconfigure: >-
          {{
            (not (_sinexcel_exe_stat.stat.exists | default(false)))
            or ('RUNNING' not in (_sinexcel_process_check.stdout | default('')))
            or (not (((_sinexcel_api_check.status | default(0) | int) >= 200) and ((_sinexcel_api_check.status | default(0) | int) < 300)))
          }}

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/assert_exe_present_require_redeploy.yml"
      when: _sinexcel_need_reconfigure | bool

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/ini_agent_config_stop_start.yml"
      when: _sinexcel_need_reconfigure | bool

  post_tasks:
    - ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _sinexcel_dev.hostname | default('', true) }}"
          ip: "{{ _sinexcel_dev.ip | default(inventory_hostname, true) }}"
          device_status: >-
            {% if not (_sinexcel_need_reconfigure | bool) %}healthy
            {% elif ('RUNNING' in (_ini_agent_process_after.stdout | default(''))) and (((_sinexcel_api_after.status | default(0) | int) >= 200) and ((_sinexcel_api_after.status | default(0) | int) < 300)) %}healthy
            {% else %}unhealthy{% endif %}
          winrm_status: online
          api_status: >-
            {% if not (_sinexcel_need_reconfigure | bool) %}online
            {% elif ((_sinexcel_api_after.status | default(0) | int) >= 200) and ((_sinexcel_api_after.status | default(0) | int) < 300) %}online
            {% else %}offline{% endif %}
          abnormal_reason: ""

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
