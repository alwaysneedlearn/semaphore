---
- name: SINEXCEL 巡检重启（API 优先；不健康仅 restart）
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars_files:
    - vars/api_port.yml
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
    sem_files_dir: "{{ playbook_dir }}/files"
    sem_debug_tag: SINEXCEL
    sem_operation_type: restart
    ini_agent_force_stop: false
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('C:\\Program Files\\SINEXCEL', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    _exe_name_default: sinexcel_agent.exe
    _exe_name_env: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) }}"
    _exe_name_base: "{{ (_exe_name_env if (_exe_name_env | length > 0) else _exe_name_default) | regex_replace('(?i)\\.exe$', '') }}"
    exe_name: "{{ _exe_name_base ~ '.exe' }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('sinexcel', true) }}"
    _app_dir_env: "{{ (lookup('env', 'APP_DIR') | default('', true) | trim) }}"
    app_dir: "{{ _app_dir_env if (_app_dir_env | length > 0) else zip_name }}"
    exe_dir_fallback_drives: "{{ (lookup('env', 'EXE_DIR_FALLBACK_DRIVES') | default('', true) | trim) | default('D,E,C', true) }}"
    exe_scan_latest: "{{ ((lookup('env', 'EXE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool }}"
    exe_scan_max_depth: "{{ ((lookup('env', 'EXE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('2', true)) | int }}"
    exe_path: "{% if app_dir in ['.', ''] %}{{ exe_dir }}\\{{ exe_name }}{% else %}{{ exe_dir }}\\{{ app_dir }}\\{{ exe_name }}{% endif %}"
    process_name: "{{ ((lookup('env', 'PROCESS_NAME') | default('', true) | trim) | regex_replace('(?i)\\.exe$', '')) | default(_exe_name_base, true) }}"
    stop_graceful_process_name: "{{ process_name }}"
    stop_popup_wait_seconds: "{{ ((lookup('env', 'STOP_POPUP_WAIT_SECONDS') | default('', true) | trim) | default('2', true)) | int }}"
    stop_popup_keyword: "{{ (lookup('env', 'STOP_POPUP_KEYWORD') | default('', true) | trim) | default('警告', true) }}"
    stop_popup_match_mode: "{{ (lookup('env', 'STOP_POPUP_MATCH_MODE') | default('', true) | trim) | default('title_or_content', true) }}"
    start_popup_wait_seconds: "{{ ((lookup('env', 'START_POPUP_WAIT_SECONDS') | default('', true) | trim) | default('3', true)) | int }}"
    start_popup_keyword: "{{ (lookup('env', 'START_POPUP_KEYWORD') | default('', true) | trim) | default('提示', true) }}"
    stop_force_after_graceful: "{{ ((lookup('env', 'STOP_FORCE_AFTER_GRACEFUL') | default('', true) | trim) | default('true', true)) | bool }}"
    stop_verify_process_name: "{{ process_name }}"
    sinexcel_start_check_api: true
    sinexcel_include_retransmit: false
    start_popup_match_mode: "{{ (lookup('env', 'START_POPUP_MATCH_MODE') | default('', true) | trim) | default('title_or_content', true) }}"
    exe_args: "{{ (lookup('env', 'EXE_ARGS') | default('', true) | trim) | default('', true) }}"
    restart_delay: "{{ ((lookup('env', 'RESTART_DELAY') | default('', true) | trim) | default('30', true)) | int }}"
    process_verify_poll_seconds: "{{ ((lookup('env', 'PROCESS_VERIFY_POLL_SECONDS') | default('', true) | trim) | default('5', true)) | int }}"
    default_cfg: "{{ default_config | default({}) }}"
    device_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"
    merged_cfg: "{{ default_cfg | combine(device_cfg, recursive=True) }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - name: 解析当前设备信息
      ansible.builtin.set_fact:
        _sinexcel_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({}) }}"
        _sinexcel_target_host: "{{ _sinexcel_dev.ip | default(inventory_hostname, true) }}"

    - name: SINEXCEL Kafka QueryConfig API（巡检重启首要判定）
      ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_kafka_query_config.yml"
      vars:
        sinexcel_kafka_register_api_after: false

    - name: SINEXCEL API 已健康（跳过 restart）
      when: _sinexcel_kafka_api_ok | default(false) | bool
      block:
        - name: WinRM 参考探测（仅填写 winrm_status）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_probe_reference_only.yml"
          vars:
            winrm_probe_reference_label: "SINEXCEL check_restart API 快路径"

        - name: 登记 Semaphore 状态回调行（API 健康快路径）
          ansible.builtin.set_fact:
            _sinexcel_need_reconfigure: false
            semaphore_callback_row:
              hostname: "{{ _sinexcel_dev.hostname | default('', true) }}"
              ip: "{{ _sinexcel_dev.ip | default(inventory_hostname, true) }}"
              device_status: healthy
              winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
              api_status: online
              abnormal_reason: ""

        - name: API 健康 — 结束本主机
          ansible.builtin.meta: end_host

    - name: SINEXCEL API 未通过 — 标记需要 restart
      ansible.builtin.set_fact:
        _sinexcel_need_reconfigure: true
      when: not (_sinexcel_kafka_api_ok | default(false) | bool)

    - name: WinRM 建连（含重试）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"

    - name: WinRM 未连通则不再执行本主机后续步骤
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"

    - name: 部署 Windows 启动辅助脚本
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"

    - name: 解析每设备安装路径
      ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/prepare_device_exe_paths.yml"

    - name: 解析 EXE_DIR（盘符回退）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/resolve_exe_dir_windows.yml"

    - name: 检查 SINEXCEL 进程状态
      ansible.windows.win_shell: |
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
      register: _sinexcel_process_check
      changed_when: false

    - name: SINEXCEL API 200 但未达健康 — 参考判定是否 restart
      when:
        - _sinexcel_need_reconfigure | default(false) | bool
        - sinexcel_kafka_http_ok | default(false) | bool
        - not (_sinexcel_kafka_api_ok | default(false) | bool)
      ansible.builtin.set_fact:
        _sinexcel_need_reconfigure: >-
          {{
            (((_sinexcel_process_check | default({})).stdout | default('') | trim).split('|') | first) != 'RUNNING')
            or (
              (sinexcel_start_check_api | default(true) | bool)
              and not (_sinexcel_kafka_api_ok | default(false) | bool)
            )
          }}

    - ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/sinexcel_config_stop_start.yml"
      when: _sinexcel_need_reconfigure | default(false) | bool

  post_tasks:
    - ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _sinexcel_dev.hostname | default('', true) }}"
          ip: "{{ _sinexcel_dev.ip | default(inventory_hostname, true) }}"
          device_status: >-
            {{ 'unhealthy' if (host_failure_reason is defined)
               else ('healthy' if not (_sinexcel_need_reconfigure | default(false) | bool)
               else ('healthy' if (((_ini_agent_process_after.stdout | default('') | trim).split('|') | first) == 'RUNNING') and (_sinexcel_kafka_api_ok | default(false) | bool)
               else 'unhealthy')) }}
          winrm_status: online
          api_status: >-
            {{ 'offline' if (host_failure_reason is defined)
               else ('online' if not (_sinexcel_need_reconfigure | default(false) | bool)
               else ('online' if (_sinexcel_kafka_api_ok | default(false) | bool) else 'offline')) }}
          abnormal_reason: "{{ host_failure_reason | default('') }}"
      when: semaphore_callback_row is not defined

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record.yml"
      when: semaphore_callback_row is defined

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/debug_sync_api_start_snapshot.yml"
      when: _sinexcel_need_reconfigure | default(false) | bool

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_operation_logs.yml"
