---
- name: LAND 下发配置（API KV）
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars:
    land_api_scheme: "{{ (lookup('env', 'LAND_API_SCHEME') | default('', true) | trim) | default('http', true) }}"
    land_api_port: "{{ ((lookup('env', 'LAND_API_PORT') | default('', true) | trim) | default('9002', true)) | int }}"
    land_api_config_path: "{{ (lookup('env', 'LAND_API_CONFIG_PATH') | default('', true) | trim) | default('/api/config', true) }}"
    land_api_timeout: "{{ ((lookup('env', 'LAND_API_TIMEOUT') | default('', true) | trim) | default('8', true)) | int }}"
    land_api_token: "{{ lookup('env', 'LAND_API_TOKEN') | default('', true) | trim }}"
    land_api_verify_tls: "{{ ((lookup('env', 'LAND_API_VERIFY_TLS') | default('', true) | trim) | default('true', true)) | bool }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - name: 解析当前设备信息与配置
      ansible.builtin.set_fact:
        _land_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({}) }}"
        _land_target_host: "{{ ((_semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({})).ip | default(inventory_hostname, true)) }}"
        _land_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"

    - name: 推送 LAND 配置到 API
      ansible.builtin.uri:
        url: "{{ land_api_scheme }}://{{ _land_target_host }}:{{ land_api_port }}{{ land_api_config_path }}"
        method: POST
        headers: "{{ ({'Authorization': 'Bearer ' ~ land_api_token} if (land_api_token | length) > 0 else {}) }}"
        body_format: json
        body: "{{ _land_cfg }}"
        timeout: "{{ land_api_timeout }}"
        validate_certs: "{{ land_api_verify_tls }}"
        return_content: true
        status_code: [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]
      register: _land_cfg_result
      delegate_to: localhost
      failed_when: false

    - name: 登记 LAND 配置回调行
      ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _land_dev.hostname | default('', true) }}"
          ip: "{{ _land_dev.ip | default(inventory_hostname, true) }}"
          device_status: "{{ 'healthy' if ((_land_cfg_result.status | default(0) | int) >= 200 and (_land_cfg_result.status | default(0) | int) < 300) else 'unhealthy' }}"
          api_status: "{{ 'online' if ((_land_cfg_result.status | default(0) | int) >= 200 and (_land_cfg_result.status | default(0) | int) < 300) else 'offline' }}"
          abnormal_reason: "{{ '' if ((_land_cfg_result.status | default(0) | int) >= 200 and (_land_cfg_result.status | default(0) | int) < 300) else ('Config API failed: http=' ~ (_land_cfg_result.status | default('n/a') | string)) }}"

  post_tasks:
    - name: 写回 Semaphore 设备状态（post_tasks）
      run_once: true
      delegate_to: localhost
      block:
        - ansible.builtin.include_tasks: ../neware/tasks/semaphore_bulk_put_from_hostvars.yml

- name: 写回 Semaphore 设备状态（独立 play）
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 执行 bulk 回调
      ansible.builtin.include_tasks: ../neware/tasks/semaphore_bulk_put_from_hostvars.yml
