---
# WinRM 超时：单主机慢响应时优先快速失败，避免拖慢整批执行
ansible_winrm_connection_timeout: 25
ansible_winrm_operation_timeout_sec: 20
ansible_winrm_read_timeout_sec: 30
ansible_winrm_server_cert_validation: ignore
# Ansible 任务关键字 timeout（秒）：pywinrm 卡住超过 read_timeout 时硬杀
winrm_task_timeout_sec: "{{ ((lookup('env', 'WINRM_TASK_TIMEOUT_SEC') | default('', true) | trim) | default('90', true)) | int }}"
winrm_copy_task_timeout_sec: "{{ ((lookup('env', 'WINRM_COPY_TASK_TIMEOUT_SEC') | default('', true) | trim) | default('180', true)) | int }}"
winrm_shell_quick_timeout_sec: "{{ ((lookup('env', 'WINRM_SHELL_QUICK_TIMEOUT_SEC') | default('', true) | trim) | default('120', true)) | int }}"
winrm_shell_long_timeout_sec: "{{ ((lookup('env', 'WINRM_SHELL_LONG_TIMEOUT_SEC') | default('', true) | trim) | default('900', true)) | int }}"
winrm_copy_large_timeout_sec: "{{ ((lookup('env', 'WINRM_COPY_LARGE_TIMEOUT_SEC') | default('', true) | trim) | default('3600', true)) | int }}"
uri_task_timeout_sec: "{{ ((lookup('env', 'URI_TASK_TIMEOUT_SEC') | default('', true) | trim) | default('60', true)) | int }}"
uri_poll_task_timeout_sec: "{{ ((lookup('env', 'URI_POLL_TASK_TIMEOUT_SEC') | default('', true) | trim) | default('300', true)) | int }}"

land_start_check_api: "{{ ((lookup('env', 'LAND_START_CHECK_API') | default('', true) | trim) | default('true', true)) | bool }}"
land_query_status_require_real_status: "{{ ((lookup('env', 'LAND_QUERY_STATUS_REQUIRE_REAL_STATUS') | default('', true) | trim) | default('true', true)) | bool }}"
# After start/restart: poll POST QueryStatus until api_ok or retries exhausted (patrol uses single POST).
land_api_status_start_poll_retries: "{{ ((lookup('env', 'LAND_API_STATUS_START_POLL_RETRIES') | default('', true) | trim) | default('6', true)) | int }}"
land_api_status_start_poll_delay: "{{ ((lookup('env', 'LAND_API_STATUS_START_POLL_DELAY') | default('', true) | trim) | default('10', true)) | int }}"
