---
# LAND redeploy: resolve desktop user + dest, copy installer exe if missing (before graceful stop).

- ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/land_prepare_installer_vars.yml"

- name: 重新部署：获取当前登录用户（复制安装包前）
  ansible.windows.win_shell: |
    $explorerUser = Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
      ForEach-Object {
        $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($o -and $o.ReturnValue -eq 0 -and $o.User) { $o.User.Trim() }
      } |
      Where-Object { $_ } |
      Select-Object -First 1
    if ($explorerUser) { Write-Output $explorerUser } else { Write-Output "{{ hostvars[inventory_hostname].ansible_user | default('Administrator') }}" }
  register: _land_install_get_user
  changed_when: false

- name: 重新部署：登记桌面用户
  ansible.builtin.set_fact:
    _land_install_profile_user: "{{ (_land_install_get_user.stdout_lines | default([]) | last | default(_land_install_get_user.stdout | default(''))) | trim }}"
    _reconfig_profile_user: "{{ (_land_install_get_user.stdout_lines | default([]) | last | default(_land_install_get_user.stdout | default(''))) | trim }}"

- name: 重新部署：解析安装程序目标路径（默认登录用户桌面）
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Temp\sem_land_resolve_installer_dest.ps1
  environment:
    LAND_INSTALLER_DEST_OVERRIDE: "{{ (lookup('env', 'LAND_INSTALLER_DEST') | default('', true) | trim) }}"
    LAND_INSTALLER_FILENAME: "{{ land_installer_filename }}"
    LAND_INSTALLER_USE_DESKTOP: "{{ land_installer_use_desktop | string }}"
    LAND_INSTALL_PROFILE_USER: "{{ _land_install_profile_user }}"
    LAND_INSTALLER_FALLBACK_DIR: "{{ exe_dir }}"
  register: _land_installer_dest_cmd
  changed_when: false
  failed_when: >
    (_land_installer_dest_cmd.rc | default(0) | int) != 0
    or ('DESKTOP_RESOLVE_FAILED' in (_land_installer_dest_cmd.stdout | default('')))
    or ('DEST_RESOLVE_FAILED' in (_land_installer_dest_cmd.stdout | default('')))

- name: DEBUG LAND 安装程序目标路径解析
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] installer_dest_resolve rc={{ _land_installer_dest_cmd.rc | default('n/a') }}"
      - "[DEBUG-LAND] installer_dest_resolve stdout={{ (_land_installer_dest_cmd.stdout | default('') | string) | truncate(500, True) }}"
  when: _land_installer_dest_cmd is defined

- name: 重新部署：登记安装程序目标路径
  ansible.builtin.set_fact:
    land_installer_dest: "{{ _land_installer_dest_resolved }}"
    land_installer_dest_dir: "{{ _land_installer_dest_resolved | regex_replace('\\\\[^\\\\]+$', '') }}"
  vars:
    _land_installer_dest_resolved: >-
      {{
        (
          _land_installer_dest_cmd.stdout_lines | default([])
          | map('trim')
          | reject('equalto', '')
          | reject('search', '_FAILED')
          | list
          | last
          | default('')
        )
        | trim
      }}

- name: 重新部署：安装程序目标路径无效则失败
  ansible.builtin.fail:
    msg: >-
      Could not resolve installer dest path (user={{ _land_install_profile_user }},
      stdout={{ (_land_installer_dest_cmd.stdout | default('') | string) | truncate(300, True) }}).
      Ensure deploy_sem_windows_helper_scripts ran and sem_land_resolve_installer_dest.ps1 exists.
  when: (land_installer_dest | default('') | trim | length) == 0

- name: 重新部署：检查目标机安装程序是否已存在
  ansible.windows.win_stat:
    path: "{{ land_installer_dest }}"
  register: _land_installer_dest_stat

- name: 重新部署：确保目标目录存在
  ansible.windows.win_file:
    path: "{{ land_installer_dest_dir }}"
    state: directory
  when: not (_land_installer_dest_stat.stat.exists | default(false))

- name: 重新部署：复制安装程序 exe 到目标路径
  ansible.windows.win_copy:
    src: "{{ land_installer_src_controller }}"
    dest: "{{ land_installer_dest }}"
  register: _land_installer_copy
  when: not (_land_installer_dest_stat.stat.exists | default(false))

- name: DEBUG LAND 安装程序已存在（跳过复制）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] installer_copy skipped=already_on_host"
      - "[DEBUG-LAND] installer_dest={{ land_installer_dest }}"
  when: _land_installer_dest_stat.stat.exists | default(false)

- name: DEBUG LAND 安装程序已复制
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] installer_copy src={{ land_installer_src_controller }}"
      - "[DEBUG-LAND] installer_copy dest={{ land_installer_dest }}"
  when: not (_land_installer_dest_stat.stat.exists | default(false))
