---
# After start / restart / redeploy. Accepts _land_process_after_start or _land_process_after_restart or _land_process_check.

- name: DEBUG LAND 启动（路径与进程）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] host={{ inventory_hostname }} exe_path={{ exe_path | default('n/a') }}"
      - "[DEBUG-LAND] exe_exists_initial={{ _land_exe_stat.stat.exists | default(false) }}"
      - "[DEBUG-LAND] exe_exists_after_extract={{ _land_exe_stat_after_extract.stat.exists | default('n/a') if (_land_exe_stat_after_extract is defined) else 'n/a' }}"
      - "[DEBUG-LAND] profile_user={{ _reconfig_profile_user | default('n/a') }}"
      - "[DEBUG-LAND] need_reconfigure={{ _land_need_reconfigure | default('n/a') }}"
      - "[DEBUG-LAND] process_check={{ _land_dbg_process | trim }}"
  vars:
    _land_dbg_process: >-
      {% if _land_process_after_start is defined %}{{ _land_process_after_start.stdout | default('') }}
      {% elif _land_process_after_restart is defined %}{{ _land_process_after_restart.stdout | default('') }}
      {% elif _land_process_check is defined %}{{ _land_process_check.stdout | default('') }}
      {% else %}skipped{% endif %}
  when: _land_exe_stat is defined

- name: DEBUG LAND 启动（SyncLims API）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] api_check_enabled={{ land_start_check_api | default(_land_api_check is defined) }}"
      - "[DEBUG-LAND] api http_status={{ _land_dbg_api_status }}"
      - "[DEBUG-LAND] api response_body={{ _land_dbg_api_body | truncate(2000, True) }}"
  vars:
    _land_dbg_api_status: >-
      {% if _land_api_after_start is defined %}{{ _land_api_after_start.status | default('n/a') }}
      {% elif _land_api_after_restart is defined %}{{ _land_api_after_restart.status | default('n/a') }}
      {% elif _land_api_check is defined %}{{ _land_api_check.status | default('n/a') }}
      {% else %}skipped{% endif %}
    _land_dbg_api_body: >-
      {% if _land_api_after_start is defined %}{{ _land_api_after_start.content | default('') | string }}
      {% elif _land_api_after_restart is defined %}{{ _land_api_after_restart.content | default('') | string }}
      {% elif _land_api_check is defined %}{{ _land_api_check.content | default('') | string }}
      {% else %}{% endif %}
  when: >
    _land_api_after_start is defined or
    _land_api_after_restart is defined or
    _land_api_check is defined

- name: DEBUG LAND 启动（回调行预览）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] callback device_status={{ semaphore_callback_row.device_status | default('n/a') }}"
      - "[DEBUG-LAND] callback api_status={{ semaphore_callback_row.api_status | default('n/a') }}"
      - "[DEBUG-LAND] callback abnormal_reason={{ semaphore_callback_row.abnormal_reason | default('') | trim }}"
  when: semaphore_callback_row is defined
