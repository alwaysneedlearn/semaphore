---
# After win_stat / process / API checks. Expects play vars: exe_path, process_name, land_api_* ; registers on host.

- name: DEBUG LAND 巡检（路径与进程）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] host={{ inventory_hostname }} winrm_session_ok={{ _winrm_session_ok | default(false) }}"
      - "[DEBUG-LAND] exe_path={{ exe_path | default('n/a') }} exists={{ _land_exe_stat.stat.exists | default(false) }}"
      - "[DEBUG-LAND] process_name={{ process_name | default('n/a') }} check={{ (_land_process_check.stdout | default('') | trim) if (_land_process_check is defined) else 'skipped' }}"
      - "[DEBUG-LAND] process_unreachable={{ _land_process_check.unreachable | default(false) if (_land_process_check is defined) else 'n/a' }}"
  when: _land_exe_stat is defined or _land_process_check is defined

- name: DEBUG LAND 巡检（SyncLims API）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] api POST {{ land_api_scheme | default('http') }}://{{ _land_target_host | default(inventory_hostname) }}:{{ land_api_port | default(8080) }}{{ land_api_status_path | default('/SyncLims/QueryStatus') }}"
      - "[DEBUG-LAND] api http_status={{ _land_api_status.status | default('n/a') }}"
      - "[DEBUG-LAND] api response_body={{ (_land_api_status.content | default('') | string) | truncate(2000, True) }}"
      - "[DEBUG-LAND] api_json_ok={{ ((_land_api_status.status | default(0) | int) >= 200 and (_land_api_status.status | default(0) | int) < 300) }}"
  when: _land_api_status is defined

- name: DEBUG LAND 巡检（回调行预览）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] callback device_status={{ semaphore_callback_row.device_status | default('n/a') }}"
      - "[DEBUG-LAND] callback api_status={{ semaphore_callback_row.api_status | default('n/a') }}"
      - "[DEBUG-LAND] callback winrm_status={{ semaphore_callback_row.winrm_status | default('n/a') }}"
      - "[DEBUG-LAND] callback abnormal_reason={{ semaphore_callback_row.abnormal_reason | default('') | trim }}"
  when: semaphore_callback_row is defined
