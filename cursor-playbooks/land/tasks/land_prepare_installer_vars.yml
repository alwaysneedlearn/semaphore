---
# LAND redeploy: resolve installer exe on controller; dest resolved in land_redeploy_gui_install.yml.
# INSTALLER_EXE_NAME (or ZIP_NAME) = file base with .exe; ZIP_PATH = dir or full .exe path.

- name: 规范化 LAND 安装程序文件名
  ansible.builtin.set_fact:
    _installer_name_raw: >-
      {{
        (lookup('env', 'INSTALLER_EXE_NAME') | default('', true) | trim)
        if ((lookup('env', 'INSTALLER_EXE_NAME') | default('', true) | trim) | length > 0)
        else (
          (lookup('env', 'ZIP_NAME') | default('', true) | trim)
          if ((lookup('env', 'ZIP_NAME') | default('', true) | trim) | length > 0)
          else 'LHBTS.exe'
        )
      }}
    _installer_path_raw: "{{ (lookup('env', 'ZIP_PATH') | default('', true) | trim) | default('/root/neware/dbwb', true) }}"
    land_installer_use_desktop: >-
      {{
        ((lookup('env', 'LAND_INSTALLER_USE_DESKTOP') | default('', true) | trim) | default('true', true)) | bool
      }}

- name: 登记 LAND 安装程序源路径
  ansible.builtin.set_fact:
    land_installer_filename: "{{ _installer_name_raw | regex_replace('(?i)\\.exe$', '') ~ '.exe' }}"
    land_installer_src_controller: >-
      {{
        _installer_path_raw
        if (_installer_path_raw is match('(?i).*\\.exe$'))
        else (_installer_path_raw | regex_replace('/$', '') ~ '/' ~ (_installer_name_raw | regex_replace('(?i)\\.exe$', '') ~ '.exe'))
      }}
