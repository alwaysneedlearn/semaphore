---
# Retry ModifyConfig after start/restart when process+API healthy and before_stop failed or skipped.
# Requires: _land_process_after_start or _land_process_after_restart; _land_api_after_start or _land_api_after_restart

- name: 启动后：API 修改配置（停止前失败或未尝试时重试）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/land_api_modify_config_attempt.yml"
  vars:
    land_modify_config_phase: after_start
  when: >-
    (merged_cfg.SystemConfig | default({}) | length) > 0
    and not (_land_modify_config_before_ok | default(false) | bool)
    and (
      (((_land_process_after_start | default({})).stdout | default('') | trim).split('|') | first) == 'RUNNING'
      or (((_land_process_after_restart | default({})).stdout | default('') | trim).split('|') | first) == 'RUNNING'
    )
    and (
      (
        (_land_api_after_start.status | default(0) | int) >= 200
        and (_land_api_after_start.status | default(0) | int) < 300
      ) or (
        (_land_api_after_restart.status | default(0) | int) >= 200
        and (_land_api_after_restart.status | default(0) | int) < 300
      ) or (
        not (land_start_check_api | default(true) | bool)
        and (
          (((_land_process_after_start | default({})).stdout | default('') | trim).split('|') | first) == 'RUNNING'
          or (((_land_process_after_restart | default({})).stdout | default('') | trim).split('|') | first) == 'RUNNING'
        )
      )
    )

- name: DEBUG LAND 启动后未重试改配置（停止前已成功）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] modify_config phase=after_start skipped=before_stop_already_ok"
  when:
    - (merged_cfg.SystemConfig | default({}) | length) > 0
    - _land_modify_config_before_ok | default(false) | bool

- name: DEBUG LAND 启动后未重试改配置（进程或 API 未就绪）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] modify_config phase=after_start skipped=process_or_api_not_ready"
      - "[DEBUG-LAND] process={{ (_land_process_after_start.stdout | default(_land_process_after_restart.stdout | default('')) | trim) }}"
      - "[DEBUG-LAND] api_http={{ _land_api_after_start.status | default(_land_api_after_restart.status | default('n/a')) }}"
  when:
    - (merged_cfg.SystemConfig | default({}) | length) > 0
    - not (_land_modify_config_before_ok | default(false) | bool)
    - _land_api_modify_config_after is not defined
