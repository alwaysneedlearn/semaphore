---
# LAND: API modify → graceful stop → start → API retry → optional Redeliver. No zip.
# Requires play vars: merged_cfg, exe_path, process_name, land_* API vars, _land_target_host, _land_dev

- name: LAND 重启前检查进程
  ansible.windows.win_shell: |
    $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
  register: _land_process_before
  changed_when: false

- name: LAND API 修改配置（停止前，进程在跑时）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/land_api_modify_config_before_stop.yml"
  when: >-
    (merged_cfg.SystemConfig | default({}) | length) > 0
    and 'RUNNING' in (_land_process_before.stdout | default(''))

- name: LAND 优雅停止
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/stop_program_graceful_before_reconfig.yml"

- name: 获取当前登录用户
  ansible.windows.win_shell: |
    $explorerUser = Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
      ForEach-Object {
        $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($o -and $o.ReturnValue -eq 0 -and $o.User) { $o.User.Trim() }
      } |
      Where-Object { $_ } |
      Select-Object -First 1
    if ($explorerUser) { Write-Output $explorerUser } else { Write-Output "{{ hostvars[inventory_hostname].ansible_user | default('Administrator') }}" }
  register: get_username_result
  changed_when: false

- name: 规范化启动用户
  ansible.builtin.set_fact:
    _reconfig_profile_user: "{{ (get_username_result.stdout_lines | default([]) | last | default(get_username_result.stdout | default(''))) | trim }}"

- name: 启动 LAND 程序
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/reconfig_start_program_windows.yml"

- name: 重启后确认进程状态
  ansible.windows.win_shell: |
    Start-Sleep -Seconds 3
    $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
  register: _land_process_after_restart
  changed_when: false

- name: 重启后查询 LAND API 状态（轮询 QueryStatus）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/land_api_query_status_start_poll.yml"
  when: land_start_check_api | default(true) | bool

- name: 跳过启动后 LAND API 检查
  ansible.builtin.set_fact:
    _land_api_after_restart:
      status: 200
      skipped: true
      content: ""
    land_api_status_ok: true
  when: not (land_start_check_api | default(true) | bool)

- name: 启动后 API 修改配置重试
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/land_api_modify_config_after_start_retry.yml"
  when: (merged_cfg.SystemConfig | default({}) | length) > 0

- name: 数据重传 Redeliver（restart 专用）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/land_api_redeliver.yml"
  when: >-
    (merged_cfg.Redeliver | default({}) | length) > 0
    and ('RUNNING' in (_land_process_after_restart.stdout | default('')))
    and (land_api_status_ok | default(false) | bool)
    and (land_include_redeliver | default(true) | bool)
