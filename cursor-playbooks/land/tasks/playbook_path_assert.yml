---
# 每台 LAND play 开头 include；避免 runner 未同步仍指向 neware/tasks 或缺少 shared/
- name: 校验 LAND 模板 playbook 目录
  ansible.builtin.assert:
    that:
      - (playbook_dir | basename) == 'land'
    fail_msg: >-
      playbook_dir={{ playbook_dir }}。
      Semaphore 中 LAND 类型模板的 Playbook 路径必须是 cursor-playbooks/land/device_*.yml
      （不能是 neware/device_*.yml）。
      在 runner 上：cd /root/playbook && git pull，并检查 land/device_status.yml 首条 WinRM 为
      include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"。

- name: 检查 shared WinRM 任务文件（控制机）
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../shared/tasks/winrm_connect_one_attempt.yml"
  delegate_to: localhost
  run_once: true
  register: _land_shared_winrm_stat

- name: 校验 shared/ 已同步到 runner
  ansible.builtin.assert:
    that:
      - _land_shared_winrm_stat.stat.exists | default(false) | bool
    fail_msg: >-
      未找到 {{ playbook_dir }}/../shared/tasks/winrm_connect_one_attempt.yml。
      请部署完整 cursor-playbooks（含 shared/），并删除 runner 上过期的
      neware/tasks/winrm_ensure_reachable.yml（若仍存在）。
