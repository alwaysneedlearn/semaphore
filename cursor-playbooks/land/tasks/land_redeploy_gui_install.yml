---
# LAND redeploy: GUI wizard after graceful stop (requires land_redeploy_copy_installer.yml first).
# Sets _redeploy_exe_stat_after for operation log.

- name: 重新部署：安装程序路径未登记则失败
  ansible.builtin.fail:
    msg: >-
      land_installer_dest is not set — land_redeploy_copy_installer.yml must run
      before GUI install (graceful stop phase).
  when: (land_installer_dest | default('') | trim | length) == 0

- name: 重新部署：强制刷新 GUI 安装脚本（避免 C:\Windows\Temp 残留旧版）
  ansible.windows.win_copy:
    src: "{{ sem_files_dir | default(playbook_dir ~ '/files') }}/sem_land_gui_installer_interactive.ps1"
    dest: C:\Windows\Temp\sem_land_gui_installer_interactive.ps1
    force: true

- name: 重新部署：强制刷新 GUI 安装 worker
  ansible.windows.win_copy:
    src: "{{ sem_files_dir | default(playbook_dir ~ '/files') }}/sem_land_gui_installer_worker.ps1"
    dest: C:\Windows\Temp\sem_land_gui_installer_worker.ps1
    force: true

- name: 重新部署：执行 GUI 安装向导
  environment:
    LAND_INSTALLER_EXE_PATH: "{{ land_installer_dest }}"
    SEMAPHORE_PROFILE_USER: "{{ _land_install_profile_user | default(_reconfig_profile_user) }}"
    LAND_INSTALL_TASK_TIMEOUT_SECONDS: "{{ ((lookup('env', 'LAND_INSTALL_TASK_TIMEOUT_SECONDS') | default('', true) | trim) | default('180', true)) }}"
    LAND_INSTALL_STEP_TIMEOUT_SECONDS: "{{ ((lookup('env', 'LAND_INSTALL_STEP_TIMEOUT_SECONDS') | default('', true) | trim) | default('90', true)) }}"
    LAND_INSTALL_DLG1_TITLE: "{{ (lookup('env', 'LAND_INSTALL_DLG1_TITLE') | default('', true) | trim) | default('LHBTS 安装', true) }}"
    LAND_INSTALL_DLG1_BUTTON: "{{ (lookup('env', 'LAND_INSTALL_DLG1_BUTTON') | default('', true) | trim) | default('升级', true) }}"
    LAND_INSTALL_DLG2_TITLE: "{{ (lookup('env', 'LAND_INSTALL_DLG2_TITLE') | default('', true) | trim) | default('提示', true) }}"
    LAND_INSTALL_DLG2_BUTTON: "{{ (lookup('env', 'LAND_INSTALL_DLG2_BUTTON') | default('', true) | trim) | default('确定', true) }}"
    LAND_INSTALL_DLG3_TITLE: "{{ (lookup('env', 'LAND_INSTALL_DLG3_TITLE') | default('', true) | trim) | default('LHBTS 安装', true) }}"
    LAND_INSTALL_DLG3_BUTTON: "{{ (lookup('env', 'LAND_INSTALL_DLG3_BUTTON') | default('', true) | trim) | default('确定', true) }}"
    LAND_INSTALL_DLG1_COORD_X_PCT: "{{ (lookup('env', 'LAND_INSTALL_DLG1_COORD_X_PCT') | default('', true) | trim) | default('32', true) }}"
    LAND_INSTALL_DLG1_COORD_Y_PCT: "{{ (lookup('env', 'LAND_INSTALL_DLG1_COORD_Y_PCT') | default('', true) | trim) | default('93', true) }}"
    LAND_INSTALL_DLG2_COORD_X_PCT: "{{ (lookup('env', 'LAND_INSTALL_DLG2_COORD_X_PCT') | default('', true) | trim) | default('0', true) }}"
    LAND_INSTALL_DLG2_COORD_Y_PCT: "{{ (lookup('env', 'LAND_INSTALL_DLG2_COORD_Y_PCT') | default('', true) | trim) | default('0', true) }}"
    LAND_INSTALL_DLG3_COORD_X_PCT: "{{ (lookup('env', 'LAND_INSTALL_DLG3_COORD_X_PCT') | default('', true) | trim) | default('88', true) }}"
    LAND_INSTALL_DLG3_COORD_Y_PCT: "{{ (lookup('env', 'LAND_INSTALL_DLG3_COORD_Y_PCT') | default('', true) | trim) | default('93', true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_land_gui_installer_interactive.ps1
  args:
    chdir: C:\Windows\Temp
  register: _land_gui_install
  failed_when: >
    _land_gui_install is defined and 'stdout' in _land_gui_install and
    (
      ('INSTALL_SCRIPT_REV=20260707-schtasks-fallback-v3' not in (_land_gui_install.stdout | default('')))
      or ('INSTALL_COMPLETE' not in (_land_gui_install.stdout | default('')))
      or ('INSTALL_ERROR' in (_land_gui_install.stdout | default('')))
      or ('INSTALL_FAILED' in (_land_gui_install.stdout | default('')))
      or ('StopExisting' in (_land_gui_install.stdout | default('')))
    )

- name: DEBUG LAND GUI 安装结果
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LAND] gui_install dest={{ land_installer_dest | default('n/a') }}"
      - "[DEBUG-LAND] gui_install user={{ _land_install_profile_user | default(_reconfig_profile_user) }}"
      - "[DEBUG-LAND] gui_install stdout={{ (_land_gui_install.stdout | default('') | string) | truncate(2000, True) }}"

- name: 重新部署：安装后检查程序文件
  ansible.windows.win_stat:
    path: "{{ exe_path }}"
  register: _redeploy_exe_stat_after

- name: 重新部署：程序文件不存在则失败
  ansible.builtin.fail:
    msg: "Install path not found after LAND GUI installer: {{ exe_path }}"
  when: not (_redeploy_exe_stat_after.stat.exists | default(false))
