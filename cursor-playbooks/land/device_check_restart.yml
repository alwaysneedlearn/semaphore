---
# Play 0：批量查一次 TDengine 通道 LAST(insert_time)
- name: LAND check_restart — 批量加载 TDengine 通道新鲜度
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_tdengine_query_channel_last.yml"

- name: LAND 巡检重启（通道新鲜度优先；不健康仅 restart）
  hosts: windows_hosts
  strategy: free
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
    sem_files_dir: "{{ playbook_dir }}/files"
    sem_debug_tag: LAND
    sem_operation_type: restart
    land_include_redeliver: false
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('C:\\Program Files\\LAND', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    _exe_name_default: LHBTS.exe
    _exe_name_env: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) }}"
    _exe_name_base: "{{ (_exe_name_env if (_exe_name_env | length > 0) else _exe_name_default) | regex_replace('(?i)\\.exe$', '') }}"
    exe_name: "{{ _exe_name_base ~ '.exe' }}"
    _app_dir_env: "{{ (lookup('env', 'APP_DIR') | default('', true) | trim) }}"
    app_dir: "{{ _app_dir_env if (_app_dir_env | length > 0) else 'LHBTS' }}"
    exe_path: "{% if app_dir in ['.', ''] %}{{ exe_dir }}\\{{ exe_name }}{% else %}{{ exe_dir }}\\{{ app_dir }}\\{{ exe_name }}{% endif %}"
    exe_args: "{{ (lookup('env', 'EXE_ARGS') | default('', true) | trim) | default('', true) }}"
    restart_delay: "{{ ((lookup('env', 'RESTART_DELAY') | default('', true) | trim) | default('30', true)) | int }}"
    process_verify_poll_seconds: "{{ ((lookup('env', 'PROCESS_VERIFY_POLL_SECONDS') | default('', true) | trim) | default('5', true)) | int }}"
    process_name: "{{ ((lookup('env', 'PROCESS_NAME') | default('', true) | trim) | regex_replace('(?i)\\.exe$', '')) | default(_exe_name_base, true) }}"
    stop_graceful_process_name: "{{ process_name }}"
    stop_popup_wait_seconds: 2
    stop_popup_keyword: "{{ (lookup('env', 'STOP_POPUP_KEYWORD') | default('', true) | trim) | default('警告', true) }}"
    stop_force_after_graceful: true
    stop_verify_process_name: "{{ process_name }}"
    land_api_modify_config_path: "{{ (lookup('env', 'LAND_API_MODIFY_CONFIG_PATH') | default('', true) | trim) | default('/SyncLims/ModifyConfig', true) }}"
    land_api_redeliver_path: "{{ (lookup('env', 'LAND_API_REDELIVER_PATH') | default('', true) | trim) | default('/SyncLims/Redeliver', true) }}"
    land_api_scheme: "{{ (lookup('env', 'LAND_API_SCHEME') | default('', true) | trim) | default('http', true) }}"
    land_api_port: "{{ ((lookup('env', 'LAND_API_PORT') | default('', true) | trim) | default('8080', true)) | int }}"
    land_api_status_path: "{{ (lookup('env', 'LAND_API_STATUS_PATH') | default('', true) | trim) | default('/SyncLims/QueryStatus', true) }}"
    land_api_token: "{{ (lookup('env', 'LAND_API_TOKEN') | default('', true) | trim) | default('landapi', true) }}"
    land_api_timeout: "{{ ((lookup('env', 'LAND_API_TIMEOUT') | default('', true) | trim) | default('8', true)) | int }}"
    land_api_verify_tls: "{{ ((lookup('env', 'LAND_API_VERIFY_TLS') | default('', true) | trim) | default('true', true)) | bool }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"
    default_cfg: "{{ default_config | default({}) }}"
    device_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"
    merged_cfg: "{{ default_cfg | combine(device_cfg, recursive=True) }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_resolve_device_row.yml"

    - name: 应用本机 TDengine 通道新鲜度
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/tdengine_channel_freshness_for_host.yml"

    - name: 通道数据新鲜 — 健康快路径（跳过 API / WinRM / restart）
      when: td_channel_fresh | default(false) | bool
      block:
        - ansible.builtin.set_fact:
            _land_need_reconfigure: false
        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/check_restart_channel_fresh_callback.yml"
        - name: 通道新鲜 — 结束本主机
          ansible.builtin.meta: end_host


    - name: LAND QueryStatus API（巡检重启首要判定）
      ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/land_api_query_status.yml"

    - name: LAND API 已健康（跳过 restart）
      when: land_api_status_ok | default(false) | bool
      block:
        - name: WinRM 参考探测（仅填写 winrm_status）
          ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_probe_reference_only.yml"
          vars:
            winrm_probe_reference_label: "LAND check_restart API 快路径"

        - name: 登记 Semaphore 状态回调行（API 健康快路径）
          ansible.builtin.set_fact:
            _land_need_reconfigure: false
            semaphore_callback_row:
              hostname: "{{ _sem_display_hostname }}"
              ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
              device_status: healthy
              winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
              api_status: online
              abnormal_reason: ""

        - name: API 健康 — 结束本主机
          ansible.builtin.meta: end_host

    - name: LAND API 未通过 — 标记需要 restart
      ansible.builtin.set_fact:
        _land_need_reconfigure: true
      when: not (land_api_status_ok | default(false) | bool)

    - name: WinRM 建连（含重试）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"

    - name: WinRM 未连通则不再执行本主机后续步骤
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"

    - name: 部署 Windows 启动辅助脚本
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"

    - name: 解析 EXE_DIR（盘符回退）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/resolve_exe_dir_windows.yml"

    - name: 检查 LAND 进程状态
      ansible.windows.win_shell: |
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
      register: _land_process_check
      changed_when: false

    - name: LAND API 2xx 但未达健康 — 参考判定是否 restart
      when:
        - _land_need_reconfigure | default(false) | bool
        - land_api_http_ok | default(false) | bool
        - not (land_api_status_ok | default(false) | bool)
      ansible.builtin.set_fact:
        _land_need_reconfigure: "{{ _land_gate_need | bool }}"
      vars:
        _land_proc_out: "{{ ((_land_process_check | default({})).stdout | default('')) | trim }}"
        _land_gate_need: >-
          {{
            ((_land_proc_out.split('|') | first) != 'RUNNING')
            or (not (land_api_status_ok | default(false) | bool))
          }}

    - name: 标记 restart 已执行（操作记录）
      ansible.builtin.set_fact:
        sem_operation_restart_performed: true
      when: _land_need_reconfigure | default(false) | bool

    - ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/land_config_stop_start.yml"
      when: _land_need_reconfigure | default(false) | bool

  post_tasks:
    - ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _sem_display_hostname }}"
          ip: "{{ _sem_dev.ip | default(inventory_hostname, true) }}"
          device_status: >-
            {{ 'unhealthy' if (host_failure_reason is defined)
               else ('healthy' if not (_land_need_reconfigure | default(false) | bool)
               else ('healthy' if (((_land_process_after_restart.stdout | default('') | trim).split('|') | first) == 'RUNNING') and ((not (land_start_check_api | default(true) | bool)) or (land_api_status_ok | default(false) | bool))
               else 'unhealthy')) }}
          winrm_status: online
          api_status: >-
            {{ 'offline' if (host_failure_reason is defined)
               else ('online' if not (_land_need_reconfigure | default(false) | bool)
               else ('online' if ((not (land_start_check_api | default(true) | bool)) or (land_api_status_ok | default(false) | bool))
               else 'offline')) }}
          abnormal_reason: "{{ host_failure_reason | default('') }}"
      when: semaphore_callback_row is not defined

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_operation_build_record.yml"
      when: semaphore_callback_row is defined

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_profile_tasks_dir: "{{ playbook_dir }}/tasks"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_operation_logs.yml"
