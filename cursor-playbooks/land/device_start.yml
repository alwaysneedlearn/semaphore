---
- name: LAND 启动程序
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/../shared/files"
    sem_debug_tag: LAND
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('C:\\Program Files\\LAND', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    exe_name: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) | default('LHBTS.exe', true) }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('land', true) }}"
    _app_dir_env: "{{ (lookup('env', 'APP_DIR') | default('', true) | trim) }}"
    app_dir: "{{ _app_dir_env if (_app_dir_env | length > 0) else zip_name }}"
    exe_path: "{{ exe_dir ~ '\\' ~ exe_name if app_dir in ['.', ''] else exe_dir ~ '\\' ~ app_dir ~ '\\' ~ exe_name }}"
    zip_path: "{{ (lookup('env', 'ZIP_PATH') | default('', true) | trim) | default('/root/neware/dbwb', true) }}"
    exe_args: "{{ (lookup('env', 'EXE_ARGS') | default('', true) | trim) | default('', true) }}"
    restart_delay: "{{ ((lookup('env', 'RESTART_DELAY') | default('', true) | trim) | default('30', true)) | int }}"
    process_verify_poll_seconds: "{{ ((lookup('env', 'PROCESS_VERIFY_POLL_SECONDS') | default('', true) | trim) | default('5', true)) | int }}"
    process_name: "{{ (lookup('env', 'PROCESS_NAME') | default('', true) | trim) | default((exe_name | regex_replace('\\.exe$', '')), true) }}"
    land_api_scheme: "{{ (lookup('env', 'LAND_API_SCHEME') | default('', true) | trim) | default('http', true) }}"
    land_api_port: "{{ ((lookup('env', 'LAND_API_PORT') | default('', true) | trim) | default('8080', true)) | int }}"
    land_api_status_path: "{{ (lookup('env', 'LAND_API_STATUS_PATH') | default('', true) | trim) | default('/SyncLims/QueryStatus', true) }}"
    land_api_modify_config_path: "{{ (lookup('env', 'LAND_API_MODIFY_CONFIG_PATH') | default('', true) | trim) | default('/SyncLims/ModifyConfig', true) }}"
    land_api_timeout: "{{ ((lookup('env', 'LAND_API_TIMEOUT') | default('', true) | trim) | default('8', true)) | int }}"
    land_api_token: "{{ (lookup('env', 'LAND_API_TOKEN') | default('', true) | trim) | default('landapi', true) }}"
    land_api_verify_tls: "{{ ((lookup('env', 'LAND_API_VERIFY_TLS') | default('', true) | trim) | default('true', true)) | bool }}"
    land_start_check_api: "{{ ((lookup('env', 'LAND_START_CHECK_API') | default('', true) | trim) | default('true', true)) | bool }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"
    default_cfg: "{{ default_config | default({}) }}"
    device_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"
    merged_cfg: "{{ default_cfg | combine(device_cfg, recursive=True) }}"

  tasks:
    - name: WinRM 建连（含重试）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"
    - name: WinRM 未连通则不再执行本主机后续步骤
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"
    - name: 部署 Windows 启动辅助脚本
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/deploy_sem_windows_helper_scripts.yml"
    - name: 解析 EXE_DIR（盘符回退）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/resolve_exe_dir_windows.yml"
    - name: 解析 APP_DIR 与 exe_path（LHBTS / 1 等候选）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/resolve_land_install_path_windows.yml"
    - name: 解析当前设备信息
      ansible.builtin.set_fact:
        _land_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({}) }}"
        _land_target_host: "{{ ((_semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({})).ip | default(inventory_hostname, true)) }}"

    - name: 探测安装路径与运行路径上的程序
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/land_install_exe_probe.yml"

    - name: 检查本地压缩包是否存在
      ansible.windows.win_shell: |
        if (Test-Path "{{ exe_dir }}\\{{ zip_name }}.zip") {
          Write-Output "ZIP_FOUND"
        } else {
          Write-Output "ZIP_NOT_FOUND"
        }
      register: zip_local_check_result
      changed_when: false
      when: _land_needs_zip_install | default(false) | bool

    - name: 创建程序根目录
      ansible.builtin.win_file:
        path: "{{ exe_dir }}"
        state: directory
      when: _land_needs_zip_install | default(false) | bool

    - name: 从服务器复制安装包
      ansible.builtin.win_copy:
        src: "{{ zip_path }}/{{ zip_name }}.zip"
        dest: "{{ exe_dir }}\\{{ zip_name }}.zip"
      register: zip_copy_result
      when: >
        (_land_needs_zip_install | default(false) | bool) and
        (zip_local_check_result is skipped or 'ZIP_NOT_FOUND' in (zip_local_check_result.stdout | default('')))

    - name: 解压前确保 LH 注册表项存在
      block:
        - name: 确保 HKCU\Software\LH\ProjectFlag 存在
          ansible.windows.win_regedit:
            path: HKCU:\SOFTWARE\LH
            name: ProjectFlag
            data: ""
            type: string
            state: present
        - name: 确保 HKCU\Software\LH\ProjectType 存在
          ansible.windows.win_regedit:
            path: HKCU:\SOFTWARE\LH
            name: ProjectType
            data: "0"
            type: string
            state: present
      when: _land_needs_zip_install | default(false) | bool

    - name: 解压程序包
      ansible.windows.win_shell: |
        $zipPath = "{{ exe_dir }}\\{{ zip_name }}.zip"
        $destDir = "{{ exe_dir }}"
        try {
          Expand-Archive -Path $zipPath -DestinationPath $destDir -Force
          Write-Output "EXTRACT_OK"
        } catch {
          Write-Output "EXTRACT_ERROR:$($_.Exception.Message)"
        }
      register: extract_result
      failed_when: >
        extract_result is defined and 'stdout' in extract_result and
        'EXTRACT_ERROR' in extract_result.stdout
      when: _land_needs_zip_install | default(false) | bool

    - name: 解压后切换到安装目录（如 F:\LHBTS）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/land_use_install_path_after_extract.yml"
      when: _land_needs_zip_install | default(false) | bool

    - name: 重新检查 LAND 安装目录程序
      ansible.windows.win_stat:
        path: "{{ install_exe_path }}"
      register: _land_exe_stat_after_extract
      when: _land_needs_zip_install | default(false) | bool

    - name: 前置检查：检查 LAND 进程状态
      ansible.windows.win_shell: |
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
      register: _land_process_check
      changed_when: false
      when: (_land_has_executable | default(false) | bool) or (_land_exe_stat_after_extract.stat.exists | default(false) | bool)

    - name: 前置检查：查询 LAND API 状态
      ansible.builtin.uri:
        url: "{{ land_api_scheme }}://{{ _land_target_host }}:{{ land_api_port }}{{ land_api_status_path }}"
        method: POST
        body_format: json
        body:
          token: "{{ land_api_token }}"
        timeout: "{{ land_api_timeout }}"
        validate_certs: "{{ land_api_verify_tls }}"
        return_content: true
        status_code: [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]
      register: _land_api_check
      delegate_to: localhost
      failed_when: false
      when: (_land_has_executable | default(false) | bool) or (_land_exe_stat_after_extract.stat.exists | default(false) | bool)

    - name: 状态判断：判定是否需要重配
      ansible.builtin.set_fact:
        need_reconfigure: >-
          {{
            (not ((_land_has_executable | default(false) | bool) or (_land_exe_stat_after_extract.stat.exists | default(false) | bool)))
            or ('RUNNING' not in (_land_process_check.stdout | default('')))
            or ((land_start_check_api | bool) and (not (((_land_api_check.status | default(0) | int) >= 200) and ((_land_api_check.status | default(0) | int) < 300))))
          }}

    - name: 获取当前登录用户（用于交互式计划任务）
      ansible.windows.win_shell: |
        $explorerUser = Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
          ForEach-Object {
            $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
            if ($o -and $o.ReturnValue -eq 0 -and $o.User) { $o.User.Trim() }
          } |
          Where-Object { $_ } |
          Select-Object -First 1
        if ($explorerUser) {
          Write-Output $explorerUser
        } else {
          Write-Output "{{ hostvars[inventory_hostname].ansible_user | default('Administrator') }}"
        }
      register: get_username_result
      changed_when: false
      when: need_reconfigure | default(true) | bool

    - name: 规范化启动用户
      ansible.builtin.set_fact:
        _reconfig_profile_user: "{{ (get_username_result.stdout_lines | default([]) | last | default(get_username_result.stdout | default(''))) | trim }}"
      when: need_reconfigure | default(true) | bool

    - name: 程序运行中：API 修改配置（启动前，进程已在跑时）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/land_api_modify_config_before_stop.yml"
      when: >-
        (need_reconfigure | default(true) | bool)
        and (merged_cfg.SystemConfig | default({}) | length) > 0
        and 'RUNNING' in (_land_process_check.stdout | default(""))

    - name: 初始化停止前改配置结果（进程未运行，启动后再试）
      ansible.builtin.set_fact:
        _land_modify_config_before_ok: false
      when: >-
        (need_reconfigure | default(true) | bool)
        and (merged_cfg.SystemConfig | default({}) | length) > 0
        and 'RUNNING' not in (_land_process_check.stdout | default(""))

    - name: 启动 LAND 程序（管理员交互式计划任务）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/reconfig_start_program_windows.yml"
      when:
        - need_reconfigure | default(true) | bool
        - _land_has_executable | default(false) | bool

    - name: 启动 LAND 程序（解压后）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/reconfig_start_program_windows.yml"
      when: >
        (need_reconfigure | default(true) | bool) and
        (_land_needs_zip_install | default(false) | bool) and
        (_land_exe_stat_after_extract.stat.exists | default(false))

    - name: 启动后确认进程状态
      ansible.windows.win_shell: |
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $p) { "RUNNING" } else { "NOT_RUNNING" }
      register: _land_process_after_start
      changed_when: false
      when:
        - need_reconfigure | default(true) | bool
        - (_land_has_executable | default(false) | bool) or (_land_exe_stat_after_extract.stat.exists | default(false) | bool)

    - name: 启动后查询 LAND API 状态（可选）
      ansible.builtin.uri:
        url: "{{ land_api_scheme }}://{{ _land_target_host }}:{{ land_api_port }}{{ land_api_status_path }}"
        method: POST
        body_format: json
        body:
          token: "{{ land_api_token }}"
        timeout: "{{ land_api_timeout }}"
        validate_certs: "{{ land_api_verify_tls }}"
        return_content: true
        status_code: [200, 201, 204, 400, 401, 403, 404, 500, 502, 503]
      register: _land_api_after_start
      delegate_to: localhost
      failed_when: false
      when:
        - land_start_check_api | bool
        - (_land_has_executable | default(false) | bool) or (_land_exe_stat_after_extract.stat.exists | default(false) | bool)
        - (need_reconfigure | default(true) | bool)

    - name: 启动后：API 修改配置（停止前失败或未尝试时重试）
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/land_api_modify_config_after_start_retry.yml"
      when:
        - need_reconfigure | default(true) | bool
        - (merged_cfg.SystemConfig | default({}) | length) > 0

    - name: 无需重配时复用前置检查状态
      when: not (need_reconfigure | default(false) | bool)
      ansible.builtin.set_fact:
        _land_process_after_start: "{{ _land_process_check }}"
        _land_api_after_start: "{{ _land_api_check }}"

    - name: 登记 LAND 启动回调行
      ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _land_dev.hostname | default('', true) }}"
          ip: "{{ _land_dev.ip | default(inventory_hostname, true) }}"
          device_status: "{{ 'healthy' if ((_land_has_executable | default(false) | bool) or (_land_exe_stat_after_extract.stat.exists | default(false) | bool)) and ('RUNNING' in (_land_process_after_start.stdout | default(''))) and ((not (land_start_check_api | bool)) or ((_land_api_after_start.status | default(0) | int) >= 200 and (_land_api_after_start.status | default(0) | int) < 300)) else 'unhealthy' }}"
          winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
          api_status: "{{ 'online' if ((not (land_start_check_api | bool)) or ((_land_api_after_start.status | default(0) | int) >= 200 and (_land_api_after_start.status | default(0) | int) < 300)) else 'offline' }}"
          abnormal_reason: >-
            {% if not ((_land_has_executable | default(false) | bool) or (_land_exe_stat_after_extract.stat.exists | default(false) | bool)) %}Executable not found: {{ exe_path }}
            {% elif 'RUNNING' not in (_land_process_after_start.stdout | default('')) %}Start failed: process not running
            {% elif (land_start_check_api | bool) and not (((_land_api_after_start.status | default(0) | int) >= 200) and ((_land_api_after_start.status | default(0) | int) < 300)) %}API check failed after start: http={{ _land_api_after_start.status | default('n/a') }}
            {% else %}{% endif %}

    - name: DEBUG LAND 启动结果
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/debug_sync_api_start_snapshot.yml"

  post_tasks:
    - name: 写回 Semaphore 设备状态（post_tasks）
      run_once: true
      delegate_to: localhost
      block:
        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
- name: 写回 Semaphore 设备状态（独立 play）
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/../shared/files"
  tasks:
    - name: 执行 bulk 回调
      ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"