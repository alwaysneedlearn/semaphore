---
- name: 生成所有主机程序运行状态总览
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars:
    # Variable Group 环境变量（非空）优先，否则使用下列默认值
    exe_name: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) | default('uu', true) }}"
    exe_dir_preferred: "{{ (lookup('env', 'EXE_DIR') | default('', true) | trim) | default('D:\\Program Files\\NEWARE', true) }}"
    exe_dir: "{{ exe_dir_preferred }}"
    zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('test', true) }}"
    log_success_keyword: "{{ (lookup('env', 'LOG_SUCCESS_KEYWORD') | default('', true) | trim) | default('提示 本轮通道状态上传成功', true) }}"
    # 日志状态检查：仅统计最近 N 分钟内的日志行
    log_health_recent_minutes: "{{ ((lookup('env', 'LOG_HEALTH_RECENT_MINUTES') | default('', true) | trim) | default('8', true)) | int }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - name: WinRM 建连（含重试，须在其它 win_* 任务之前）
      ansible.builtin.include_tasks: tasks/winrm_ensure_reachable.yml

    - name: 一次性部署 Windows 辅助脚本
      ansible.builtin.include_tasks: tasks/deploy_sem_windows_helper_scripts.yml

    - name: 解析 EXE_DIR（目标盘符 D→E→C）
      block:
        - ansible.builtin.include_tasks: tasks/resolve_exe_dir_windows.yml
      ignore_unreachable: true

    - name: 采集进程状态信息
      block:
        - ansible.builtin.include_tasks: tasks/collect_process_status_windows.yml
        - ansible.builtin.set_fact:
            status: "{{ _sem_process_status }}"
      ignore_unreachable: true

    - name: 状态判断：输出程序状态
      ansible.builtin.debug:
        msg: "[程序状态] {{ status.stdout | trim }}"
      when: >
        not (status.unreachable | default(false)) and
        status is defined and
        'stdout' in status

    - name: 登记 Semaphore 回调行（不可达，须在 end_host 之前）
      ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ (_sem_dev | default({})).hostname | default(inventory_hostname, true) }}"
          ip: "{{ (_sem_dev | default({})).ip | default(inventory_hostname, true) }}"
          device_status: unhealthy
          winrm_status: offline
          api_status: offline
          abnormal_reason: "{{ 'WinRM unreachable: ' ~ (status.msg | default('connection failed') | string) }}"
      vars:
        _sem_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"
      when: status.unreachable | default(false)

    - name: 跳过不可达主机
      ansible.builtin.meta: end_host
      when: status.unreachable | default(false)

    - name: 进程未运行时标记异常（需重配/关注）
      ansible.builtin.set_fact:
        need_reconfigure: true
        log_status_ok: false
      when: >
        status is defined and
        'stdout' in status and
        'NOT_RUNNING' in status.stdout

    - name: WinRM 中途建连（日志状态检查前）
      ansible.builtin.include_tasks: tasks/winrm_refresh_midplay.yml
      when: >
        status is defined and
        'stdout' in status and
        'NOT_RUNNING' not in status.stdout
      vars:
        winrm_refresh_label: "WinRM 中途建连（日志状态检查前）"

    - name: 状态判断：日志健康检查与综合判定
      when: >
        status is defined and
        'stdout' in status and
        'NOT_RUNNING' not in status.stdout
      block:
        - ansible.builtin.include_tasks: tasks/log_health_check_windows.yml

        - ansible.builtin.include_tasks: tasks/health_gate_need_reconfigure_from_log.yml

        - name: 输出综合判断结果（含程序状态）
          ansible.builtin.debug:
            msg: >
              [综合判断] 程序状态={{ status.stdout | trim | regex_search('^[^|]+') }} |
              日志_OK={{ log_status_ok | default('n/a') }} |
              异常/需关注={{ need_reconfigure }}

    # 不传 rdp_status（**Probe** 维护 RDP TCP）。api_status：进程在跑且日志关键字命中 → online；否则 offline。
    - name: 登记 Semaphore 状态回调行（Patrol/巡检结束后 PUT bulk）
      when: not (status.unreachable | default(false))
      ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ (_sem_dev | default({})).hostname | default(inventory_hostname, true) }}"
          ip: "{{ (_sem_dev | default({})).ip | default(inventory_hostname, true) }}"
          device_status: >-
            {% if status is not defined or ('stdout' not in status) %}unhealthy
            {% elif 'NOT_RUNNING' in (status.stdout | default('')) %}unhealthy
            {% elif need_reconfigure is defined and need_reconfigure | bool %}unhealthy
            {% else %}healthy{% endif %}
          winrm_status: "{{ 'offline' if (log_check_result is defined and (log_check_result.unreachable | default(false))) else 'online' }}"
          api_status: >-
            {% if status is not defined or ('stdout' not in status) %}offline
            {% elif 'NOT_RUNNING' in (status.stdout | default('')) %}offline
            {% elif need_reconfigure is defined and not (need_reconfigure | bool) %}online
            {% else %}offline{% endif %}
          abnormal_reason: >-
            {% if 'NOT_RUNNING' in (status.stdout | default('')) %}Process not running
            {% elif log_check_result is defined and (log_check_result.unreachable | default(false)) %}WinRM unreachable during log status check
            {% elif need_reconfigure is defined and need_reconfigure | bool %}Health check: log keyword missing or not recent (need reconfigure)
            {% else %}{% endif %}
      vars:
        _sem_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"

  post_tasks:
    - name: 生成状态报告
      when: ansible_play_hosts_all is defined and (ansible_play_hosts_all | length) > 0
      run_once: true
      delegate_to: localhost
      block:
        - ansible.builtin.include_tasks: tasks/build_device_status_report.yml
          vars:
            status_report_hosts: "{{ ansible_play_hosts_all }}"
            status_report_exe_name: "{{ hostvars[ansible_play_hosts_all[0]].exe_name | default('NWReport_DBWB') }}"
        - name: 生成状态报告
          ansible.builtin.debug:
            msg: "{{ _status_report_msg_lines }}"

    - name: 写回 Semaphore 设备状态（post_tasks，避免 unreachable exit 4 跳过独立 localhost play）
      ansible.builtin.include_tasks: tasks/semaphore_bulk_put_from_hostvars.yml
      run_once: true
      delegate_to: localhost
