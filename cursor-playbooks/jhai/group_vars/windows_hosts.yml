---
# JHAI Windows service + HTTP API defaults (see jhai/vars/service_layout.yml).
# SERVICE_NAME = exe file base name; JHAI_SERVICE_NAME = Windows service name (win_service).

service_name: "{{ (lookup('env', 'JHAI_SERVICE_NAME') | default('', true) | trim) | default('UploaderServiceDaemon', true) }}"
service_base_dir: "{{ (lookup('env', 'JHAI_SERVICE_PATH') | default(lookup('env', 'SERVICE_PATH') | default('', true), true) | trim) | default('D:\\BTS', true) }}"
service_exe_name: >-
  {{
    (
      (lookup('env', 'SERVICE_NAME') | default('', true) | trim)
      | regex_replace('(?i)\\.exe$', '')
    )
    ~ '.exe'
    if ((lookup('env', 'SERVICE_NAME') | default('', true) | trim) | length > 0)
    else 'BTS.Uploader.Service.exe'
  }}
service_path: "{{ service_base_dir }}"
install_path: "{{ service_base_dir }}\\{{ service_exe_name }}"
service_parent_dir: "{{ service_base_dir }}"

jhai_api_scheme: "{{ (lookup('env', 'JHAI_API_SCHEME') | default('', true) | trim) | default('http', true) }}"
jhai_api_port: "{% set hp = hostvars[inventory_hostname].api_port | default(0) %}{% if (hp | int) > 0 %}{{ hp | int }}{% else %}{{ (lookup('env', 'JHAI_API_PORT') | default(lookup('env', 'API_PORT') | default('', true), true) | trim) | default('9002', true) | int }}{% endif %}"
jhai_api_upload_status_path: "{{ (lookup('env', 'JHAI_API_UPLOAD_STATUS_PATH') | default('', true) | trim) | default('/api/get_upload_status', true) }}"
jhai_api_modify_kafka_path: "{{ (lookup('env', 'JHAI_API_MODIFY_KAFKA_PATH') | default('', true) | trim) | default('/api/modify_kafka_configuration', true) }}"
jhai_api_resend_part_path: "{{ (lookup('env', 'JHAI_API_RESEND_PART_PATH') | default('', true) | trim) | default('/api/resend_data_part', true) }}"
jhai_api_resend_all_path: "{{ (lookup('env', 'JHAI_API_RESEND_ALL_PATH') | default('', true) | trim) | default('/api/resend_data_all', true) }}"
jhai_api_timeout: "{{ ((lookup('env', 'JHAI_API_TIMEOUT') | default('', true) | trim) | default('15', true)) | int }}"
jhai_api_verify_tls: "{{ ((lookup('env', 'JHAI_API_VERIFY_TLS') | default('', true) | trim) | default('true', true)) | bool }}"
jhai_start_check_api: "{{ ((lookup('env', 'JHAI_START_CHECK_API') | default('', true) | trim) | default('true', true)) | bool }}"
jhai_stop_check_api: "{{ ((lookup('env', 'JHAI_STOP_CHECK_API') | default('', true) | trim) | default('false', true)) | bool }}"
jhai_service_scan_max_depth: "{{ ((lookup('env', 'JHAI_SERVICE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('3', true)) | int }}"
jhai_service_scan_latest: "{{ ((lookup('env', 'JHAI_SERVICE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool }}"
jhai_upload_status_start_poll_retries: "{{ ((lookup('env', 'JHAI_UPLOAD_STATUS_START_POLL_RETRIES') | default('', true) | trim) | default('6', true)) | int }}"
jhai_upload_status_start_poll_delay: "{{ ((lookup('env', 'JHAI_UPLOAD_STATUS_START_POLL_DELAY') | default('', true) | trim) | default('10', true)) | int }}"
jhai_include_config_apis: false
jhai_include_resend_data: false
jhai_service_stop_first: true
