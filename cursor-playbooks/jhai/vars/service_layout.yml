---
# JHAI service install layout.
# SERVICE_NAME = exe file (BTS.Uploader.Service.exe); JHAI_SERVICE_NAME = Windows service (UploaderServiceDaemon).
# SERVICE_PATH / JHAI_SERVICE_PATH = parent directory to search under.

service_name: "{{ (lookup('env', 'JHAI_SERVICE_NAME') | default('', true) | trim) | default('UploaderServiceDaemon', true) }}"
service_base_dir: "{{ (lookup('env', 'JHAI_SERVICE_PATH') | default(lookup('env', 'SERVICE_PATH') | default('', true), true) | trim) | default('D:\\BTS', true) }}"
service_exe_name: >-
  {{
    (
      (lookup('env', 'SERVICE_NAME') | default('', true) | trim)
      | regex_replace('(?i)\\.exe$', '')
    )
    ~ '.exe'
    if ((lookup('env', 'SERVICE_NAME') | default('', true) | trim) | length > 0)
    else 'BTS.Uploader.Service.exe'
  }}
service_path: "{{ service_base_dir }}"
install_path: "{{ service_base_dir }}\\{{ service_exe_name }}"
service_parent_dir: "{{ service_base_dir }}"
zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('jhai.zip', true) }}"
zip_path: "{{ (lookup('env', 'ZIP_PATH') | default('', true) | trim) | default('/root/jhai/pkg', true) }}"
redeploy_zip_dest: "{{ service_parent_dir }}\\{{ zip_name }}"
redeploy_zip_src: "{{ zip_path }}/{{ zip_name }}"
redeploy_extract_dest: "{{ service_parent_dir }}"
jhai_service_scan_max_depth: "{{ ((lookup('env', 'JHAI_SERVICE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('3', true)) | int }}"
jhai_service_scan_latest: "{{ ((lookup('env', 'JHAI_SERVICE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool }}"
