---
# After service start: poll POST /api/get_upload_status until HTTP 200 and JSON code==200.

- name: 启动后轮询 JHAI 上传心跳（get_upload_status）
  ansible.builtin.uri:
    url: "{{ jhai_api_scheme }}://{{ _jhai_target_host }}:{{ jhai_api_port }}{{ jhai_api_upload_status_path }}"
    method: POST
    body_format: json
    body: {}
    timeout: "{{ jhai_api_timeout }}"
    validate_certs: "{{ jhai_api_verify_tls }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  register: _jhai_upload_status
  delegate_to: localhost
  failed_when: false
  until: >
    _jhai_upload_status is defined and
    (_jhai_upload_status.status | default(0) | int) == 200 and
    (_jhai_upload_status.content | default('') | regex_search('\"code\"\\s*:\\s*200'))
  retries: "{{ jhai_upload_status_start_poll_retries | default(6) | int }}"
  delay: "{{ jhai_upload_status_start_poll_delay | default(10) | int }}"

- name: JHAI 解析启动后轮询响应
  ansible.builtin.include_tasks: jhai_parse_api_response.yml
  vars:
    _jhai_uri_result: "{{ _jhai_upload_status }}"

- name: JHAI 登记启动后轮询结果
  ansible.builtin.set_fact:
    jhai_upload_status_http_ok: "{{ _jhai_api_http_ok | bool }}"
    jhai_upload_status_code: "{{ _jhai_api_code }}"
    jhai_upload_status_msg: "{{ _jhai_api_msg }}"
    jhai_upload_status_ok: "{{ _jhai_api_ok | bool }}"
    _jhai_api_status: "{{ _jhai_upload_status }}"

- name: DEBUG JHAI 启动后上传心跳轮询
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('JHAI') }}] upload_status_poll retries={{ jhai_upload_status_start_poll_retries | default(6) }} delay_s={{ jhai_upload_status_start_poll_delay | default(10) }}"
      - "[DEBUG-{{ sem_debug_tag | default('JHAI') }}] upload_status_poll attempts={{ _jhai_upload_status.attempts | default(1) }}"
      - "[DEBUG-{{ sem_debug_tag | default('JHAI') }}] upload_status_poll http_ok={{ jhai_upload_status_http_ok | default(false) }} code={{ jhai_upload_status_code | default('n/a') }} ok={{ jhai_upload_status_ok | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('JHAI') }}] upload_status_poll msg={{ jhai_upload_status_msg | default('') | truncate(120, True) }}"
  when: _jhai_upload_status is defined
