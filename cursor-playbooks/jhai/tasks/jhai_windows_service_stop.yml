---
# Stop JHAI Windows service. Vars: service_name.

- name: 停止 JHAI Windows 服务
  ansible.windows.win_service:
    name: "{{ service_name }}"
    state: stopped
  register: _jhai_service_stop_action

- name: 确认 JHAI 服务已停止
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/jhai_windows_service_status.yml"
