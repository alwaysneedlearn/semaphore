---
# POST /api/modify_kafka_configuration — no service restart.

- name: 准备 JHAI 配置分类
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/jhai_prepare_merged_cfg.yml"
  when: jhai_modify_kafka_cfg is not defined

- name: JHAI 修改 Kafka 配置（HTTP API）
  ansible.builtin.uri:
    url: "{{ jhai_api_scheme }}://{{ _jhai_target_host }}:{{ jhai_api_port }}{{ jhai_api_modify_kafka_path }}"
    method: POST
    body_format: json
    body:
      kafkaConnectionInfo: "{{ jhai_modify_kafka_cfg.kafkaConnectionInfo | default('') | trim }}"
    timeout: "{{ jhai_api_timeout }}"
    validate_certs: "{{ jhai_api_verify_tls }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  register: _jhai_api_modify_kafka
  delegate_to: localhost
  failed_when: false
  when: (jhai_modify_kafka_cfg.kafkaConnectionInfo | default('') | trim) | length > 0

- name: JHAI 解析修改 Kafka 响应
  ansible.builtin.include_tasks: jhai_parse_api_response.yml
  vars:
    _jhai_uri_result: "{{ _jhai_api_modify_kafka }}"
  when:
    - _jhai_api_modify_kafka is defined
    - not (_jhai_api_modify_kafka.skipped | default(false))

- name: JHAI 登记修改 Kafka 结果
  ansible.builtin.set_fact:
    jhai_modify_kafka_http_ok: "{{ _jhai_api_http_ok | bool }}"
    jhai_modify_kafka_code: "{{ _jhai_api_code }}"
    jhai_modify_kafka_msg: "{{ _jhai_api_msg }}"
    jhai_modify_kafka_ok: "{{ _jhai_api_ok | bool }}"
  when:
    - _jhai_api_modify_kafka is defined
    - not (_jhai_api_modify_kafka.skipped | default(false))

- name: DEBUG JHAI 修改 Kafka 配置结果
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('JHAI') }}] modify_kafka http={{ _jhai_api_modify_kafka.status | default('skipped') }}"
      - "[DEBUG-{{ sem_debug_tag | default('JHAI') }}] modify_kafka code={{ jhai_modify_kafka_code | default('n/a') }} ok={{ jhai_modify_kafka_ok | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('JHAI') }}] modify_kafka msg={{ jhai_modify_kafka_msg | default('') | truncate(200, True) }}"
      - "[DEBUG-{{ sem_debug_tag | default('JHAI') }}] modify_kafka body={{ _jhai_api_modify_kafka.content | default('') | truncate(800, True) }}"
  when:
    - _jhai_api_modify_kafka is defined
    - not (_jhai_api_modify_kafka.skipped | default(false))
