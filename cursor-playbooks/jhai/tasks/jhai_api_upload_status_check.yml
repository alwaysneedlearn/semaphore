---
# POST /api/get_upload_status — upload heartbeat. Sets _jhai_upload_status, jhai_upload_status_*.

- name: JHAI 查询上传心跳（get_upload_status）
  ansible.builtin.uri:
    url: "{{ jhai_api_scheme }}://{{ _jhai_target_host }}:{{ jhai_api_port }}{{ jhai_api_upload_status_path }}"
    method: POST
    body_format: json
    body: {}
    timeout: "{{ jhai_api_timeout }}"
    validate_certs: "{{ jhai_api_verify_tls }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  register: _jhai_upload_status
  delegate_to: localhost
  failed_when: false

- name: JHAI 解析上传心跳 JSON
  ansible.builtin.set_fact:
    jhai_upload_status_http_ok: "{{ _hb_http_ok | bool }}"
    jhai_upload_status_code: "{{ _hb_api_code }}"
    jhai_upload_status_msg: "{{ _hb_api_msg }}"
    jhai_upload_status_ok: "{{ _hb_ok | bool }}"
    _jhai_api_status: "{{ _jhai_upload_status }}"
  vars:
    _hb_http_ok: "{{ (_jhai_upload_status.status | default(0) | int) == 200 }}"
    _hb_body: "{{ _jhai_upload_status.content | default('') | string }}"
    _hb_code_match: "{{ _hb_body | regex_search('\"code\"\\s*:\\s*([0-9]+)') }}"
    _hb_api_code: "{{ (_hb_code_match | default('') | regex_replace('^.*:\\s*', '') | trim) if (_hb_code_match | default('') | length > 0) else '-1' }}"
    _hb_api_msg: "{{ (_hb_body | regex_search('\"msg\"\\s*:\\s*\"([^\"]*)\"') | default('') | regex_replace('^.*\"msg\"\\s*:\\s*\"', '') | regex_replace('\"$', '')) }}"
    _hb_ok: "{{ (_hb_http_ok | bool) and ((_hb_api_code | int) == 200) }}"
  failed_when: false
