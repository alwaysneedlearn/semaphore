---
# POST /api/get_upload_status — upload heartbeat. Sets jhai_upload_status_*.

- name: JHAI 查询上传心跳（get_upload_status）
  ansible.builtin.uri:
    url: "{{ jhai_api_scheme }}://{{ _jhai_target_host }}:{{ jhai_api_port }}{{ jhai_api_upload_status_path }}"
    method: POST
    body_format: json
    body: {}
    timeout: "{{ jhai_api_timeout }}"
    validate_certs: "{{ jhai_api_verify_tls }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  register: _jhai_upload_status
  delegate_to: localhost
  failed_when: false

- name: JHAI 解析上传心跳响应
  ansible.builtin.include_tasks: jhai_parse_api_response.yml
  vars:
    _jhai_uri_result: "{{ _jhai_upload_status }}"

- name: JHAI 登记上传心跳结果
  ansible.builtin.set_fact:
    jhai_upload_status_http_ok: "{{ _jhai_api_http_ok | bool }}"
    jhai_upload_status_code: "{{ _jhai_api_code }}"
    jhai_upload_status_msg: "{{ _jhai_api_msg }}"
    jhai_upload_status_ok: "{{ _jhai_api_ok | bool }}"
    _jhai_api_status: "{{ _jhai_upload_status }}"
