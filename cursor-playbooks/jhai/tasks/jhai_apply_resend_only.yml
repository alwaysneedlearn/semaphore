---
# JHAI resend-only HTTP APIs (no Kafka modify, no service restart).

- name: JHAI 分段重传（HTTP API）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/jhai_api_resend_data_part.yml"
  when: jhai_resend_part_requested | default(false) | bool

- name: JHAI 全量重传（HTTP API）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/jhai_api_resend_data_all.yml"
  when: jhai_resend_all_requested | default(false) | bool

- name: JHAI 汇总重传 API 结果
  ansible.builtin.set_fact:
    jhai_config_apis_ok: "{{ _jhai_resend_only_ok | bool }}"
  vars:
    _jhai_resend_only_ok: >-
      {{
        (jhai_resend_all_ok | default(false) | bool)
        if (jhai_resend_all_requested | default(false) | bool)
        else (jhai_resend_part_ok | default(false) | bool)
      }}
