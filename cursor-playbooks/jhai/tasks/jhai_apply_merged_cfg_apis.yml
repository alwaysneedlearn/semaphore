---
# Apply Kafka / resend HTTP APIs from merged_cfg (never restarts the Windows service).

- name: 准备 JHAI 合并配置（Kafka / 重传分类）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/jhai_prepare_merged_cfg.yml"

- name: JHAI 应用配置（Kafka / 重传，仅 HTTP API）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/jhai_api_modify_kafka.yml"

- name: JHAI 分段重传（HTTP API）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/jhai_api_resend_data_part.yml"
  when: jhai_resend_part_requested | default(false) | bool

- name: JHAI 全量重传（HTTP API）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/jhai_api_resend_data_all.yml"

- name: JHAI 汇总配置 API 结果
  ansible.builtin.set_fact:
    jhai_config_apis_ok: "{{ _jhai_cfg_apis_ok | bool }}"
  vars:
    _jhai_cfg_apis_ok: >-
      {{
        (jhai_modify_kafka_ok is not defined or (jhai_modify_kafka_ok | default(false) | bool))
        and (jhai_resend_part_ok is not defined or (jhai_resend_part_ok | default(false) | bool))
        and (jhai_resend_all_ok is not defined or (jhai_resend_all_ok | default(false) | bool))
      }}
