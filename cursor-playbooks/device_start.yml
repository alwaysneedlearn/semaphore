---
- name: 巡检程序运行状态并通过 API 启动数据上报
  hosts: windows_hosts
  gather_facts: no
  vars:
    exe_name: "{{ lookup('env', 'EXE_NAME') | default('uu') }}"
    exe_dir: "{{ lookup('env', 'EXE_DIR') | default('C:\\Program Files\\NEWARE') }}"
    zip_name: "{{ lookup('env', 'ZIP_NAME') | default('test') }}"
    exe_path: "{{ exe_dir }}\\{{ zip_name }}\\{{ exe_name }}.exe"
    zip_path: "{{ lookup('env', 'ZIP_PATH') | default('/root/neware/dbwb') }}"
    exe_args: "{{ lookup('env', 'EXE_ARGS') | default('') }}"
    config_file_name: "{{ lookup('env', 'CONFIG_FILE_NAME') | default('NWReport_DBWB.iconf') }}"
    api_host: "{{ inventory_hostname }}"
    api_port: "{{ lookup('env', 'API_PORT') | default('9002') }}"
    api_status_call_type: 1
    api_start_call_type: 1000
    api_timeout_seconds: 15
    api_expected_response_code: "{{ lookup('env', 'API_EXPECTED_RESPONSE_CODE') | default('0') }}"
    api_expected_exec_success_code: "{{ lookup('env', 'API_EXPECTED_EXEC_SUCCESS_CODE') | default('0') }}"
    export_not_started: "{{ lookup('env', 'EXPORT_NOT_STARTED') | default('1', true) }}"
    export_starting: "{{ lookup('env', 'EXPORT_STARTING') | default('2', true) }}"
    export_started: "{{ lookup('env', 'EXPORT_STARTED') | default('3', true) }}"
    poll_retries: "{{ (lookup('env', 'POLL_RETRIES') | int > 0) | ternary(lookup('env', 'POLL_RETRIES'), '3') | int }}"
    poll_delay: "{{ (lookup('env', 'POLL_DELAY') | int > 0) | ternary(lookup('env', 'POLL_DELAY'), '10') | int }}"
    his_data_from_time: "${his_data_from_time}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"
    default_cfg: "{{ default_config | default({}) }}"
    device_cfg: "{{ ((configs_by_host | default({}))[inventory_hostname] | default((configs_by_hostname | default({}))[inventory_hostname], true) | default(config | default({}), true)) }}"
    merged_cfg: "{{ default_cfg | combine(device_cfg, recursive=True) }}"
    merged_system_config: "{{ (default_cfg.SystemConfig | default({})) | combine(device_cfg.SystemConfig | default({}), recursive=True) }}"
    merged_cfg_json: "{{ merged_cfg | to_json }}"
    log_path: "{{ exe_dir }}\\{{ zip_name }}\\LogData\\NWReport_DBWB{{ lookup('pipe', 'date +%Y%m%d') }}.log"
    log_success_keyword: "提示 本轮通道状态上传成功"
    log_tail_lines: 50
    log_poll_retries: 6
    log_poll_delay: 10

  tasks:
    - name: 前置检查：检查程序运行状态
      win_shell: |
        $proc = Get-Process -Name "{{ exe_name }}" -ErrorAction SilentlyContinue
        if ($proc) {
          $info = $proc | Select-Object Id, @{N='Memory_MB';E={[math]::Round($_.WorkingSet64/1MB,2)}}, StartTime
          $info | ForEach-Object {
            Write-Output "RUNNING|PID:$($_.Id)|Memory:$($_.Memory_MB)MB|Started:$($_.StartTime)"
          }
        } else {
          Write-Output "NOT_RUNNING"
        }
      register: check_result
      changed_when: false
      ignore_unreachable: true

    - name: 登记 Semaphore 回调行（不可达，须在 end_host 之前）
      ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ (_sem_dev | default({})).hostname | default(inventory_hostname, true) }}"
          device_status: unknown
          rdp_status: offline
          winrm_status: offline
          abnormal_reason: "{{ 'WinRM unreachable: ' ~ (check_result.msg | default('connection failed') | string) }}"
      vars:
        _sem_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"
      when: check_result.unreachable | default(false)

    - name: 前置检查：跳过不可达主机
      ansible.builtin.meta: end_host
      when: check_result.unreachable | default(false)

    - name: 进程未运行时标记需要执行启动/重配流程
      ansible.builtin.set_fact:
        need_reconfigure: true
      when: >
        check_result is defined and 'stdout' in check_result and
        'NOT_RUNNING' in check_result.stdout

    - name: 状态判断：综合判断是否需要重配
      when: >
        check_result is defined and
        'stdout' in check_result and
        'NOT_RUNNING' not in check_result.stdout
      block:
        - name: 状态判断：输出程序状态
          ansible.builtin.debug:
            msg: "[程序状态] {{ check_result.stdout | trim }}"
          when: check_result is defined and 'stdout' in check_result

        - name: 状态判断：调用API查询上报状态
          ansible.builtin.uri:
            url: "http://{{ api_host }}:{{ api_port }}"
            method: "POST"
            body_format: json
            body:
              CallType: "{{ api_status_call_type | int }}"
            headers:
              Content-Type: "application/json; charset=utf-8"
            return_content: true
            status_code: 200
            timeout: "{{ api_timeout_seconds | int }}"
          register: api_status_result
          delegate_to: localhost
          when: >
            check_result is defined and
            'stdout' in check_result and
            'NOT_RUNNING' not in check_result.stdout
          failed_when: false

        - name: 状态判断：DEBUG 打印状态 API 响应（成功也打印）
          ansible.builtin.debug:
            msg:
              - "[DEBUG-API] 状态判断 POST url=http://{{ api_host }}:{{ api_port }} CallType={{ api_status_call_type }}"
              - "[DEBUG-API] 状态判断 http_status={{ api_status_result.status | default('n/a') }}"
              - "[DEBUG-API] 状态判断 response_body={{ api_status_result.content | default('') }}"
          when: api_status_result is defined and not (api_status_result.skipped | default(false))

        - name: 状态判断：解析API响应
          ansible.builtin.set_fact:
            api_status_ok: >-
              {{
                api_status_result is defined and
                not (api_status_result.skipped | default(false)) and
                api_status_result.status | default(0) | int == 200 and
                ((api_status_result.content | from_json).ResponeResultCode | default(-1) | int == api_expected_response_code | int) and
                ((api_status_result.content | from_json).ExecResultCode | default(-1) | int == api_expected_exec_success_code | int)
              }}
            is_export_started: >-
              {{
                api_status_result is defined and
                not (api_status_result.skipped | default(false)) and
                api_status_result.status | default(0) | int == 200 and
                ((api_status_result.content | from_json).ExecResultData | default(-1) | int) == (export_started | int)
              }}

        - name: 状态判断：检查日志上报状态
          win_shell: |
            $logDir = "{{ exe_dir }}\\{{ zip_name }}\\LogData"
            $logFiles = Get-ChildItem -Path $logDir -Filter "NWReport_DBWB*.log" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^NWReport_DBWB\d{8}\.log$' } | Sort-Object LastWriteTime -Descending
            if ($logFiles -and $logFiles.Count -gt 0) {
              $latestLog = $logFiles[0].FullName
              $content = Get-Content $latestLog | Where-Object {
                $logDate = ($_ -match '^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})') | Out-Null
                $logTime = $matches[1]
                $logTime = [datetime]::ParseExact($logTime, "yyyy-MM-dd HH:mm:ss", $null)
                $currentTime = (Get-Date)
                $timeDiff = $currentTime - $logTime
                return $timeDiff.TotalMinutes -le 8
              }
              $keyword = "本轮通道状态上传成功"
              $matches = $content | Select-String -Pattern $keyword
              if ($matches) {
                Write-Output "FOUND_KEYWORD"
              } else {
                Write-Output "NO_KEYWORD"
              }
            } else {
              Write-Output "NO_LOGS_FOUND"
            }
          register: log_check_result
          failed_when: false
          when: >
            check_result is defined and
            'stdout' in check_result and
            'NOT_RUNNING' not in check_result.stdout

        - name: 状态判断：双保险判定重配需求
          ansible.builtin.set_fact:
            log_status_ok: "{{ (log_check_result.stdout | default('') | trim) == 'FOUND_KEYWORD' }}"
            need_reconfigure: >-
              {{
                not (
                  ((api_status_ok | default(false) | bool) and (is_export_started | default(false) | bool)) or
                  ((log_check_result.stdout | default('') | trim) == 'FOUND_KEYWORD')
                )
              }}

        - name: 状态判断：输出综合判断结果
          ansible.builtin.debug:
            msg: >
              [综合判断] 程序状态={{ check_result.stdout | trim | regex_search('^[^|]+') }} |
              API_OK={{ api_status_ok | default('n/a') }} |
              已启动上报={{ is_export_started | default('n/a') }} |
              日志_OK={{ log_status_ok | default('n/a') }} |
              需要重配={{ need_reconfigure }}

    - name: 重配执行：执行重配重启流程
      block:
        - name: 重配执行：停止程序
          win_shell: |
            $proc = Get-Process -Name "{{ exe_name }}" -ErrorAction SilentlyContinue
            if ($proc) {
              try {
                Stop-Process -Name "{{ exe_name }}" -Force -ErrorAction Stop
                Start-Sleep -Seconds 2
                $verify = Get-Process -Name "{{ exe_name }}" -ErrorAction SilentlyContinue
                if (-not $verify) {
                  Write-Output "STOPPED"
                } else {
                  taskkill /F /T /IM "{{ exe_name }}.exe" 2>$null
                  Start-Sleep -Seconds 2
                  $verify2 = Get-Process -Name "{{ exe_name }}" -ErrorAction SilentlyContinue
                  if (-not $verify2) {
                    Write-Output "STOPPED_BY_TASKKILL"
                  } else {
                    Write-Output "STOP_FAILED"
                  }
                }
              } catch {
                Write-Output "STOP_ERROR:$($_.Exception.Message)"
              }
            } else {
              Write-Output "NOT_RUNNING"
            }
          register: stop_result
          when: >
            check_result is defined and
            'stdout' in check_result and
            'NOT_RUNNING' not in check_result.stdout
          failed_when: >
            stop_result is defined and 'stdout' in stop_result and
            ('STOP_FAILED' in stop_result.stdout or 'STOP_ERROR' in stop_result.stdout)

        - name: 重配执行：获取当前用户名
          win_shell: |
            # 仅 Write-Output 一行用户名到 stdout；排障用 Console.Error，避免污染 path 模板
            $explorerUser = Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
              if ($o -and $o.ReturnValue -eq 0 -and $o.User) { $o.User.Trim() }
            } |
            Where-Object { $_ } |
            Select-Object -First 1

            $resolved = $null
            $source = 'unknown'
            if ($explorerUser) {
              $resolved = $explorerUser
              $source = 'explorer_GetOwner'
            } else {
              $logon = Get-ItemProperty `
                -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\LogonUI' `
                -ErrorAction SilentlyContinue

              if ($logon -and $logon.LastLoggedOnSAMUser) {
                $resolved = $logon.LastLoggedOnSAMUser.ToString().Split('\')[-1].Trim()
                $source = 'LogonUI_LastLoggedOnSAMUser'
              } elseif ($logon -and $logon.LastLoggedOnUser) {
                $resolved = $logon.LastLoggedOnUser.ToString().Split('\')[-1].Trim()
                $source = 'LogonUI_LastLoggedOnUser'
              } else {
                $resolved = "{{ hostvars[inventory_hostname].ansible_user | default('Administrator') }}"
                $source = 'ansible_user_fallback'
              }
            }

            [Console]::Error.WriteLine("[get_username] source=$source resolved_user=$resolved")
            # 以下多行供 Semaphore/Ansible 日志直接查看；最后一行必须是纯用户名（供 set_fact 取 stdout_lines|last）
            Write-Output "RECONFIG_LOG_PROFILE_USER=$resolved"
            Write-Output "RECONFIG_LOG_SOURCE=$source"
            $bd = "C:\Users\$resolved\Documents\NEWARE\BTSClient"
            Write-Output "RECONFIG_LOG_USER_BTS_DIR=$bd"
            Write-Output "RECONFIG_LOG_USER_CFG=$bd\{{ config_file_name }}"
            Write-Output "RECONFIG_LOG_PUBLIC_CFG=C:\Users\Public\Documents\NEWARE\BTSClient\{{ config_file_name }}"
            Write-Output "RECONFIG_LOG_SRC={{ zip_path }}/{{ config_file_name }}"
            Write-Output $resolved
          register: get_username_result
          changed_when: false

        - name: 重配执行：规范化配置文件路径变量
          ansible.builtin.set_fact:
            _reconfig_profile_user: "{{ (get_username_result.stdout_lines | default([]) | last | default(get_username_result.stdout | default(''))) | trim }}"

        - name: 重配执行：派生 BTSClient 与配置文件完整路径
          ansible.builtin.set_fact:
            _reconfig_user_bts_dir: "C:\\Users\\{{ _reconfig_profile_user }}\\Documents\\NEWARE\\BTSClient"
            _reconfig_user_cfg_file: "C:\\Users\\{{ _reconfig_profile_user }}\\Documents\\NEWARE\\BTSClient\\{{ config_file_name }}"
            _reconfig_public_cfg_file: "C:\\Users\\Public\\Documents\\NEWARE\\BTSClient\\{{ config_file_name }}"
            _reconfig_cfg_src: "{{ zip_path }}/{{ config_file_name }}"

        - name: 重配执行：DEBUG 用户名与路径（成功也打印）
          ansible.builtin.debug:
            msg:
              - "[DEBUG-重配-用户] win_shell 末行解析 profile_user={{ _reconfig_profile_user }}"
              - "[DEBUG-重配-用户] get_username stdout_lines={{ get_username_result.stdout_lines | default([]) }}"
              - "[DEBUG-重配-路径] user_cfg={{ _reconfig_user_cfg_file }}"
              - "[DEBUG-重配-路径] public_cfg={{ _reconfig_public_cfg_file }}"
              - "[DEBUG-重配-路径] zip_src={{ _reconfig_cfg_src }}"

        - name: 重配执行：创建配置文件目录（当前用户）
          ansible.builtin.win_file:
            path: "{{ _reconfig_user_bts_dir }}"
            state: directory

        - name: 重配执行：创建配置文件目录（Public用户）
          ansible.builtin.win_file:
            path: "C:\\Users\\Public\\Documents\\NEWARE\\BTSClient"
            state: directory

        - name: 重配执行：从服务器复制配置文件（当前用户）
          ansible.builtin.win_copy:
            src: "{{ _reconfig_cfg_src }}"
            dest: "{{ _reconfig_user_cfg_file }}"
          register: config_copy_result_user

        - name: 重配执行：从服务器复制配置文件（Public用户）
          ansible.builtin.win_copy:
            src: "{{ _reconfig_cfg_src }}"
            dest: "{{ _reconfig_public_cfg_file }}"
          register: config_copy_result_public

        - name: 重配执行：修改配置文件
          win_shell: |
            function Upsert-SectionKey {
              param([System.Collections.Generic.List[string]]$lines, [string]$section, [string]$key, [string]$value, [string]$logPath)
              $secStart = -1
              $secEnd = $lines.Count
              for ($i = 0; $i -lt $lines.Count; $i++) {
                $trim = $lines[$i].Trim()
                if ($trim -eq "[$section]") {
                  $secStart = $i
                  for ($j = $i + 1; $j -lt $lines.Count; $j++) {
                    if ($lines[$j].Trim() -match "^\[.*\]$") { $secEnd = $j; break }
                  }
                  break
                }
              }
              if ($secStart -lt 0) {
                if ($lines.Count -gt 0 -and $lines[$lines.Count - 1].Trim() -ne "") { $lines.Add("") }
                $lines.Add("[$section]")
                $lines.Add("$key=$value")
                Write-Output "RECONFIG_CFG_ADJUST|$logPath|[$section]|NEW_SECTION|$key=$value"
                return
              }
              for ($k = $secStart + 1; $k -lt $secEnd; $k++) {
                if ($lines[$k].Trim() -match "^$([regex]::Escape($key))=") {
                  $oldLine = $lines[$k]
                  $lines[$k] = "$key=$value"
                  Write-Output "RECONFIG_CFG_ADJUST|$logPath|[$section]|REPLACE|$oldLine -> $key=$value"
                  return
                }
              }
              $lines.Insert($secEnd, "$key=$value")
              Write-Output "RECONFIG_CFG_ADJUST|$logPath|[$section]|INSERT_NEW_LINE|$key=$value"
            }

            function Update-ConfigFile {
              param([string]$configPath, [string]$cfgJson, [string]$calbIp, [string]$fromDate, [string]$toDate)
              if (-not (Test-Path $configPath)) {
                Write-Output "RECONFIG_CFG_DEBUG|PATH_MISSING|$configPath"
                Write-Output "CONFIG_NOT_FOUND:$configPath"
                return $false
              }
              Write-Output "RECONFIG_CFG_DEBUG|PATH_OK|$configPath"
              try {
                $cfg = ConvertFrom-Json -InputObject $cfgJson -AsHashtable
                Write-Output "RECONFIG_CFG_DEBUG|JSON_OK|sections=$($cfg.Keys.Count)"
                if (-not $cfg.ContainsKey("SystemConfig")) { $cfg["SystemConfig"] = @{} }
                if (-not $cfg["SystemConfig"].ContainsKey("ServerIpAddrStr")) { $cfg["SystemConfig"]["ServerIpAddrStr"] = $calbIp }
                if (-not $cfg["SystemConfig"].ContainsKey("HisDataFromTime")) { $cfg["SystemConfig"]["HisDataFromTime"] = $fromDate }
                if (-not $cfg["SystemConfig"].ContainsKey("HisDataToTime")) { $cfg["SystemConfig"]["HisDataToTime"] = $toDate }
                Write-Output "RECONFIG_CFG_PLAN_BEGIN|$configPath"
                foreach ($section in @($cfg.Keys)) {
                  $vals = $cfg[$section]
                  foreach ($k in @($vals.Keys)) {
                    $v = [string]$vals[$k]
                    $vOne = $v -replace "`r`n", ' ' -replace "`n", ' '
                    Write-Output "RECONFIG_CFG_PLAN|$configPath|[$section]|$k=$vOne"
                  }
                }
                Write-Output "RECONFIG_CFG_PLAN_END|$configPath"
                $lines = [System.Collections.Generic.List[string]](Get-Content $configPath)
                Write-Output "RECONFIG_CFG_DEBUG|FILE_READ|$configPath|line_count=$($lines.Count)"
                foreach ($section in $cfg.Keys) {
                  $vals = $cfg[$section]
                  foreach ($k in $vals.Keys) {
                    Upsert-SectionKey -lines $lines -section $section -key ([string]$k) -value ([string]$vals[$k]) -logPath $configPath
                  }
                }
                # 禁止 Set-Content 把每一行再写入 success 流，否则 Ansible 捕获的 stdout 可能被清空/异常
                $null = $lines | Set-Content -LiteralPath $configPath
                Write-Output "CONFIG_MODIFIED|$configPath"
                return $true
              } catch {
                Write-Output "CONFIG_MODIFY_ERROR:$configPath|$($_.Exception.Message)"
                return $false
              }
            }

            $calbIp = "{{ merged_system_config.ServerIpAddrStr | default(api_host) }}"
            $fromDate = "{{ merged_system_config.HisDataFromTime | default(his_data_from_time) }}"
            if ($fromDate -eq "") { $fromDate = (Get-Date).ToString("yyyy-MM-dd") }
            $toDate = "{{ merged_system_config.HisDataToTime | default('') }}"
            if ($toDate -eq "") { $toDate = (Get-Date).AddDays(1).ToString("yyyy-MM-dd") }
            $username = "{{ _reconfig_profile_user }}"

            $userConfigPath = "C:\Users\$username\Documents\NEWARE\BTSClient\{{ config_file_name }}"
            $publicConfigPath = "C:\Users\Public\Documents\NEWARE\BTSClient\{{ config_file_name }}"
            $cfgJson = @'{{ merged_cfg_json }}'@

            Write-Output "RECONFIG_MODIFY_USER_CFG=$userConfigPath"
            Write-Output "RECONFIG_MODIFY_PUBLIC_CFG=$publicConfigPath"
            Write-Output "=== 处理当前用户配置文件 ==="
            $userResult = Update-ConfigFile -configPath $userConfigPath -cfgJson $cfgJson -calbIp $calbIp -fromDate $fromDate -toDate $toDate

            Write-Output "`n=== 处理Public用户配置文件 ==="
            $publicResult = Update-ConfigFile -configPath $publicConfigPath -cfgJson $cfgJson -calbIp $calbIp -fromDate $fromDate -toDate $toDate

            if (-not $userResult -and -not $publicResult) {
              exit 1
            }
            Write-Output "RECONFIG_CFG_RUN_SUMMARY|user_ok=$userResult|public_ok=$publicResult"
          register: config_result
          failed_when: >
            config_result is defined and 'stdout' in config_result and
            ('CONFIG_MODIFY_ERROR' in config_result.stdout)

        - name: 重配执行：DEBUG 配置修改任务 stdout（含 RECONFIG_CFG_PLAN，成功也打印）
          ansible.builtin.debug:
            msg:
              - "[DEBUG-重配-配置] rc={{ config_result.rc | default('n/a') }}"
              - "[DEBUG-重配-配置] stdout_len={{ (config_result.stdout | default('') | string | length) }}"
              - "[DEBUG-重配-配置] stdout_lines_count={{ (config_result.stdout_lines | default([]) | length) }}"
              - "[DEBUG-重配-配置] stderr={{ config_result.stderr | default('') }}"
              - "[DEBUG-重配-配置] stdout(raw)={{ config_result.stdout | default('') }}"
              - "[DEBUG-重配-配置] stdout_lines={{ config_result.stdout_lines | default([]) }}"

        - name: 重配执行：检查程序文件是否存在
          win_shell: |
            if (Test-Path "{{ exe_path }}") {
              Write-Output "EXE_FOUND"
            } else {
              Write-Output "EXE_NOT_FOUND"
            }
          register: exe_check_result
          changed_when: false

        - name: 重配执行：检查本地压缩包是否存在
          win_shell: |
            if (Test-Path "{{ exe_dir }}\\{{ zip_name }}.zip") {
              Write-Output "ZIP_FOUND"
            } else {
              Write-Output "ZIP_NOT_FOUND"
            }
          register: zip_local_check_result
          changed_when: false
          when: "'EXE_NOT_FOUND' in (exe_check_result.stdout | default(''))"

        - name: 重配执行：创建目标目录
          ansible.builtin.win_file:
            path: "{{ exe_dir }}"
            state: directory
          when: "'EXE_NOT_FOUND' in (exe_check_result.stdout | default(''))"

        - name: 重配执行：从服务器复制安装包
          ansible.builtin.win_copy:
            src: "{{ zip_path }}/{{ zip_name }}.zip"
            dest: "{{ exe_dir }}\\{{ zip_name }}.zip"
          register: zip_copy_result
          when: >
            'EXE_NOT_FOUND' in (exe_check_result.stdout | default('')) and
            (zip_local_check_result is skipped or 'ZIP_NOT_FOUND' in (zip_local_check_result.stdout | default('')))

        - name: 重配执行：解压程序包
          win_shell: |
            $zipPath = "{{ exe_dir }}\\{{ zip_name }}.zip"
            $destDir = "{{ exe_dir }}"
            if (-not (Test-Path $destDir)) {
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            }
            try {
              Expand-Archive -Path $zipPath -DestinationPath $destDir -Force
              Write-Output "EXTRACT_OK"
            } catch {
              Write-Output "EXTRACT_ERROR:$($_.Exception.Message)"
            }
          register: extract_result
          failed_when: >
            extract_result is defined and 'stdout' in extract_result and
            'EXTRACT_ERROR' in extract_result.stdout
          when: "'EXE_NOT_FOUND' in (exe_check_result.stdout | default(''))"

        - name: 重配执行：启动程序
          when: >
            'EXE_FOUND' in (exe_check_result.stdout | default('')) or
            (extract_result is defined and not (extract_result.skipped | default(false)) and 'EXTRACT_OK' in extract_result.stdout)
          win_shell: |
            if (Test-Path "{{ exe_path }}") {
              try {
                $taskName = "Start-{{ exe_name }}"
                if ("{{ exe_args }}" -ne "") {
                  $action = New-ScheduledTaskAction -Execute "{{ exe_path }}" -Argument "{{ exe_args }}"
                } else {
                  $action = New-ScheduledTaskAction -Execute "{{ exe_path }}"
                }
                $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date)
                $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable
                $userId = "{{ _reconfig_profile_user }}"
                $principal = New-ScheduledTaskPrincipal -UserId $userId -LogonType Interactive -RunLevel Highest
                Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Settings $settings -Principal $principal -Force
                $taskStatus = (Get-ScheduledTask -TaskName $taskName).State
                if ($taskStatus -ne "Running") {
                  Start-ScheduledTask -TaskName $taskName
                }
                Start-Sleep -Seconds {{ restart_delay | default(30) }}
                $verify = Get-Process -Name "{{ exe_name }}" -ErrorAction SilentlyContinue
                if ($verify) {
                  Write-Output "VERIFY_OK|PID:$($verify.Id)"
                } else {
                  Write-Output "VERIFY_FAILED"
                }
              } catch {
                Write-Output "START_ERROR:$($_.Exception.Message)"
              }
            } else {
              Write-Output "EXE_NOT_FOUND"
            }
          register: relaunch_result
          failed_when: >
            relaunch_result is defined and 'stdout' in relaunch_result and
            ('START_ERROR' in relaunch_result.stdout or
            'VERIFY_FAILED' in relaunch_result.stdout)

        - name: 重配执行：输出重配结果
          ansible.builtin.debug:
            msg: |
              ==================== 重配执行结果 ====================
              停止程序: {{ stop_result.stdout | default('未执行') | trim }}
              获取用户名(profile_user): {{ _reconfig_profile_user | default('未执行') }}
              用户配置路径: {{ _reconfig_user_cfg_file | default('未执行') }}
              Public配置路径: {{ _reconfig_public_cfg_file | default('未执行') }}
              复制配置文件(用户): {{ config_copy_result_user.changed | ternary('成功', '未变化') | default('未执行') }}
              复制配置文件(Public): {{ config_copy_result_public.changed | ternary('成功', '未变化') | default('未执行') }}
              修改配置: {{ config_result.stdout | default('未执行') | trim }}
              检查EXE: {{ exe_check_result.stdout | default('未执行') | trim }}
              {% if zip_copy_result is defined and not (zip_copy_result.skipped | default(false)) %}
              复制压缩包: {{ zip_copy_result.changed | ternary('成功', '未变化') }}
              {% endif %}
              {% if extract_result is defined and not (extract_result.skipped | default(false)) %}
              解压程序包: {{ extract_result.stdout | default('未执行') | trim }}
              {% endif %}
              启动程序: {% if relaunch_result is defined and not (relaunch_result.skipped | default(false)) %}{{ relaunch_result.stdout | default('未执行') | trim }}{% else %}未执行{% endif %}

      when: need_reconfigure | bool
      rescue:
        - name: 错误处理：重配阶段失败
          ansible.builtin.set_fact:
            host_failed_task: "{{ ansible_failed_task.name | default('重配执行') }}"
            host_failure_reason: "{{ (ansible_failed_result.stdout | default('')) | trim | default(ansible_failed_result.msg | default('未知错误'), true) }}"

        - name: 错误处理：输出重配失败信息
          ansible.builtin.debug:
            msg: "[失败] 主机 {{ inventory_hostname }} 重配阶段 [{{ host_failed_task }}]: {{ host_failure_reason }}"

    - name: 启动验证：验证数据上报启动状态
      when:
        - need_reconfigure | bool
        - host_failure_reason is not defined
      block:
        - name: 启动验证：记录启动前日志行数
          win_shell: |
            if (Test-Path "{{ log_path }}") {
              (Get-Content "{{ log_path }}").Length
            } else {
              0
            }
          register: log_before
          changed_when: false

        - name: 启动验证：调用启动API
          ansible.builtin.uri:
            url: "http://{{ api_host }}:{{ api_port }}"
            method: "POST"
            body_format: json
            body:
              CallType: "{{ api_start_call_type | int }}"
            headers:
              Content-Type: "application/json; charset=utf-8"
            return_content: true
            status_code: 200
            timeout: "{{ api_timeout_seconds | int }}"
          register: api_start_result
          delegate_to: localhost
          failed_when: false

        - name: 启动验证：DEBUG 启动 POST API 响应（成功也打印）
          ansible.builtin.debug:
            msg:
              - "[DEBUG-API] POST 启动 url=http://{{ api_host }}:{{ api_port }} CallType={{ api_start_call_type }}"
              - "[DEBUG-API] POST 启动 http_status={{ api_start_result.status | default('n/a') }}"
              - "[DEBUG-API] POST 启动 response_body={{ api_start_result.content | default('') }}"

        - name: 启动验证：检查启动API响应
          ansible.builtin.fail:
            msg: "[失败] API启动失败: HTTP={{ api_start_result.status | default('n/a') }}, 响应={{ api_start_result.content | default('') }}"
          when: >
            api_start_result is defined and
            not (api_start_result.skipped | default(false)) and
            (api_start_result.status | default(0) | int != 200 or
            (api_start_result.content | from_json).ResponeResultCode | default(-1) | int != api_expected_response_code | int or
            (api_start_result.content | from_json).ExecResultCode | default(-1) | int != api_expected_exec_success_code | int)

        - name: 启动验证：API+日志双保险验证
          block:
            - name: 启动验证：调用API查询状态
              ansible.builtin.uri:
                url: "http://{{ api_host }}:{{ api_port }}"
                method: "POST"
                body_format: json
                body:
                  CallType: "{{ api_status_call_type | int }}"
                headers:
                  Content-Type: "application/json"
                return_content: true
                status_code: 200
                timeout: 10
              register: api_check_after
              delegate_to: localhost
              failed_when: false

            - name: 启动验证：DEBUG 状态查询 POST API 响应（成功也打印）
              ansible.builtin.debug:
                msg:
                  - "[DEBUG-API] POST 状态 url=http://{{ api_host }}:{{ api_port }} CallType={{ api_status_call_type }}"
                  - "[DEBUG-API] POST 状态 http_status={{ api_check_after.status | default('n/a') }}"
                  - "[DEBUG-API] POST 状态 response_body={{ api_check_after.content | default('') }}"

            - name: 启动验证：判断API是否成功
              ansible.builtin.set_fact:
                api_final_ok: >-
                  {{
                    api_check_after.status | default(0) | int == 200 and
                    (api_check_after.content | default('{}') | from_json).ExecResultData | default(-1) | int == export_started | int
                  }}

            - name: 启动验证：日志轮询确认
              win_shell: |
                $logPath = "{{ log_path }}"
                $keyword = "{{ log_success_keyword }}"
                if (!(Test-Path $logPath)) {
                  exit 1
                }
                $content = Get-Content $logPath -Tail {{ log_tail_lines }}
                $match = $content | Select-String -Pattern $keyword
                if ($match) {
                  Write-Output "LOG_OK"
                } else {
                  exit 1
                }
              register: log_poll
              retries: "{{ log_poll_retries }}"
              delay: "{{ log_poll_delay }}"
              until: log_poll.rc == 0
              when: not api_final_ok
              failed_when: false

            - name: 启动验证：综合判断启动结果
              ansible.builtin.set_fact:
                final_start_ok: "{{ api_final_ok or (log_poll is defined and (log_poll.rc | default(1)) == 0) }}"

            - name: 启动验证：输出验证结果
              ansible.builtin.debug:
                msg:
                  - "[启动验证] 最终结果={{ final_start_ok }} (API={{ api_final_ok }}, 日志={{ (log_poll is defined and (log_poll.rc | default(1)) == 0) | default(false) }})"
                  - "[DEBUG-API] 汇总 api_final_ok={{ api_final_ok }} 首次POST见上条 DEBUG 任务"

            - name: 启动验证：启动失败则终止
              ansible.builtin.fail:
                msg: |
                  [失败] 启动验证失败（双保险判定失败）
                  API结果: {{ api_final_ok }}
                  日志结果: {{ (log_poll is defined and (log_poll.rc | default(1)) == 0) | default(false) }}
              when: not final_start_ok

      rescue:
        - name: 错误处理：记录失败原因
          ansible.builtin.set_fact:
            host_failed_task: "{{ ansible_failed_task.name | default('未知步骤') }}"
            host_failure_reason: "{{ (ansible_failed_result.stdout | default('')) | trim | default(ansible_failed_result.msg | default('未知错误'), true) }}"

        - name: 错误处理：输出失败信息
          ansible.builtin.debug:
            msg: "[失败] 主机 {{ inventory_hostname }} 在步骤 [{{ host_failed_task }}] 失败: {{ host_failure_reason }}"

  post_tasks:
    - name: 登记 Semaphore 回调行
      when: not (check_result.unreachable | default(false))
      ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ (_sem_dev | default({})).hostname | default(inventory_hostname, true) }}"
          device_status: >-
            {% if host_failure_reason is defined %}unhealthy
            {% elif check_result is not defined %}unknown
            {% elif 'NOT_RUNNING' in (check_result.stdout | default('')) and not (final_start_ok | default(false) | bool) %}unhealthy
            {% elif need_reconfigure | default(false) | bool and not (final_start_ok | default(true) | bool) %}unhealthy
            {% else %}healthy{% endif %}
          rdp_status: "{{ 'offline' if (check_result.unreachable | default(false)) else 'online' }}"
          winrm_status: "{{ 'offline' if (check_result.unreachable | default(false)) else 'online' }}"
          abnormal_reason: >-
            {% if host_failure_reason is defined %}{{ host_failure_reason }}
            {% elif 'NOT_RUNNING' in (check_result.stdout | default('')) and not (final_start_ok | default(false) | bool) %}Process was not running and start/verify did not succeed
            {% elif need_reconfigure | default(false) | bool and not (final_start_ok | default(true) | bool) %}Reconfigure/start verification failed
            {% endif %}
      vars:
        _sem_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"

    - name: 汇总报告：批量执行结果汇总
      when: ansible_play_hosts_all is defined
      run_once: true
      vars:
        reachable_count: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) |
             map(attribute='check_result') |
             select('defined') |
             selectattr('stdout', 'defined') |
             list | length | int }}
        failed_count: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) |
             selectattr('host_failure_reason', 'defined') |
             list | length | int }}
        normal_count: >-
          {{ reachable_count | int - failed_count | int }}
      debug:
        msg: |
          ========== API 巡检汇总 ==========
          主机总数: {{ ansible_play_hosts_all | length }}
          正常: {{ normal_count | int }}
          异常: {{ ansible_play_hosts_all | length - normal_count | int }}
          ========== 详细状态 ==========
          {% for host in ansible_play_hosts_all %}
          {% if hostvars[host].check_result is defined and 'stdout' in hostvars[host].check_result %}
          {% if hostvars[host].host_failure_reason is defined %}
          [异常] {{ host }}: {{ hostvars[host].check_result.stdout | trim }}
          -> 失败阶段: {{ hostvars[host].host_failed_task | default('未知步骤') }}
          -> 失败原因: {{ hostvars[host].host_failure_reason }}
          {% else %}
          [正常] {{ host }}: {{ hostvars[host].check_result.stdout | trim }}
          {% if hostvars[host].need_reconfigure is defined %}
          -> 需要重配: {{ hostvars[host].need_reconfigure }}
          {% endif %}
          {% if hostvars[host].api_start_result is defined and hostvars[host].api_start_result.content is defined and not (hostvars[host].api_start_result.skipped | default(false)) %}
          -> API启动: {{ hostvars[host].api_start_result.content | trim }}
          {% endif %}
          {% endif %}
          {% else %}
          [异常] {{ host }}: 主机不可达
          -> 失败阶段: 检查程序运行状态
          -> 失败原因: {{ hostvars[host].check_result.msg | default('连接失败') }}
          {% endif %}
          {% endfor %}

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 执行 bulk 回调
      ansible.builtin.include_tasks: tasks/semaphore_bulk_put_from_hostvars.yml
