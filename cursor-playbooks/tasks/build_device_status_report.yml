---
# run_once：构建 _status_report_msg_lines（每主机一行）。host 项为 ansible_play_hosts_all 的 inventory_hostname（一般为 IP）。
- name: 初始化状态报告行
  ansible.builtin.set_fact:
    _status_report_msg_lines:
      - "【{{ exe_name }}】程序运行状态总览 @ {{ lookup('pipe', 'date +\"%Y-%m-%d %H:%M:%S\"') }}"
      - "host=inventory_hostname（静态 inventory / 设备 IP，与 Semaphore 设备表 ip 字段一致）"
      - "--- 各主机 ---"

- name: 追加各主机状态行
  ansible.builtin.set_fact:
    _status_report_msg_lines: "{{ _status_report_msg_lines + [_host_report_line] }}"
  loop: "{{ ansible_play_hosts_all }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _host_report_line: >-
      {%- set h = item -%}
      {%- if hostvars[h].status is defined and hostvars[h].status.stdout is defined -%}
      {%- set host_status = hostvars[h].status.stdout | trim -%}
      {%- if 'NOT_RUNNING' in host_status -%}
      · {{ h }} | 未运行 | {{ host_status }}
      {%- elif hostvars[h].need_reconfigure is defined and hostvars[h].need_reconfigure | bool -%}
      · {{ h }} | 异常(需重配) | {{ host_status }} | API_OK={{ hostvars[h].api_status_ok | default('n/a') }} | 已启动上报={{ hostvars[h].is_export_started | default('n/a') }} | 日志_OK={{ hostvars[h].log_status_ok | default('n/a') }}
      {%- else -%}
      · {{ h }} | 正常 | {{ host_status }} | API_OK={{ hostvars[h].api_status_ok | default('n/a') }} | 已启动上报={{ hostvars[h].is_export_started | default('n/a') }} | 日志_OK={{ hostvars[h].log_status_ok | default('n/a') }}
      {%- endif -%}
      {%- else -%}
      · {{ h }} | 不可达
      {%- endif -%}

- name: 追加状态报告汇总行
  ansible.builtin.set_fact:
    _status_report_msg_lines: "{{ _status_report_msg_lines + [_status_report_summary] }}"
  vars:
    _status_report_summary: >-
      {%- set ns = namespace(normal=0, abnormal=0, not_running=0, unreachable=0) -%}
      {%- for host in ansible_play_hosts_all -%}
      {%- if hostvars[host].status is not defined or 'stdout' not in hostvars[host].status -%}
      {%- set ns.unreachable = ns.unreachable + 1 -%}
      {%- elif 'NOT_RUNNING' in hostvars[host].status.stdout -%}
      {%- set ns.not_running = ns.not_running + 1 -%}
      {%- elif hostvars[host].need_reconfigure is defined and hostvars[host].need_reconfigure | bool -%}
      {%- set ns.abnormal = ns.abnormal + 1 -%}
      {%- else -%}
      {%- set ns.normal = ns.normal + 1 -%}
      {%- endif -%}
      {%- endfor -%}
      【汇总】总计 {{ ansible_play_hosts_all | length }} 台 · 正常 {{ ns.normal }} · 异常(需重配) {{ ns.abnormal }} · 未运行 {{ ns.not_running }} · 不可达 {{ ns.unreachable }}
