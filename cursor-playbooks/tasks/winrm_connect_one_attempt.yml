---
# 单次建连；外层 loop 在 session 已 ok 时整块 skip（when 写在 block 上）
- name: 单次 WinRM 建连尝试
  when: not (_winrm_session_ok | default(false) | bool)
  block:
    - name: 重试前重置与等待
      ansible.builtin.include_tasks: tasks/winrm_connect_retry_pause.yml
      when: (_winrm_connect_attempt | int) > 1

    - name: WinRM ping 探测
      ansible.windows.win_ping:
      register: _winrm_ping
      failed_when: false

    - name: 登记 WinRM 已连通
      ansible.builtin.set_fact:
        _winrm_session_ok: true
        _winrm_ping_last_success: "{{ _winrm_ping }}"
      when: _winrm_ping is succeeded

    # win_ping UNREACHABLE 会把主机移出活跃列表，后续重试与 semaphore_callback 都会被跳过
    - name: ping 未成功则清除 unreachable（便于重试与登记回调）
      when: _winrm_ping is not succeeded
      block:
        - name: 执行 clear_host_errors
          ansible.builtin.meta: clear_host_errors
