---
# 强制停止 exe_name；STOP_FAILED/STOP_ERROR 后复核。僵尸进程（Handles/WS 过低）视为未运行。
# 期望变量: exe_name

- name: 部署进程存活判定脚本
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/files/process_alive_windows.ps1"
    dest: C:\Windows\Temp\sem_process_alive_windows.ps1
  changed_when: false

- name: 部署停止程序脚本
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/files/stop_program_force_windows.ps1"
    dest: C:\Windows\Temp\sem_stop_program_force_windows.ps1
  changed_when: false

- name: 部署停止复核脚本
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/files/verify_process_stopped_windows.ps1"
    dest: C:\Windows\Temp\sem_verify_process_stopped_windows.ps1
  changed_when: false

- name: 停止程序（强制 Stop-Process / taskkill）
  environment:
    EXE_NAME: "{{ exe_name }}"
    PROCESS_ALIVE_MIN_HANDLES: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_HANDLES') | default('', true) | trim) | default('1', true) }}"
    PROCESS_ALIVE_MIN_WS_KB: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_WS_KB') | default('', true) | trim) | default('512', true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_stop_program_force_windows.ps1
  args:
    chdir: C:\Windows\Temp
  register: stop_result
  failed_when: false
  changed_when: >-
    'STOPPED' in (stop_result.stdout | default('')) or
    'STOPPED_BY_TASKKILL' in (stop_result.stdout | default('')) or
    'NOT_RUNNING' in (stop_result.stdout | default(''))

- name: 停止程序：复核进程是否仍在运行
  environment:
    EXE_NAME: "{{ exe_name }}"
    PROCESS_ALIVE_MIN_HANDLES: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_HANDLES') | default('', true) | trim) | default('1', true) }}"
    PROCESS_ALIVE_MIN_WS_KB: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_WS_KB') | default('', true) | trim) | default('512', true) }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_verify_process_stopped_windows.ps1
  args:
    chdir: C:\Windows\Temp
  register: stop_verify_result
  changed_when: false
  failed_when: false
  when: >
    stop_result is defined and
    not (stop_result.unreachable | default(false)) and
    'stdout' in stop_result and
    (
      'STOP_FAILED' in stop_result.stdout or
      'STOP_ERROR' in stop_result.stdout
    )

- name: 停止程序：初次失败但复核已退出，继续后续流程
  ansible.builtin.debug:
    msg: >-
      [停止] {{ inventory_hostname }} 初次={{ stop_result.stdout | trim }}，
      复核={{ stop_verify_result.stdout | trim }} → 进程已不在运行，继续重配/重启
  when: >
    stop_verify_result is defined and
    not (stop_verify_result.unreachable | default(false)) and
    'NOT_RUNNING' in (stop_verify_result.stdout | default(''))

- name: 停止程序：失败（复核进程仍在运行）
  ansible.builtin.fail:
    msg: >-
      [停止] {{ inventory_hostname }} 无法终止 {{ exe_name }}：
      初次={{ stop_result.stdout | default('') | trim }}，
      复核={{ stop_verify_result.stdout | default('') | trim }}
  when: >
    stop_verify_result is defined and
    not (stop_verify_result.unreachable | default(false)) and
    'stdout' in stop_verify_result and
    'STILL_RUNNING' in stop_verify_result.stdout
