---
# 紧挨「日志轮询前置检查」之前：启动后重新采集进程状态，并登记是否跳过日志轮询。
# 期望 hostvars：relaunch_result、_exe_start_script_ok

- name: 启动验证：启动后重新采集进程状态
  block:
    - ansible.builtin.include_tasks: tasks/collect_process_status_windows.yml
    - ansible.builtin.set_fact:
        check_result_after_start: "{{ _sem_process_status }}"
  ignore_unreachable: true

- name: 启动验证：输出启动后程序状态
  ansible.builtin.debug:
    msg: "[程序状态-启动后] {{ check_result_after_start.stdout | trim }}"
  when: >
    check_result_after_start is defined and
    not (check_result_after_start.unreachable | default(false)) and
    'stdout' in check_result_after_start

- name: 启动验证：登记是否跳过日志轮询
  ansible.builtin.set_fact:
    process_running_after_start: >-
      {{
        check_result_after_start is defined and
        not (check_result_after_start.unreachable | default(false)) and
        'stdout' in check_result_after_start and
        ('NOT_RUNNING' not in (check_result_after_start.stdout | default('')))
      }}
    skip_log_poll: >-
      {{
        (check_result_after_start is not defined) or
        (check_result_after_start.unreachable | default(false)) or
        not (
          check_result_after_start is defined and
          'stdout' in check_result_after_start and
          ('NOT_RUNNING' not in (check_result_after_start.stdout | default('')))
        ) or
        (not (_exe_start_script_ok | default(false) | bool))
      }}
    skip_log_poll_reason: >-
      {%- if check_result_after_start is not defined or (check_result_after_start.unreachable | default(false)) -%}
      after_start_unreachable
      {%- elif 'NOT_RUNNING' in (check_result_after_start.stdout | default('')) -%}
      after_start_not_running
      {%- elif not (_exe_start_script_ok | default(false) | bool) -%}
      exe_start_not_verify_ok
      {%- else -%}
      {%- endif -%}

- name: 启动验证：DEBUG 跳过日志轮询原因
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LOG-POLL] skip_log_poll={{ skip_log_poll | default(false) }}"
      - "[DEBUG-LOG-POLL] reason={{ skip_log_poll_reason | default('') | trim }}"
      - "[DEBUG-LOG-POLL] after_start={{ check_result_after_start.stdout | default('n/a') | trim }}"
      - "[DEBUG-LOG-POLL] process_running_after_start={{ process_running_after_start | default(false) }}"
      - "[DEBUG-LOG-POLL] exe_start_verify_ok={{ _exe_start_script_ok | default(false) }}"
  when: skip_log_poll | default(false) | bool
