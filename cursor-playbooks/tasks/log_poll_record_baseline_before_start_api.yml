---
# 启动程序之前：数当前日志行数并写入 .state（轮询只匹配此后新增行）
- name: 重配执行：记录启动程序前日志行数（轮询书签）
  win_shell: |
    $logPath = "{{ log_path }}"
    $statePath = "{{ log_poll_state_path }}"
    $maxRetries = {{ log_read_retries | default(5) | int }}
    $retryDelay = {{ log_read_retry_delay | default(2) | int }}
    $baseline = [int64]0
    $fileExists = $false
    $fileLen = [int64]0

    function Count-LogLinesShared([string]$Path) {
      $attempt = 0
      while ($true) {
        $attempt++
        $stream = $null
        $reader = $null
        try {
          # exe 写入日志时常独占文件；须 ReadWrite 共享打开（与轮询一致）
          $stream = [System.IO.File]::Open($Path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
          $reader = New-Object System.IO.StreamReader($stream, [System.Text.Encoding]::UTF8, $true)
          $count = [int64]0
          while ($null -ne ($reader.ReadLine())) { $count++ }
          return $count
        } catch {
          if ($attempt -ge $maxRetries) {
            Write-Output "LOG_READ_ERROR=$($_.Exception.Message)"
            throw
          }
          Write-Output "LOG_READ_RETRY|attempt=$attempt|delay_s=$retryDelay"
          Start-Sleep -Seconds $retryDelay
        } finally {
          if ($null -ne $reader) { $reader.Close() }
          if ($null -ne $stream) { $stream.Dispose() }
        }
      }
    }

    # 清除上轮遗留游标，避免 cursor 大于当前文件行数
    if (Test-Path -LiteralPath $statePath) {
      Remove-Item -LiteralPath $statePath -Force -ErrorAction SilentlyContinue
    }
    if (Test-Path -LiteralPath $logPath) {
      $fileExists = $true
      try { $fileLen = (Get-Item -LiteralPath $logPath).Length } catch { $fileLen = -1 }
      $baseline = Count-LogLinesShared -Path $logPath
    }
    [System.IO.File]::WriteAllText($statePath, $baseline.ToString())
    Write-Output "LOG_BASELINE=$baseline"
    Write-Output "LOG_PATH=$logPath"
    Write-Output "LOG_STATE_PATH=$statePath"
    Write-Output "LOG_FILE_EXISTS=$fileExists"
    Write-Output "LOG_FILE_BYTES=$fileLen"
  register: log_baseline_before_start_api
  changed_when: false
  when: log_path is defined

# 同一 set_fact 内不能引用本任务刚定义的 _log_baseline_line（Ansible 模板求值时尚未存在）
- name: 重配执行：登记日志轮询基准行号
  ansible.builtin.set_fact:
    _log_baseline_line: "{{ (log_baseline_before_start_api.stdout_lines | default([]) | select('search', 'LOG_BASELINE=') | list | first) | default('LOG_BASELINE=0', true) }}"
  when:
    - log_baseline_before_start_api is defined
    - not (log_baseline_before_start_api.skipped | default(false))
    - (log_baseline_before_start_api.rc | default(1)) == 0

- name: 重配执行：登记日志轮询基准行号（数值）
  ansible.builtin.set_fact:
    log_poll_baseline: "{{ (_log_baseline_line | regex_replace('^LOG_BASELINE=', '') | trim) | int }}"
  when:
    - log_baseline_before_start_api is defined
    - not (log_baseline_before_start_api.skipped | default(false))
    - (log_baseline_before_start_api.rc | default(1)) == 0

- name: 重配执行：DEBUG 启动程序前日志行数
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LOG] host={{ inventory_hostname }}"
      - "[DEBUG-LOG] log_path={{ log_path | default('n/a') }}"
      - "[DEBUG-LOG] state_path={{ log_poll_state_path | default('n/a') }}"
      - "[DEBUG-LOG] baseline_lines={{ log_poll_baseline | default(0) }} (启动程序前；仅轮询此后新增行)"
      - "[DEBUG-LOG] parsed_from={{ _log_baseline_line | default('n/a') }}"
      - "[DEBUG-LOG] win_shell={{ log_baseline_before_start_api.stdout_lines | default([]) }}"
  when:
    - log_baseline_before_start_api is defined
    - not (log_baseline_before_start_api.skipped | default(false))
    - (log_baseline_before_start_api.rc | default(1)) == 0
    - log_poll_baseline is defined
