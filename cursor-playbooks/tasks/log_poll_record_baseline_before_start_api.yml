---
# 启动 exe 之后、调用启动 API 之前：数当前日志行数并写入 .state（轮询只匹配此后新增行）
- name: 启动验证：记录启动 API 调用前日志行数（轮询书签）
  win_shell: |
    $ErrorActionPreference = 'Stop'
    $logPath = "{{ log_path }}"
    $statePath = "{{ log_poll_state_path }}"
    $baseline = [int64]0
    $fileExists = $false
    $fileLen = [int64]0
    if (Test-Path -LiteralPath $logPath) {
      $fileExists = $true
      try { $fileLen = (Get-Item -LiteralPath $logPath).Length } catch { $fileLen = -1 }
      $reader = $null
      try {
        $reader = New-Object System.IO.StreamReader($logPath, [System.Text.Encoding]::UTF8, $true)
        while ($null -ne ($reader.ReadLine())) { $baseline++ }
      } finally {
        if ($null -ne $reader) { $reader.Close() }
      }
    }
    [System.IO.File]::WriteAllText($statePath, $baseline.ToString())
    Write-Output "LOG_BASELINE=$baseline"
    Write-Output "LOG_PATH=$logPath"
    Write-Output "LOG_STATE_PATH=$statePath"
    Write-Output "LOG_FILE_EXISTS=$fileExists"
    Write-Output "LOG_FILE_BYTES=$fileLen"
  register: log_baseline_before_start_api
  changed_when: false
  when: log_path is defined

- name: 启动验证：登记日志轮询基准行号
  ansible.builtin.set_fact:
    _log_baseline_line: "{{ (log_baseline_before_start_api.stdout_lines | default([]) | select('search', 'LOG_BASELINE=') | list | first) | default('LOG_BASELINE=0', true) }}"
    log_poll_baseline: "{{ (_log_baseline_line | regex_replace('^LOG_BASELINE=', '') | trim) | int }}"
  when: log_baseline_before_start_api is defined and not (log_baseline_before_start_api.skipped | default(false))

- name: 启动验证：DEBUG 启动 API 前日志行数（exe 已启动后）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LOG] host={{ inventory_hostname }}"
      - "[DEBUG-LOG] log_path={{ log_path | default('n/a') }}"
      - "[DEBUG-LOG] state_path={{ log_poll_state_path | default('n/a') }}"
      - "[DEBUG-LOG] baseline_lines={{ log_poll_baseline | default(0) }} (exe 启动后、启动 API 调用前；仅轮询此后新增行)"
      - "[DEBUG-LOG] parsed_from={{ _log_baseline_line | default('n/a') }}"
      - "[DEBUG-LOG] win_shell={{ log_baseline_before_start_api.stdout_lines | default([]) }}"
  when: log_baseline_before_start_api is defined and not (log_baseline_before_start_api.skipped | default(false))
