---
# 在 localhost（post_tasks run_once）上执行：解析 bulk PUT 的 URL / project / token。
# Token 可从 runner 环境变量或 task extra-vars（Variable Group JSON）读取。

- name: 解析 bulk PUT 凭据
  ansible.builtin.set_fact:
    _sem_bulk_host_list: "{{ ansible_play_hosts_all | default(groups['windows_hosts'] | default([])) }}"
    _sem_bulk_url: >-
      {{ (
        lookup('env', 'SEMAPHORE_URL') | default('', true) | trim
      ) or (
        SEMAPHORE_URL | default('', true) | trim | string
      ) or 'http://127.0.0.1:3000' }}
    _sem_bulk_pid: >-
      {{ (
        semaphore_project_id | default('') | string | trim
      ) or (
        lookup('env', 'SEMAPHORE_PROJECT_ID') | default('', true) | trim
      ) or (
        SEMAPHORE_PROJECT_ID | default('', true) | trim | string
      ) }}
    _sem_bulk_token: >-
      {{ (
        lookup('env', 'SEMAPHORE_API_TOKEN') | default('', true) | trim
      ) or (
        SEMAPHORE_API_TOKEN | default('', true) | trim | string
      ) }}
