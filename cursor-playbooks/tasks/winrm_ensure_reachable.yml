---
# 在每个 windows_hosts play 最前 include：WinRM 建连重试，减轻首包 UNREACHABLE 导致后续任务全部 ...ignoring
- name: 登记 WinRM 建连重试参数
  ansible.builtin.set_fact:
    winrm_connect_retries: "{{ ((lookup('env', 'WINRM_CONNECT_RETRIES') | default('', true) | trim) | default('4', true)) | int }}"
    winrm_connect_retry_delay: "{{ ((lookup('env', 'WINRM_CONNECT_RETRY_DELAY') | default('', true) | trim) | default('5', true)) | int }}"

# loop 的 when 写在 include 上不会在迭代间重新求值；改在 winrm_connect_one_attempt 的 block 上 skip
- name: WinRM 建连重试序列
  ansible.builtin.include_tasks: tasks/winrm_connect_one_attempt.yml
  loop: "{{ range(1, (winrm_connect_retries | int) + 1) | list }}"
  loop_control:
    loop_var: _winrm_connect_attempt
    label: "attempt={{ _winrm_connect_attempt }}/{{ winrm_connect_retries }}"

- name: DEBUG WinRM 建连结果
  ansible.builtin.debug:
    msg:
      - "[DEBUG-WINRM] session_ok={{ _winrm_session_ok | default(false) }}"
      - "[DEBUG-WINRM] attempts={{ winrm_connect_retries }} delay={{ winrm_connect_retry_delay }}s"
      - "[DEBUG-WINRM] last_ping={{ _winrm_ping | default({}) }}"
  when: _winrm_ping is defined

- name: 建连失败后清除 unreachable 以便后续带 ignore_unreachable 的任务仍可再试
  ansible.builtin.meta: clear_host_errors
  when: not (_winrm_session_ok | default(false) | bool)
