---
# 在每个 windows_hosts play 最前 include：WinRM 建连重试，减轻首包 UNREACHABLE 导致后续任务全部 ...ignoring
# 中途建连：include 时传 winrm_force_reconnect: true（见 tasks/winrm_refresh_midplay.yml）
- name: 强制刷新 WinRM 会话标记（中途建连）
  ansible.builtin.set_fact:
    _winrm_session_ok: false
  when: winrm_force_reconnect | default(false) | bool

- name: 登记 WinRM 建连重试参数
  ansible.builtin.set_fact:
    winrm_connect_retries: "{{ ((lookup('env', 'WINRM_CONNECT_RETRIES') | default('', true) | trim) | default('4', true)) | int }}"
    winrm_connect_retry_delay: "{{ ((lookup('env', 'WINRM_CONNECT_RETRY_DELAY') | default('', true) | trim) | default('5', true)) | int }}"

# loop 的 when 写在 include 上不会在迭代间重新求值；改在 winrm_connect_one_attempt 的 block 上 skip
- name: WinRM 建连重试序列
  ansible.builtin.include_tasks: tasks/winrm_connect_one_attempt.yml
  loop: "{{ range(1, (winrm_connect_retries | int) + 1) | list }}"
  loop_control:
    loop_var: _winrm_connect_attempt
    label: "attempt={{ _winrm_connect_attempt }}/{{ winrm_connect_retries }}"

- name: DEBUG WinRM 建连结果
  ansible.builtin.debug:
    msg:
      - "[DEBUG-WINRM] context={{ winrm_connect_context | default('play-start') }}"
      - "[DEBUG-WINRM] session_ok={{ _winrm_session_ok | default(false) }}"
      - "[DEBUG-WINRM] ping_ok={{ _winrm_ping_ok | default('n/a') }}"
      - "[DEBUG-WINRM] attempts={{ winrm_connect_retries }} delay={{ winrm_connect_retry_delay }}s"
      - "[DEBUG-WINRM] last_ping={{ _winrm_ping_last_success | default({}) }}"
  when: _winrm_ping_last_success is defined or _winrm_ping is defined

- name: WinRM 建连失败则登记 unhealthy 并结束本主机（bulk 回调 play）
  when:
    - not (_winrm_session_ok | default(false) | bool)
    - _semaphore_device_rows is defined
  block:
    - name: 登记回调前清除 unreachable（ping 失败时否则跳过后续任务）
      ansible.builtin.meta: clear_host_errors
    - name: 执行 WinRM 建连失败回调
      ansible.builtin.include_tasks: tasks/semaphore_callback_winrm_connect_failed.yml

- name: 建连失败后清除 unreachable（无 bulk 回调变量的 play）
  when:
    - not (_winrm_session_ok | default(false) | bool)
    - _semaphore_device_rows is not defined
  block:
    - name: 执行 clear_host_errors
      ansible.builtin.meta: clear_host_errors
