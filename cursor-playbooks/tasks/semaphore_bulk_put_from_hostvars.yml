---
# Include from a play with hosts: localhost after a windows_hosts play that set
# hostvar semaphore_callback_row per host.
# Env: SEMAPHORE_URL (optional), SEMAPHORE_PROJECT_ID, SEMAPHORE_API_TOKEN

- name: 汇总各主机 semaphore_callback_row
  ansible.builtin.set_fact:
    semaphore_status_bulk_updates: "{{ semaphore_status_bulk_updates | default([]) + [ hostvars[item].semaphore_callback_row ] }}"
  loop: "{{ groups['windows_hosts'] | default([]) }}"
  when: hostvars[item].semaphore_callback_row is defined

- name: 提示缺少 SEMAPHORE_API_TOKEN（不会 PUT，设备可能保持 checking）
  ansible.builtin.debug:
    msg: >-
      Bulk status callback skipped: set SEMAPHORE_API_TOKEN on the template
      (and SEMAPHORE_URL if the controller cannot reach Semaphore at 127.0.0.1:3000).
      Project id is passed as extra-var semaphore_project_id; SEMAPHORE_PROJECT_ID env is optional.
  when:
    - (semaphore_status_bulk_updates | default([])) | length > 0
    - (lookup('env', 'SEMAPHORE_API_TOKEN') | default('', true) | trim | length) < 1

- name: PUT Semaphore /devices/status/bulk
  ansible.builtin.uri:
    url: "{{ _sem_url }}/api/project/{{ _sem_pid }}/devices/status/bulk"
    method: PUT
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ _sem_token }}"
    body_format: json
    body:
      updates: "{{ semaphore_status_bulk_updates | default([]) }}"
    status_code: [200]
  register: _sem_bulk_put_result
  vars:
    _sem_url: "{{ lookup('env', 'SEMAPHORE_URL') | default('http://127.0.0.1:3000', true) | trim }}"
    # Injected by Semaphore task extra-vars (runDeviceTemplate / scheduler); env is fallback.
    _sem_pid: "{{ (semaphore_project_id | default(lookup('env', 'SEMAPHORE_PROJECT_ID'), true)) | trim | string }}"
    _sem_token: "{{ lookup('env', 'SEMAPHORE_API_TOKEN') | default('', true) | trim }}"
  when:
    - _sem_pid | length > 0
    - _sem_token | length > 0
    - (semaphore_status_bulk_updates | default([])) | length > 0

- name: DEBUG Semaphore bulk PUT 响应（成功也打印）
  ansible.builtin.debug:
    msg:
      - "[DEBUG-API] bulk PUT url={{ _sem_url }}/api/project/{{ _sem_pid }}/devices/status/bulk"
      - "[DEBUG-API] bulk PUT http_status={{ _sem_bulk_put_result.status | default('n/a') }}"
      - "[DEBUG-API] bulk PUT response_body={{ _sem_bulk_put_result.content | default('') }}"
  vars:
    _sem_url: "{{ lookup('env', 'SEMAPHORE_URL') | default('http://127.0.0.1:3000', true) | trim }}"
    _sem_pid: "{{ (semaphore_project_id | default(lookup('env', 'SEMAPHORE_PROJECT_ID'), true)) | trim | string }}"
  when:
    - _sem_bulk_put_result is defined
    - not (_sem_bulk_put_result.skipped | default(false))
