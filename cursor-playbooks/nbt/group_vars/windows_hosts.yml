---
# NBT Windows service (Start-Service / Stop-Service via win_service)
nbt_service_name: "{{ (lookup('env', 'NBT_SERVICE_NAME') | default('', true) | trim) | default('nbt_agent', true) }}"

# NBT agent HTTP API (GET heartbeat + reset data)
nbt_api_scheme: "{{ (lookup('env', 'NBT_API_SCHEME') | default('', true) | trim) | default('http', true) }}"
nbt_api_port: "{% set hp = hostvars[inventory_hostname].api_port | default(0) %}{% if (hp | int) > 0 %}{{ hp | int }}{% else %}{{ (lookup('env', 'NBT_API_PORT') | default('', true) | trim) | default('8885', true) | int }}{% endif %}"
nbt_api_heartbeat_path: "{{ (lookup('env', 'NBT_API_HEARTBEAT_PATH') | default('', true) | trim) | default('/SendStatus', true) }}"
nbt_api_reset_data_path: "{{ (lookup('env', 'NBT_API_RESET_DATA_PATH') | default('', true) | trim) | default('/ResetData', true) }}"
nbt_api_timeout: "{{ ((lookup('env', 'NBT_API_TIMEOUT') | default('', true) | trim) | default('8', true)) | int }}"
nbt_api_verify_tls: "{{ ((lookup('env', 'NBT_API_VERIFY_TLS') | default('', true) | trim) | default('true', true)) | bool }}"
nbt_heartbeat_max_age_minutes: "{{ ((lookup('env', 'NBT_HEARTBEAT_MAX_AGE_MINUTES') | default('', true) | trim) | default('90', true)) | int }}"
nbt_start_check_api: "{{ ((lookup('env', 'NBT_START_CHECK_API') | default('', true) | trim) | default('true', true)) | bool }}"
nbt_stop_check_api: "{{ ((lookup('env', 'NBT_STOP_CHECK_API') | default('', true) | trim) | default('false', true)) | bool }}"
