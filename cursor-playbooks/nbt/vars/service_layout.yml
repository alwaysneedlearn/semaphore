---
# NBT service install layout (no exe_name / exe_path).
# SERVICE_PATH = parent directory to search; SERVICE_NAME → {SERVICE_NAME}.exe under that tree.
# Env: SERVICE_NAME, SERVICE_PATH, NBT_SERVICE_NAME, NBT_SERVICE_PATH, ZIP_NAME, ZIP_PATH.

service_name: "{{ (lookup('env', 'NBT_SERVICE_NAME') | default(lookup('env', 'SERVICE_NAME') | default('', true), true) | trim) | default('NBT.MES.Service', true) }}"
service_base_dir: "{{ (lookup('env', 'NBT_SERVICE_PATH') | default(lookup('env', 'SERVICE_PATH') | default('', true), true) | trim) | default('D:\\MES\\数据上传', true) }}"
service_exe_name: "{{ (service_name | regex_replace('(?i)\\.exe$', '')) ~ '.exe' }}"
# Legacy alias until resolve_nbt_service_install.yml runs:
service_path: "{{ service_base_dir }}"
install_path: "{{ service_base_dir }}\\{{ service_exe_name }}"
service_parent_dir: "{{ service_base_dir }}"
zip_name: "{{ (lookup('env', 'ZIP_NAME') | default('', true) | trim) | default('nbt.zip', true) }}"
zip_path: "{{ (lookup('env', 'ZIP_PATH') | default('', true) | trim) | default('/root/nbt/pkg', true) }}"
redeploy_zip_dest: "{{ service_parent_dir }}\\{{ zip_name }}"
redeploy_zip_src: "{{ zip_path }}/{{ zip_name }}"
redeploy_extract_dest: "{{ service_parent_dir }}"
nbt_service_scan_max_depth: "{{ ((lookup('env', 'NBT_SERVICE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('3', true)) | int }}"
nbt_service_scan_latest: "{{ ((lookup('env', 'NBT_SERVICE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool }}"
