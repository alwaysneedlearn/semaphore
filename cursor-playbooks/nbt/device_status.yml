---
- name: NBT 状态巡检（服务 + 心跳 API）
  hosts: windows_hosts
  gather_facts: no
  max_fail_percentage: 100
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/../shared/files"
    sem_debug_tag: NBT
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_ensure_reachable.yml"
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/winrm_gate_play_tasks.yml"
    - ansible.builtin.set_fact:
        _nbt_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({}) }}"
        _nbt_target_host: "{{ ((_semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) | default({})).ip | default(inventory_hostname, true)) }}"

    - name: 检查 NBT 服务安装路径是否存在
      ansible.windows.win_stat:
        path: "{{ service_path }}"
      register: _nbt_service_path_stat
      ignore_unreachable: true

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/nbt_windows_service_status.yml"

    - ansible.builtin.set_fact:
        _nbt_process_check: "{{ _nbt_service_status }}"
      when: _nbt_service_status is defined

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/debug_sync_api_patrol_snapshot.yml"

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/nbt_api_heartbeat_check.yml"

    - ansible.builtin.set_fact:
        need_reconfigure: >-
          {{
            (not (_nbt_service_path_stat.stat.exists | default(false)))
            or ('RUNNING' not in (_nbt_service_status.stdout | default('')))
            or not (nbt_heartbeat_ok | default(false) | bool)
          }}

    - ansible.builtin.set_fact:
        semaphore_callback_row:
          hostname: "{{ _nbt_dev.hostname | default('', true) }}"
          ip: "{{ _nbt_dev.ip | default(inventory_hostname, true) }}"
          device_status: "{{ 'healthy' if not (need_reconfigure | default(true) | bool) else 'unhealthy' }}"
          winrm_status: "{{ 'online' if (_winrm_session_ok | default(false) | bool) else 'offline' }}"
          api_status: "{{ 'online' if not (need_reconfigure | default(true) | bool) else 'offline' }}"
          abnormal_reason: >-
            {% if not (_nbt_service_path_stat.stat.exists | default(false)) %}Service path not found: {{ service_path }}
            {% elif 'RUNNING' not in (_nbt_service_status.stdout | default('')) %}Service not running: {{ service_name }} ({{ _nbt_service_status.stdout | default('') | trim }})
            {% elif not (nbt_heartbeat_ok | default(false) | bool) %}Heartbeat stale or failed: last_send={{ nbt_heartbeat_last_send | default('n/a') }} age_min={{ nbt_heartbeat_age_minutes | default('n/a') }} max={{ nbt_heartbeat_max_age_minutes | default(90) }} http={{ _nbt_heartbeat.status | default('n/a') }}
            {% else %}{% endif %}

    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/debug_sync_api_patrol_snapshot.yml"

  post_tasks:
    - name: 写回 Semaphore 设备状态（post_tasks）
      run_once: true
      delegate_to: localhost
      block:
        - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"

- name: 写回 Semaphore 设备状态（独立 play）
  hosts: localhost
  gather_facts: false
  vars:
    sem_tasks_dir: "{{ playbook_dir }}/../shared/tasks"
    sem_files_dir: "{{ playbook_dir }}/../shared/files"
  tasks:
    - ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/semaphore_bulk_put_from_hostvars.yml"
