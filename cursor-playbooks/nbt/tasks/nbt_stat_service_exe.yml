---
# DEPRECATED: 服务 exe 存在性仅在 nbt_abort_if_service_exe_missing_at_start（启动前）检查。
# Patrol/check_restart 不再单独 stat exe。

- name: NBT 检查服务程序文件是否存在
  ansible.windows.win_stat:
    path: "{{ install_path }}"
  register: _nbt_service_path_stat
  ignore_unreachable: true
  when: nbt_service_exe_resolved | default(false) | bool

- name: NBT 登记服务 exe 未解析（跳过 win_stat）
  ansible.builtin.set_fact:
    _nbt_service_path_stat:
      stat:
        exists: false
  when: not (nbt_service_exe_resolved | default(false) | bool)
