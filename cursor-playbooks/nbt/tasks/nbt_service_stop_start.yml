---
# NBT: Windows service stop/start (no INI). Vars: nbt_service_stop_first, nbt_start_check_api,
# nbt_include_reset_data, merged_cfg, _nbt_target_host.

- name: 停止 NBT Windows 服务（重启前）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/nbt_windows_service_stop.yml"
  when: nbt_service_stop_first | default(true) | bool

- name: 启动 NBT Windows 服务
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/nbt_windows_service_start.yml"

- name: NBT 启动后心跳检查（轮询 SendStatus）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/nbt_api_heartbeat_start_poll.yml"
  when:
    - not (start_aborted_exe_missing | default(false) | bool)
    - nbt_start_check_api | default(false) | bool

- name: NBT ResetData（仅 restart）
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/nbt_api_reset_data.yml"
  when: >
    not (start_aborted_exe_missing | default(false) | bool)
    and (nbt_include_reset_data | default(false) | bool)
    and (merged_cfg.ResetData | default({}) | length > 0)
    and (nbt_heartbeat_ok | default(false) | bool)
