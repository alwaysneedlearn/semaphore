---
# After service start: poll GET /SendStatus until HTTP 200.
# until/retries must be on uri (not include_tasks) for older Ansible.

- name: 启动后轮询 NBT 心跳（SendStatus）
  ansible.builtin.uri:
    url: "{{ nbt_api_scheme }}://{{ _nbt_target_host }}:{{ nbt_api_port }}{{ nbt_api_heartbeat_path }}"
    method: GET
    timeout: "{{ nbt_api_timeout }}"
    validate_certs: "{{ nbt_api_verify_tls }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  register: _nbt_heartbeat
  delegate_to: localhost
  failed_when: false
  until: >
    _nbt_heartbeat is defined and
    (_nbt_heartbeat.status | default(0) | int) == 200
  retries: "{{ nbt_heartbeat_start_poll_retries | default(6) | int }}"
  delay: "{{ nbt_heartbeat_start_poll_delay | default(10) | int }}"
  timeout: "{{ uri_poll_task_timeout_sec | default(300) | int }}"

- name: NBT 解析 SendStatus
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/parse_sendstatus_heartbeat.yml"
  vars:
    sem_hb_uri_result: "{{ _nbt_heartbeat }}"
    sem_hb_max_age_minutes: "{{ nbt_heartbeat_max_age_minutes | default(90) | int }}"

- name: NBT 登记心跳判定结果
  ansible.builtin.set_fact:
    nbt_heartbeat_http_ok: "{{ sem_hb_http_ok | default(false) | bool }}"
    nbt_heartbeat_last_send: "{{ sem_hb_last_send | default('', true) | string }}"
    nbt_heartbeat_age_minutes: "{{ sem_hb_age_minutes | default('n/a') }}"
    nbt_heartbeat_ok: "{{ sem_hb_ok | default(false) | bool }}"
    nbt_heartbeat_message: "{{ sem_hb_message | default('', true) | string }}"
    _nbt_api_status: "{{ _nbt_heartbeat }}"

- name: DEBUG NBT 启动后心跳轮询
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat_poll retries={{ nbt_heartbeat_start_poll_retries | default(6) }} delay_s={{ nbt_heartbeat_start_poll_delay | default(10) }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat_poll attempts={{ _nbt_heartbeat.attempts | default(1) }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat_poll ok={{ nbt_heartbeat_ok | default(false) }} is_success={{ sem_hb_is_success | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat_poll last_http={{ _nbt_heartbeat.status | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('NBT') }}] heartbeat_poll last_send={{ nbt_heartbeat_last_send | default('n/a') }} message={{ nbt_heartbeat_message | default('') }}"
  when: _nbt_heartbeat is defined
