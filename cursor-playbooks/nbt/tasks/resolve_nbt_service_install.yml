---
# Resolve NBT service exe under SERVICE_PATH (parent directory) + SERVICE_NAME.exe.
# Sets: service_exe_path, service_path (install dir), install_path (= exe), service_parent_dir (= base).
# Script in nbt/files/ avoids inline PowerShell { } confusing Ansible Jinja on older runners.

- name: NBT 下发服务路径解析脚本
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/files/sem_resolve_nbt_service_install.ps1"
    dest: C:\Windows\Temp\sem_resolve_nbt_service_install.ps1
  changed_when: false

- name: NBT 解析服务 exe 路径（SERVICE_PATH 目录 + SERVICE_NAME）
  environment:
    NBT_SERVICE_BASE_DIR: "{{ service_base_dir | default(service_path, true) }}"
    NBT_SERVICE_NAME: "{{ service_name }}"
    NBT_SERVICE_EXE_NAME: "{{ service_exe_name }}"
    NBT_SERVICE_SCAN_MAX_DEPTH: "{{ nbt_service_scan_max_depth | default(((lookup('env', 'NBT_SERVICE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('3', true)) | int) | string }}"
    NBT_SERVICE_SCAN_LATEST: "{{ (nbt_service_scan_latest | default(((lookup('env', 'NBT_SERVICE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool)) | string | lower }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_resolve_nbt_service_install.ps1
  args:
    chdir: C:\Windows\Temp
  register: _nbt_resolve_service_install
  changed_when: false

- name: NBT 登记解析后的服务路径
  ansible.builtin.set_fact:
    _nbt_resolve_exe_line: "{{ (_nbt_resolve_service_install.stdout_lines | default([]) | select('match', '^SERVICE_EXE_PATH=') | list | first) | default('SERVICE_EXE_PATH=', true) }}"
    _nbt_resolve_install_line: "{{ (_nbt_resolve_service_install.stdout_lines | default([]) | select('match', '^SERVICE_INSTALL_DIR=') | list | first) | default('SERVICE_INSTALL_DIR=', true) }}"
    _nbt_resolve_base_line: "{{ (_nbt_resolve_service_install.stdout_lines | default([]) | select('match', '^SERVICE_BASE_DIR=') | list | first) | default('SERVICE_BASE_DIR=', true) }}"
    _nbt_resolve_source_line: "{{ (_nbt_resolve_service_install.stdout_lines | default([]) | select('match', '^SERVICE_RESOLVE_SOURCE=') | list | first) | default('SERVICE_RESOLVE_SOURCE=', true) }}"

- name: NBT 应用解析后的服务安装路径
  ansible.builtin.set_fact:
    service_exe_path: "{{ (_nbt_resolve_exe_line | regex_replace('^SERVICE_EXE_PATH=', '') | trim) }}"
    service_path: "{{ (_nbt_resolve_install_line | regex_replace('^SERVICE_INSTALL_DIR=', '') | trim) }}"
    install_path: "{{ (_nbt_resolve_exe_line | regex_replace('^SERVICE_EXE_PATH=', '') | trim) }}"
    service_parent_dir: "{{ (_nbt_resolve_base_line | regex_replace('^SERVICE_BASE_DIR=', '') | trim) }}"
    _nbt_service_resolve_source: "{{ (_nbt_resolve_source_line | regex_replace('^SERVICE_RESOLVE_SOURCE=', '') | trim) }}"
    nbt_service_exe_resolved: "{{ ((_nbt_resolve_exe_line | regex_replace('^SERVICE_EXE_PATH=', '') | trim) | length) > 0 }}"
    redeploy_zip_dest: "{{ (_nbt_resolve_base_line | regex_replace('^SERVICE_BASE_DIR=', '') | trim) }}\\{{ zip_name | default('nbt.zip', true) }}"
    redeploy_extract_dest: "{{ (_nbt_resolve_base_line | regex_replace('^SERVICE_BASE_DIR=', '') | trim) }}"

- name: NBT DEBUG 服务路径解析
  ansible.builtin.debug:
    msg:
      - "[DEBUG-NBT] service_base_dir={{ service_base_dir | default(service_path, true) }}"
      - "[DEBUG-NBT] windows_service_name={{ service_name }} exe_file={{ service_exe_name | default('') }}"
      - "[DEBUG-NBT] resolve_source={{ _nbt_service_resolve_source | default('n/a') }} exe_resolved={{ nbt_service_exe_resolved | default(false) }}"
      - "[DEBUG-NBT] service_exe_path={{ service_exe_path | default('') }}"
      - "[DEBUG-NBT] service_path(install_dir)={{ service_path | default('') }}"
      - "[DEBUG-NBT] service_parent_dir(zip)={{ service_parent_dir | default('') }}"
      - "[DEBUG-NBT] install_path={{ install_path | default('') }}"
