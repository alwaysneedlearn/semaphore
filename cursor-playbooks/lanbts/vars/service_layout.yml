---
# LANBTS service install layout (copied from NBT; no redeploy zip vars).
# SERVICE_NAME = exe file; LANBTS_SERVICE_NAME = Windows service name.
# SERVICE_PATH / LANBTS_SERVICE_PATH = parent directory to search under.

service_name: "{{ (lookup('env', 'LANBTS_SERVICE_NAME') | default('', true) | trim) | default('NBTMESService', true) }}"
service_base_dir: "{{ (lookup('env', 'LANBTS_SERVICE_PATH') | default(lookup('env', 'SERVICE_PATH') | default('', true), true) | trim) | default('D:\\MES', true) }}"
service_exe_name: >-
  {{
    (
      (lookup('env', 'SERVICE_NAME') | default('', true) | trim)
      | regex_replace('(?i)\\.exe$', '')
    )
    ~ '.exe'
    if ((lookup('env', 'SERVICE_NAME') | default('', true) | trim) | length > 0)
    else 'NBT.MES.Service.exe'
  }}
service_path: "{{ service_base_dir }}"
install_path: "{{ service_base_dir }}\\{{ service_exe_name }}"
service_parent_dir: "{{ service_base_dir }}"
lanbts_service_scan_max_depth: "{{ ((lookup('env', 'LANBTS_SERVICE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('3', true)) | int }}"
lanbts_service_scan_latest: "{{ ((lookup('env', 'LANBTS_SERVICE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool }}"
