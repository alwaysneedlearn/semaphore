---
# After service start: poll GET /SendStatus until HTTP 200.
# until/retries must be on uri (not include_tasks) for older Ansible.

- name: 启动后轮询 LANBTS 心跳（SendStatus）
  ansible.builtin.uri:
    url: "{{ lanbts_api_scheme }}://{{ _lanbts_target_host }}:{{ lanbts_api_port }}{{ lanbts_api_heartbeat_path }}"
    method: GET
    timeout: "{{ lanbts_api_timeout }}"
    validate_certs: "{{ lanbts_api_verify_tls }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  register: _lanbts_heartbeat
  delegate_to: localhost
  failed_when: false
  until: >
    _lanbts_heartbeat is defined and
    (_lanbts_heartbeat.status | default(0) | int) == 200
  retries: "{{ lanbts_heartbeat_start_poll_retries | default(6) | int }}"
  delay: "{{ lanbts_heartbeat_start_poll_delay | default(10) | int }}"
  timeout: "{{ uri_poll_task_timeout_sec | default(300) | int }}"

- name: LANBTS 解析 SendStatus
  ansible.builtin.include_tasks: "{{ sem_tasks_dir }}/parse_sendstatus_heartbeat.yml"
  vars:
    sem_hb_uri_result: "{{ _lanbts_heartbeat }}"
    sem_hb_max_age_minutes: "{{ lanbts_heartbeat_max_age_minutes | default(90) | int }}"

- name: LANBTS 登记心跳判定结果
  ansible.builtin.set_fact:
    lanbts_heartbeat_http_ok: "{{ sem_hb_http_ok | default(false) | bool }}"
    lanbts_heartbeat_last_send: "{{ sem_hb_last_send | default('', true) | string }}"
    lanbts_heartbeat_age_minutes: "{{ sem_hb_age_minutes | default('n/a') }}"
    lanbts_heartbeat_ok: "{{ sem_hb_ok | default(false) | bool }}"
    lanbts_heartbeat_message: "{{ sem_hb_message | default('', true) | string }}"
    _lanbts_api_status: "{{ _lanbts_heartbeat }}"

- name: DEBUG LANBTS 启动后心跳轮询
  ansible.builtin.debug:
    msg:
      - "[DEBUG-{{ sem_debug_tag | default('LANBTS') }}] heartbeat_poll retries={{ lanbts_heartbeat_start_poll_retries | default(6) }} delay_s={{ lanbts_heartbeat_start_poll_delay | default(10) }}"
      - "[DEBUG-{{ sem_debug_tag | default('LANBTS') }}] heartbeat_poll attempts={{ _lanbts_heartbeat.attempts | default(1) }}"
      - "[DEBUG-{{ sem_debug_tag | default('LANBTS') }}] heartbeat_poll ok={{ lanbts_heartbeat_ok | default(false) }} is_success={{ sem_hb_is_success | default(false) }}"
      - "[DEBUG-{{ sem_debug_tag | default('LANBTS') }}] heartbeat_poll last_http={{ _lanbts_heartbeat.status | default('n/a') }}"
      - "[DEBUG-{{ sem_debug_tag | default('LANBTS') }}] heartbeat_poll response_body={{ _lanbts_heartbeat.content | default('') | string | truncate(1500, True) }}"
      - "[DEBUG-{{ sem_debug_tag | default('LANBTS') }}] heartbeat_poll last_send={{ lanbts_heartbeat_last_send | default('n/a') }} message={{ lanbts_heartbeat_message | default('') }}"
  when: _lanbts_heartbeat is defined
