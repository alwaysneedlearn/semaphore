---
# Resolve LANBTS service exe under SERVICE_PATH (parent directory) + SERVICE_NAME.exe.
# Sets: service_exe_path, service_path (install dir), install_path (= exe), service_parent_dir (= base).
# Script in lanbts/files/ avoids inline PowerShell { } confusing Ansible Jinja on older runners.
# 前置：deploy_sem_windows_helper_scripts.yml（批量复制 playbook_dir/files/）

- name: LANBTS 解析服务 exe 路径（SERVICE_PATH 目录 + SERVICE_NAME）
  environment:
    LANBTS_SERVICE_BASE_DIR: "{{ service_base_dir | default(service_path, true) }}"
    LANBTS_SERVICE_NAME: "{{ service_name }}"
    LANBTS_SERVICE_EXE_NAME: "{{ service_exe_name }}"
    LANBTS_SERVICE_SCAN_MAX_DEPTH: "{{ lanbts_service_scan_max_depth | default(((lookup('env', 'LANBTS_SERVICE_SCAN_MAX_DEPTH') | default('', true) | trim) | default('3', true)) | int) | string }}"
    LANBTS_SERVICE_SCAN_LATEST: "{{ (lanbts_service_scan_latest | default(((lookup('env', 'LANBTS_SERVICE_SCAN_LATEST') | default('', true) | trim) | default('true', true)) | bool)) | string | lower }}"
  ansible.windows.win_shell: >-
    powershell.exe -NoProfile -ExecutionPolicy Bypass
    -File C:\Windows\Temp\sem_resolve_lanbts_service_install.ps1
  args:
    chdir: C:\Windows\Temp
  register: _lanbts_resolve_service_install
  changed_when: false
  timeout: "{{ winrm_shell_quick_timeout_sec | default(120) | int }}"
- name: LANBTS 登记解析后的服务路径
  ansible.builtin.set_fact:
    _lanbts_resolve_exe_line: "{{ (_lanbts_resolve_service_install.stdout_lines | default([]) | select('match', '^SERVICE_EXE_PATH=') | list | first) | default('SERVICE_EXE_PATH=', true) }}"
    _lanbts_resolve_install_line: "{{ (_lanbts_resolve_service_install.stdout_lines | default([]) | select('match', '^SERVICE_INSTALL_DIR=') | list | first) | default('SERVICE_INSTALL_DIR=', true) }}"
    _lanbts_resolve_base_line: "{{ (_lanbts_resolve_service_install.stdout_lines | default([]) | select('match', '^SERVICE_BASE_DIR=') | list | first) | default('SERVICE_BASE_DIR=', true) }}"
    _lanbts_resolve_source_line: "{{ (_lanbts_resolve_service_install.stdout_lines | default([]) | select('match', '^SERVICE_RESOLVE_SOURCE=') | list | first) | default('SERVICE_RESOLVE_SOURCE=', true) }}"

- name: LANBTS 应用解析后的服务安装路径
  ansible.builtin.set_fact:
    service_exe_path: "{{ (_lanbts_resolve_exe_line | regex_replace('^SERVICE_EXE_PATH=', '') | trim) }}"
    service_path: "{{ (_lanbts_resolve_install_line | regex_replace('^SERVICE_INSTALL_DIR=', '') | trim) }}"
    install_path: "{{ (_lanbts_resolve_exe_line | regex_replace('^SERVICE_EXE_PATH=', '') | trim) }}"
    service_parent_dir: "{{ (_lanbts_resolve_base_line | regex_replace('^SERVICE_BASE_DIR=', '') | trim) }}"
    _lanbts_service_resolve_source: "{{ (_lanbts_resolve_source_line | regex_replace('^SERVICE_RESOLVE_SOURCE=', '') | trim) }}"
    lanbts_service_exe_resolved: "{{ ((_lanbts_resolve_exe_line | regex_replace('^SERVICE_EXE_PATH=', '') | trim) | length) > 0 }}"

- name: LANBTS DEBUG 服务路径解析
  ansible.builtin.debug:
    msg:
      - "[DEBUG-LANBTS] service_base_dir={{ service_base_dir | default(service_path, true) }}"
      - "[DEBUG-LANBTS] windows_service_name={{ service_name }} exe_file={{ service_exe_name | default('') }}"
      - "[DEBUG-LANBTS] resolve_source={{ _lanbts_service_resolve_source | default('n/a') }} exe_resolved={{ lanbts_service_exe_resolved | default(false) }}"
      - "[DEBUG-LANBTS] service_exe_path={{ service_exe_path | default('') }}"
      - "[DEBUG-LANBTS] service_path(install_dir)={{ service_path | default('') }}"
      - "[DEBUG-LANBTS] service_parent_dir={{ service_parent_dir | default('') }}"
      - "[DEBUG-LANBTS] install_path={{ install_path | default('') }}"
