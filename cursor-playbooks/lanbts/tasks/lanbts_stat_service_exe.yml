---
# DEPRECATED: 服务 exe 存在性仅在 lanbts_abort_if_service_exe_missing_at_start（启动前）检查。
# Patrol/check_restart 不再单独 stat exe。

- name: LANBTS 检查服务程序文件是否存在
  ansible.windows.win_stat:
    path: "{{ install_path }}"
  register: _lanbts_service_path_stat
  ignore_unreachable: true
  when: lanbts_service_exe_resolved | default(false) | bool
  timeout: "{{ winrm_shell_quick_timeout_sec | default(120) | int }}"
- name: LANBTS 登记服务 exe 未解析（跳过 win_stat）
  ansible.builtin.set_fact:
    _lanbts_service_path_stat:
      stat:
        exists: false
  when: not (lanbts_service_exe_resolved | default(false) | bool)
