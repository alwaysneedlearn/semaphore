---
# Start LANBTS Windows service. Vars: service_name, install_path / service_exe_path (optional pre-check).

- name: LANBTS 启动前检查服务 exe 是否存在
  ansible.builtin.include_tasks: lanbts_abort_if_service_exe_missing_at_start.yml

- name: 启动 LANBTS Windows 服务
  ansible.windows.win_service:
    name: "{{ service_name }}"
    state: started
  register: _lanbts_service_start_action
  timeout: "{{ winrm_shell_quick_timeout_sec | default(120) | int }}"
- name: 确认 LANBTS 服务已启动
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/lanbts_windows_service_status.yml"
