---
# Stop LANBTS Windows service. Vars: service_name.

- name: 停止 LANBTS Windows 服务
  ansible.windows.win_service:
    name: "{{ service_name }}"
    state: stopped
  register: _lanbts_service_stop_action
  timeout: "{{ winrm_shell_quick_timeout_sec | default(120) | int }}"
- name: 确认 LANBTS 服务已停止
  ansible.builtin.include_tasks: "{{ sem_profile_tasks_dir }}/lanbts_windows_service_status.yml"
