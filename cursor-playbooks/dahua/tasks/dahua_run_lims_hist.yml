---
# Run lims-hist.exe on the Windows host (CTSPro → LIMS Kafka).
# Expects: dahua_lims_from, dahua_lims_to (ISO local: 2006-01-02T15:04:05).
# Env (Variable Group): LIMS_HIST_EXE, optional LIMS_HIST_KAFKA_CFG / LIMS_HIST_ROOT / flags.

- name: 解析 lims-hist 路径与可选参数
  ansible.builtin.set_fact:
    lims_hist_exe: >-
      {{
        (lookup('env', 'LIMS_HIST_EXE') | default('', true) | trim)
        | default('C:\\Apps\\lims-hist\\lims-hist.exe', true)
      }}
    lims_hist_kafka_cfg: "{{ lookup('env', 'LIMS_HIST_KAFKA_CFG') | default('', true) | trim }}"
    lims_hist_root: "{{ lookup('env', 'LIMS_HIST_ROOT') | default('', true) | trim }}"
    lims_hist_equip_no: "{{ lookup('env', 'LIMS_HIST_EQUIP_NO') | default('', true) | trim }}"
    lims_hist_state_dir: "{{ lookup('env', 'LIMS_HIST_STATE_DIR') | default('', true) | trim }}"
    lims_hist_log_level: "{{ lookup('env', 'LIMS_HIST_LOG_LEVEL') | default('', true) | trim }}"
    lims_hist_max_depth: "{{ lookup('env', 'LIMS_HIST_MAX_DEPTH') | default('', true) | trim }}"
    lims_hist_batch_size: "{{ lookup('env', 'LIMS_HIST_BATCH_SIZE') | default('', true) | trim }}"
    lims_hist_resume: "{{ ((lookup('env', 'LIMS_HIST_RESUME') | default('', true) | trim) | default('false', true)) | bool }}"
    lims_hist_rescan: "{{ ((lookup('env', 'LIMS_HIST_RESCAN') | default('', true) | trim) | default('false', true)) | bool }}"
    lims_hist_dry_run: "{{ ((lookup('env', 'LIMS_HIST_DRY_RUN') | default('', true) | trim) | default('false', true)) | bool }}"
    lims_hist_no_step_end: "{{ ((lookup('env', 'LIMS_HIST_NO_STEP_END') | default('', true) | trim) | default('false', true)) | bool }}"
    lims_hist_no_schedule: "{{ ((lookup('env', 'LIMS_HIST_NO_SCHEDULE') | default('', true) | trim) | default('false', true)) | bool }}"
    lims_hist_timeout_sec: "{{ ((lookup('env', 'LIMS_HIST_TIMEOUT_SEC') | default('', true) | trim) | default('7200', true)) | int }}"

- name: 校验 lims-hist 时间窗
  ansible.builtin.assert:
    that:
      - (dahua_lims_from | default('') | string | trim | length) > 0
      - (dahua_lims_to | default('') | string | trim | length) > 0
    fail_msg: "DAHUA lims-hist requires dahua_lims_from / dahua_lims_to (from resend_params)"

- name: 检查 lims-hist.exe 是否存在
  ansible.windows.win_stat:
    path: "{{ lims_hist_exe }}"
  register: _lims_hist_stat
  when: _winrm_session_ok | default(false) | bool

- name: lims-hist.exe 缺失则失败
  ansible.builtin.fail:
    msg: >-
      lims-hist.exe not found at {{ lims_hist_exe }}.
      Install the tool or set Variable Group LIMS_HIST_EXE.
  when:
    - _winrm_session_ok | default(false) | bool
    - not (_lims_hist_stat.stat.exists | default(false) | bool)

- name: 执行 lims-hist（历史原始数据上送 LIMS Kafka）
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Continue'
    $exe = @'
    {{ lims_hist_exe }}
    '@.Trim()
    $argList = New-Object System.Collections.Generic.List[string]
    $argList.Add('-from')
    $argList.Add(@'
    {{ dahua_lims_from }}
    '@.Trim())
    $argList.Add('-to')
    $argList.Add(@'
    {{ dahua_lims_to }}
    '@.Trim())
    $kafkaCfg = @'
    {{ lims_hist_kafka_cfg }}
    '@.Trim()
    if ($kafkaCfg -ne '') {
      $argList.Add('-kafka-cfg')
      $argList.Add($kafkaCfg)
    }
    $root = @'
    {{ lims_hist_root }}
    '@.Trim()
    if ($root -ne '') {
      $argList.Add('-root')
      $argList.Add($root)
    }
    $equip = @'
    {{ lims_hist_equip_no }}
    '@.Trim()
    if ($equip -ne '') {
      $argList.Add('-equip-no')
      $argList.Add($equip)
    }
    $stateDir = @'
    {{ lims_hist_state_dir }}
    '@.Trim()
    if ($stateDir -ne '') {
      $argList.Add('-state-dir')
      $argList.Add($stateDir)
    }
    $logLevel = @'
    {{ lims_hist_log_level }}
    '@.Trim()
    if ($logLevel -ne '') {
      $argList.Add('-log-level')
      $argList.Add($logLevel)
    }
    $maxDepth = @'
    {{ lims_hist_max_depth }}
    '@.Trim()
    if ($maxDepth -ne '') {
      $argList.Add('-max-depth')
      $argList.Add($maxDepth)
    }
    $batchSize = @'
    {{ lims_hist_batch_size }}
    '@.Trim()
    if ($batchSize -ne '') {
      $argList.Add('-batch-size')
      $argList.Add($batchSize)
    }
    {% if lims_hist_resume | bool %}
    $argList.Add('-resume')
    {% endif %}
    {% if lims_hist_rescan | bool %}
    $argList.Add('-rescan')
    {% endif %}
    {% if lims_hist_dry_run | bool %}
    $argList.Add('-dry-run')
    {% endif %}
    {% if lims_hist_no_step_end | bool %}
    $argList.Add('-no-step-end')
    {% endif %}
    {% if lims_hist_no_schedule | bool %}
    $argList.Add('-no-schedule')
    {% endif %}
    Write-Output ("[DEBUG-DAHUA] lims-hist exe=" + $exe)
    Write-Output ("[DEBUG-DAHUA] lims-hist args=" + ($argList -join ' '))
    & $exe @argList
    $code = $LASTEXITCODE
    Write-Output ("[DEBUG-DAHUA] lims-hist exit=" + $code)
    exit $code
  args:
    executable: powershell.exe
  vars:
    ansible_winrm_operation_timeout_sec: "{{ lims_hist_timeout_sec | int }}"
    ansible_winrm_read_timeout_sec: "{{ (lims_hist_timeout_sec | int) + 100 }}"
  register: _dahua_lims_hist
  failed_when: false
  when: _winrm_session_ok | default(false) | bool

- name: 登记 lims-hist 结果
  ansible.builtin.set_fact:
    dahua_lims_hist_rc: "{{ _dahua_lims_hist.rc | default(1) | int }}"
    dahua_lims_hist_ok: "{{ (_dahua_lims_hist.rc | default(1) | int) == 0 }}"
    dahua_lims_hist_stdout: "{{ (_dahua_lims_hist.stdout | default('')) | string }}"
    dahua_lims_hist_stderr: "{{ (_dahua_lims_hist.stderr | default('')) | string }}"
  when: _winrm_session_ok | default(false) | bool

- name: 登记 lims-hist 跳过（WinRM 未通）
  ansible.builtin.set_fact:
    dahua_lims_hist_rc: 1
    dahua_lims_hist_ok: false
    dahua_lims_hist_stdout: ''
    dahua_lims_hist_stderr: 'WinRM unreachable; lims-hist not run'
  when: not (_winrm_session_ok | default(false) | bool)

- name: DEBUG DAHUA lims-hist
  ansible.builtin.debug:
    msg:
      - "[DEBUG-DAHUA] from={{ dahua_lims_from }} to={{ dahua_lims_to }}"
      - "[DEBUG-DAHUA] exe={{ lims_hist_exe }}"
      - "[DEBUG-DAHUA] ok={{ dahua_lims_hist_ok }} rc={{ dahua_lims_hist_rc }}"
      - "[DEBUG-DAHUA] stdout_tail={{ dahua_lims_hist_stdout | truncate(800, True) }}"
      - "[DEBUG-DAHUA] stderr_tail={{ dahua_lims_hist_stderr | truncate(400, True) }}"
