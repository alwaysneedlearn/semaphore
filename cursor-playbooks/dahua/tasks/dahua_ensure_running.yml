---
# DAHUA：若 CTSMonPro（或 PROCESS_NAME / EXE_NAME 指定进程）未运行则启动（不停止）。
# 需要 play 已完成 winrm_ensure_reachable + deploy_sem_windows_helper_scripts。
# 需要 play vars：exe_path, exe_name, exe_args, process_name, restart_delay,
#   process_verify_poll_seconds, _reconfig_profile_user（由启动前步骤获取）。

- name: 检查 DAHUA 进程是否运行
  ansible.windows.win_shell: |
    $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($null -ne $p) {
      $wsMb = [math]::Round($p.WorkingSet64 / 1MB, 1)
      "RUNNING|pid=$($p.Id)|ws=${wsMb}MB|path=$($p.Path)"
    } else {
      "NOT_RUNNING"
    }
  register: _dahua_process_check
  changed_when: false
  failed_when: false

- name: 登记进程已在运行
  ansible.builtin.set_fact:
    dahua_process_running: true
    dahua_started_this_run: false
    dahua_ensure_ok: true
  when: ((_dahua_process_check.stdout | default('') | trim).split('|') | first) == 'RUNNING'

- name: 进程未运行则启动
  when: ((_dahua_process_check.stdout | default('') | trim).split('|') | first) != 'RUNNING'
  block:
    - name: 启动 CTSMonPro
      environment:
        SEMAPHORE_EXE_PATH: "{{ exe_path }}"
        SEMAPHORE_EXE_NAME: "{{ exe_name }}"
        PROCESS_ALIVE_MIN_HANDLES: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_HANDLES') | default('', true) | trim) | default('1', true) }}"
        PROCESS_ALIVE_MIN_WS_KB: "{{ (lookup('env', 'PROCESS_ALIVE_MIN_WS_KB') | default('', true) | trim) | default('512', true) }}"
        SEMAPHORE_EXE_ARGS: "{{ exe_args | default('', true) }}"
        SEMAPHORE_PROFILE_USER: "{{ _reconfig_profile_user }}"
        SEMAPHORE_RESTART_DELAY: "{{ restart_delay | string }}"
        SEMAPHORE_PROCESS_VERIFY_POLL_SECONDS: "{{ process_verify_poll_seconds | default(5) | string }}"
        SEMAPHORE_TASK_NAME: "Start-{{ exe_name }}"
        SEMAPHORE_START_POPUP_KEYWORD: ""
        SEMAPHORE_START_POPUP_WAIT_SECONDS: "0"
        SEMAPHORE_START_POPUP_MATCH_MODE: "title_or_content"
      ansible.builtin.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Temp\sem_reconfig_start_program_windows.ps1
      register: _dahua_start_result
      failed_when: false

    - name: 登记启动脚本输出
      ansible.builtin.set_fact:
        _dahua_start_stdout: "{{ (_dahua_start_result.stdout | default('')) | string }}"
        _dahua_start_stderr: "{{ (_dahua_start_result.stderr | default('')) | string }}"
        _dahua_exe_missing: "{{ 'EXE_NOT_FOUND_AT_START' in (_dahua_start_result.stdout | default('')) }}"
        _dahua_start_script_failed: >-
          {{
            ('START_ERROR' in (_dahua_start_result.stdout | default('')))
            or ('VERIFY_FAILED' in (_dahua_start_result.stdout | default('')))
            or ('EXE_NOT_FOUND_AT_START' in (_dahua_start_result.stdout | default('')))
          }}

    - name: 启动后确认进程
      ansible.windows.win_shell: |
        $p = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -ne $p) {
          $wsMb = [math]::Round($p.WorkingSet64 / 1MB, 1)
          "RUNNING|pid=$($p.Id)|ws=${wsMb}MB|path=$($p.Path)"
        } else {
          "NOT_RUNNING"
        }
      register: _dahua_process_after
      changed_when: false
      failed_when: false
      when: not (_dahua_exe_missing | default(false) | bool)

    - name: 登记启动结果（exe 缺失）
      ansible.builtin.set_fact:
        dahua_process_running: false
        dahua_started_this_run: true
        dahua_ensure_ok: false
        host_failure_reason: "程序不存在，无法启动: {{ exe_path }}"
      when: _dahua_exe_missing | default(false) | bool

    - name: 登记启动结果（已尝试启动）
      ansible.builtin.set_fact:
        dahua_process_running: "{{ ((_dahua_process_after.stdout | default('') | trim).split('|') | first) == 'RUNNING' }}"
        dahua_started_this_run: true
        dahua_ensure_ok: "{{ ((_dahua_process_after.stdout | default('') | trim).split('|') | first) == 'RUNNING' }}"
      when:
        - not (_dahua_exe_missing | default(false) | bool)
        - _dahua_process_after is defined

- name: DEBUG DAHUA ensure-running
  ansible.builtin.debug:
    msg:
      - "[DEBUG-DAHUA] process={{ process_name }} exe_path={{ exe_path | default('') }}"
      - "[DEBUG-DAHUA] before={{ (_dahua_process_check.stdout | default('')) | truncate(200, True) }}"
      - "[DEBUG-DAHUA] after={{ (_dahua_process_after.stdout | default('(not started)')) | truncate(200, True) }}"
      - "[DEBUG-DAHUA] running={{ dahua_process_running | default(false) }} started={{ dahua_started_this_run | default(false) }} ok={{ dahua_ensure_ok | default(false) }}"
      - "[DEBUG-DAHUA] start_stdout={{ (_dahua_start_stdout | default('')) | truncate(400, True) }}"
