---
- name: 停止设备程序
  hosts: windows_hosts
  gather_facts: no
  vars:
    exe_name: "{{ lookup('env', 'EXE_NAME') | default('uu') }}"

  tasks:
    - name: 停止程序（仅执行 stop）
      block:
        - name: WinRM 执行 stop
          win_shell: |
            $proc = Get-Process -Name "{{ exe_name }}" -ErrorAction SilentlyContinue
            if ($proc) {
              try {
                Stop-Process -Name "{{ exe_name }}" -Force -ErrorAction Stop
                Start-Sleep -Seconds 2
                $verify = Get-Process -Name "{{ exe_name }}" -ErrorAction SilentlyContinue
                if (-not $verify) {
                  Write-Output "STOPPED"
                } else {
                  taskkill /F /T /IM "{{ exe_name }}.exe" 2>$null
                  Start-Sleep -Seconds 2
                  $verify2 = Get-Process -Name "{{ exe_name }}" -ErrorAction SilentlyContinue
                  if (-not $verify2) {
                    Write-Output "STOPPED_BY_TASKKILL"
                  } else {
                    Write-Output "STOP_FAILED"
                    exit 1
                  }
                }
              } catch {
                Write-Output "STOP_ERROR:$($_.Exception.Message)"
                exit 1
              }
            } else {
              Write-Output "NOT_RUNNING"
            }
          register: stop_result
          changed_when: "'STOPPED' in (stop_result.stdout | default('')) or 'STOPPED_BY_TASKKILL' in (stop_result.stdout | default(''))"
          failed_when: >
            stop_result is defined and 'stdout' in stop_result and
            ('STOP_FAILED' in stop_result.stdout or 'STOP_ERROR' in stop_result.stdout)

        - name: 输出停止结果
          ansible.builtin.debug:
            msg: "[STOP] {{ inventory_hostname }} -> {{ stop_result.stdout | default('NO_OUTPUT') | trim }}"
      always:
        - name: 登记 Semaphore 回调行
          ansible.builtin.set_fact:
            semaphore_callback_row:
              hostname: "{{ (_sem_dev | default({})).hostname | default(inventory_hostname, true) }}"
              device_status: >-
                {% if stop_result is failed %}unhealthy
                {% elif 'STOP_FAILED' in stop_result.stdout | default('') or 'STOP_ERROR' in stop_result.stdout | default('') %}unhealthy
                {% else %}unhealthy{% endif %}
              rdp_status: online
              winrm_status: online
          vars:
            _sem_dev: "{{ devices | default([]) | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(devices | default([]) | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"

- name: 写回 Semaphore 设备状态
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 执行 bulk 回调
      ansible.builtin.include_tasks: tasks/semaphore_bulk_put_from_hostvars.yml
