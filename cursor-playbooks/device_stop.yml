---
- name: 停止设备程序
  hosts: windows_hosts
  gather_facts: no
  vars:
    # Variable Group 环境变量（非空）优先，否则使用下列默认值
    exe_name: "{{ (lookup('env', 'EXE_NAME') | default('', true) | trim) | default('uu', true) }}"
    api_host: "{{ inventory_hostname }}"
    # 与 device_status / start 一致，避免 api_port 被 Jinja 解析成布尔
    api_port: "{% set hp = hostvars[inventory_hostname].api_port | default(0) %}{% if (hp | int) > 0 %}{{ hp | int }}{% else %}{{ (lookup('env', 'API_PORT') | default('', true) | trim) | default('9002', true) | int }}{% endif %}"
    api_status_call_type: "{{ ((lookup('env', 'API_STATUS_CALL_TYPE') | default('', true) | trim) | default('1', true)) | int }}"
    api_timeout_seconds: "{{ ((lookup('env', 'API_TIMEOUT_SECONDS') | default('', true) | trim) | default('15', true)) | int }}"
    _devices_from_extra: "{{ devices | default([]) }}"
    _device_singleton: "{{ [device] if (device is defined) else [] }}"
    _semaphore_device_rows: "{{ _devices_from_extra if (_devices_from_extra | length > 0) else _device_singleton }}"

  tasks:
    - name: WinRM 建连（含重试，须在其它 win_* 任务之前）
      ansible.builtin.include_tasks: tasks/winrm_ensure_reachable.yml

    - name: 一次性部署 Windows 辅助脚本
      ansible.builtin.include_tasks: tasks/deploy_sem_windows_helper_scripts.yml

    - name: 停止程序（仅执行 stop）
      block:
        - name: WinRM 执行 stop
          ansible.builtin.include_tasks: tasks/stop_program_windows.yml

        - name: 输出停止结果
          ansible.builtin.debug:
            msg: >-
              [STOP] {{ inventory_hostname }} ->
              {{ stop_result.stdout | default(stop_result.msg | default('NO_OUTPUT')) | trim }}
          when: stop_result is defined and not (stop_result.unreachable | default(false))

      ignore_unreachable: true

      always:
        - name: Stop 后 API 状态探测（仅排障日志；bulk 仍强制 api_status=offline）
          ansible.builtin.uri:
            url: "http://{{ api_host }}:{{ api_port }}"
            method: POST
            body_format: json
            body:
              CallType: "{{ api_status_call_type | int }}"
            headers:
              Content-Type: "application/json; charset=utf-8"
            return_content: true
            timeout: "{{ api_timeout_seconds | int }}"
          register: stop_api_probe
          delegate_to: localhost
          failed_when: false
          when: stop_result is defined and not (stop_result.unreachable | default(false))

        - name: DEBUG Stop 后 API 探测结果（成功也打印）
          ansible.builtin.debug:
            msg:
              - "[DEBUG-STOP-API] POST url=http://{{ api_host }}:{{ api_port }} CallType={{ api_status_call_type }}"
              - "[DEBUG-STOP-API] http_status={{ stop_api_probe.status | default('n/a') }}"
              - "[DEBUG-STOP-API] response_body={{ stop_api_probe.content | default('') }}"
          when: stop_api_probe is defined and not (stop_api_probe.skipped | default(false))

        - name: 登记 Semaphore 回调行
          ansible.builtin.set_fact:
            semaphore_callback_row:
              hostname: "{{ (_sem_dev | default({})).hostname | default(inventory_hostname, true) }}"
              ip: "{{ (_sem_dev | default({})).ip | default(inventory_hostname, true) }}"
              device_status: >-
                {% if stop_result is not defined %}unhealthy
                {% elif stop_result.unreachable | default(false) %}unhealthy
                {% else %}unhealthy{% endif %}
              winrm_status: "{{ 'offline' if (stop_result is defined and (stop_result.unreachable | default(false))) else 'online' }}"
              # 停服后业务 API 一律标 offline（与 Probe TCP 无关）；上方 uri 仅作验证日志
              api_status: offline
              abnormal_reason: >-
                {% if stop_result is not defined %}No task result
                {% elif stop_result.unreachable | default(false) %}{{ 'WinRM unreachable: ' ~ (stop_result.msg | default('') | trim) }}
                {% elif stop_result is failed %}{{ (stop_result.stdout | default('') | trim) or (stop_result.msg | default('stop failed')) }}
                {% elif stop_verify_result is defined and 'NOT_RUNNING' in (stop_verify_result.stdout | default('')) and ('STOP_FAILED' in stop_result.stdout | default('') or 'STOP_ERROR' in stop_result.stdout | default('')) %}Stop failed initially but process verified not running
                {% elif 'STOP_ERROR' in stop_result.stdout | default('') %}{{ stop_result.stdout | trim }}
                {% elif 'STOP_FAILED' in stop_result.stdout | default('') %}{{ stop_result.stdout | trim }}
                {% elif 'NOT_RUNNING' in stop_result.stdout | default('') %}Process was not running (already stopped)
                {% elif 'STOPPED' in stop_result.stdout | default('') or 'STOPPED_BY_TASKKILL' in stop_result.stdout | default('') %}Stop completed; process not running
                {% else %}{{ stop_result.stdout | default('') | trim }}
                {% endif %}
          vars:
            _sem_dev: "{{ _semaphore_device_rows | selectattr('ip', 'equalto', inventory_hostname) | list | first | default(_semaphore_device_rows | selectattr('hostname', 'equalto', inventory_hostname) | list | first, true) }}"

  post_tasks:
    - name: 写回 Semaphore 设备状态（post_tasks）
      ansible.builtin.include_tasks: tasks/semaphore_bulk_put_from_hostvars.yml
      run_once: true
      delegate_to: localhost
